<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — The Study Library</title>
<link rel="stylesheet" href="/public-assets/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>The Study Library</h1>
    <p>Enter the email you use for the Teacher's Circle newsletter. We'll check your subscription and let you straight in — no password to remember.</p>

    <form id="login-form" onsubmit="return false;">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      <button type="button" id="submit-btn">Enter the library</button>
      <div class="login-status" id="status"></div>
    </form>

    <div class="login-foot">
      Access is limited to active Teacher's Circle subscribers. Not a subscriber yet? <a href="https://insights.taylorhalverson.com/upgrade">Join here</a>.
    </div>
  </div>
</div>

<script>
  const form = document.getElementById('login-form');
  const status = document.getElementById('status');
  const btn = document.getElementById('submit-btn');

  const params = new URLSearchParams(window.location.search);
  const next = params.get('next') || '/';

  async function attemptLogin(e) {
    if (e) e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) return;

    btn.disabled = true;
    status.textContent = 'Checking your subscription…';
    status.className = 'login-status pending';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();

      if (data.ok) {
        status.textContent = 'Welcome — taking you in…';
        window.location.href = next;
      } else {
        let message = data.error || "We couldn't verify that subscription.";
        if (data.debug) {
          message += ' — debug: ' + JSON.stringify(data.debug);
        }
        status.textContent = message;
        status.className = 'login-status error';
        btn.disabled = false;
      }
    } catch (err) {
      status.textContent = 'Something went wrong. Try again in a moment.';
      status.className = 'login-status error';
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', attemptLogin);
  document.getElementById('email').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') attemptLogin(e);
  });
</script>
</body>
</html>
