<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Interactive Scripture Tools</title>
<link rel="stylesheet" href="/public-assets/style.css">
<style>
  :root {
    --parchment-a: #16202E;
    --parchment-b: #0E1520;
    --ink: #ECEAE0;
    --ink-soft: #A9B3C2;
    --gold: #D4AF5A;
    --gold-line: rgba(212, 175, 90, 0.3);
  }

  body {
    background: linear-gradient(160deg, var(--parchment-a) 0%, var(--parchment-b) 100%);
    min-height: 100vh;
    margin: 0;
  }

  .map-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .map-bg svg {
    width: 100%;
    height: 100%;
  }

  .attribution {
    position: relative;
    z-index: 1;
    text-align: left;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 18px;
    letter-spacing: 0.01em;
  }

  .attribution .prepared-by {
    color: var(--gold);
  }

  .login-wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    background: #1B2635;
    border: 1px solid var(--gold-line);
    border-radius: 4px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.2);
    padding: 44px 40px 36px;
    max-width: 440px;
    width: 100%;
  }

  .login-card::before {
    content: "";
    display: block;
    width: 56px;
    height: 3px;
    background: var(--gold);
    margin: 0 0 20px;
  }

  .login-card h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 27px;
    color: var(--ink);
    margin: 0 0 14px;
    line-height: 1.25;
  }

  .login-card > p {
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.55;
    margin: 0 0 26px;
  }

  .login-card label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .login-card input[type="email"] {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid #38465A;
    border-radius: 3px;
    margin-bottom: 18px;
    background: #0E1520;
    color: var(--ink);
  }

  .login-card button {
    width: 100%;
    padding: 13px 16px;
    background: var(--ink);
    color: #16202E;
    border: none;
    border-radius: 3px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
  }

  .login-card button:hover {
    background: #D6D3C6;
  }

  .login-status {
    min-height: 18px;
    font-size: 13px;
    margin-top: 10px;
  }

  .login-status.pending { color: var(--ink-soft); }
  .login-status.error { color: #E28A72; }

  .login-foot {
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid var(--gold-line);
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  .login-foot a {
    color: var(--gold);
    text-decoration: underline;
  }

  .login-blurb {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.6;
    margin: 0 0 18px;
  }
</style>
</head>
