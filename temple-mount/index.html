  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"22cd56fb-75ed-4432-b3a5-4e4625b3d4b6\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<style>\n  html,body{margin:0;padding:0;background:#17150f;}\n  *{box-sizing:border-box;}\n  a{color:#8a6a3c;text-decoration:underline;text-underline-offset:2px;}\n  a:hover{color:#c49b5b;}\n  :focus-visible{outline:2.5px solid #c49b5b;outline-offset:2px;}\n  @media (prefers-reduced-motion: reduce){\n    *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;}\n  }\n  ::-webkit-scrollbar{width:10px;height:10px}\n  ::-webkit-scrollbar-thumb{background:#c9bda6;border-radius:6px}\n  ::-webkit-scrollbar-track{background:transparent}\n  input[type=range]{accent-color:#c49b5b;}\n  html[data-tm-dark=\"1\"] [data-tm-read]{filter:invert(1) hue-rotate(180deg);}\n  html[data-tm-dark=\"1\"] ::-webkit-scrollbar-thumb{background:#4a4231}\n  [data-plan] polygon,[data-plan] rect,[data-plan] circle,[data-plan] ellipse,[data-plan] line,[data-plan] path,[data-plan] polyline{filter:saturate(var(--tm-plan-sat,.34)) contrast(1.05)}\n  @keyframes tm-rise{from{opacity:0;transform:translate(0,18px) scale(.986)}to{opacity:1;transform:none}}\n  html[data-tm-dark=\"0\"] [data-tm-stage]{filter:invert(1) hue-rotate(180deg) sepia(.10) saturate(1.06);background:#17150f;}\n  html[data-tm-dark=\"0\"] [data-tm-stage] svg{filter:invert(1) hue-rotate(180deg) sepia(.10) saturate(.95);}\n  html[data-tm-dark=\"0\"],html[data-tm-dark=\"0\"] body{background:#e9e3d6;}\n  /* Touch density. The control styles are generated for the desktop layout and emitted at every\n     viewport, so the 44px floor has to be imposed here — and the range thumb is a pseudo-element\n     that cannot be reached from an inline style at all. Breakpoints mirror isCompact(). */\n  @media (max-width:820px),\n         (max-width:1180px) and (orientation:portrait),\n         (max-height:480px) and (max-width:900px){\n    [data-tm-stage] button,[data-panel=\"overlays\"] button,[data-panel=\"camera\"] button{\n      min-height:44px !important;display:inline-flex !important;align-items:center !important;\n      justify-content:center !important;padding-left:12px !important;padding-right:12px !important;}\n    [data-tm-stage] input[type=range]{height:28px !important;}\n    [data-tm-stage] input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#3a3327;}\n    [data-tm-stage] input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;\n      width:26px;height:26px;margin-top:-10px;border-radius:50%;background:#c49b5b;border:1px solid #17150f;}\n    [data-tm-stage] input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;\n      background:#c49b5b;border:1px solid #17150f;}\n    [data-panel=\"camera\"] label{min-height:44px;}\n    /* 44px chips wrapping in a 190px box turned this panel into 83% of the canvas. It scrolls\n       instead — but only its own rows are touched, each sized to its children, and the panel stops\n       short of the compass rather than sliding underneath it. */\n    [data-panel=\"overlays\"]{\n      right:auto !important;max-width:calc(100vw - 96px) !important;\n      max-height:34% !important;overflow:auto !important;z-index:6 !important;}\n    /* rows wrap and the panel scrolls on one axis only — nested horizontal scrollers left\n       four period chips reachable in theory and untappable in practice */\n    [data-panel=\"overlays\"] [data-ov-body] > div{\n      flex:0 0 auto !important;min-height:44px;align-items:center;\n      flex-wrap:wrap !important;overflow:visible !important;}\n  }\n  @media (max-height:520px) and (max-width:900px){\n    [data-tm-stage] > header{padding:4px 12px !important;}\n    [data-tm-main]{min-height:120px !important;padding:4px 8px !important;}\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"{{ rootStyle }}\">\n\n  <div data-tm-stage=\"\" style=\"{{ stageStyle }}\">\n\n    <header style=\"{{ headStyle }}\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;\">\n        <div style=\"display:flex;align-items:baseline;gap:12px;min-width:0;flex-wrap:wrap;\">\n          <div style=\"display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;\">\n            <div style=\"{{ nowStyle }}\"><span style=\"font:500 9.5px 'Courier New',monospace;letter-spacing:.1em;color:#c49b5b;\">{{ pOf }}<\u002Fspan><span style=\"font:400 15px/1.2 Georgia,'Times New Roman',serif;color:#efe6d4;\">{{ pTitle }}<\u002Fspan><span style=\"font:500 9.5px 'Courier New',monospace;letter-spacing:.06em;color:#968564;\">{{ pRange }}<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ brandStyle }}\">\n              <div style=\"font:400 clamp(15px,1.4vw,21px)/1.2 Georgia,'Times New Roman',serif;color:#efe6d4;\">The Temple Mount / al-Ḥaram al-Sharīf<\u002Fdiv>\n              <span style=\"font:500 9px/1 'Courier New',monospace;letter-spacing:.16em;color:#c49b5b;border:1px solid #5a4527;border-radius:2px;padding:3px 6px 2px;\">BETA<\u002Fspan>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ toggleHdr }}\" aria-expanded=\"{{ ovOpen }}\" style=\"{{ ovBtn }}\">{{ ovLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ toggleHdrHidden }}\" aria-expanded=\"{{ notHdrHidden }}\" title=\"Hide or show the header\" style=\"{{ hideBtnStyle }}\">{{ hideBtnLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"{{ instrStyle }}\">{{ vexNote }} · north lies {{ bearing }} — see the compass · drag to rotate, shift-drag to pan, scroll to zoom · scale is approximate and does not survive zoom<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ headCtl }}\">\n          <span style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.13em;color:#c49b5b;white-space:nowrap;\">STANDING LIMITATION<\u002Fspan>\n          <span style=\"font:400 11.5px/1.35 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#a9997d;\">The open esplanade has never undergone a controlled, systematic archaeological excavation.<\u002Fspan>\n          <button sc-camel-on-click=\"{{ toggleProj }}\" aria-pressed=\"false\" style=\"border:1px solid #4a3f28;background:#201c13;color:#a9997d;border-radius:2px;padding:2px 8px;font:500 10px 'Courier New',monospace;cursor:pointer;letter-spacing:.06em;white-space:nowrap;\" style-hover=\"border-color:#c49b5b;color:#c49b5b;\">PROJECT<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toggleDark }}\" aria-pressed=\"{{ dark }}\" title=\"Darken the reading panels\" style=\"border:1px solid #4a3f28;background:#201c13;color:#a9997d;border-radius:2px;padding:2px 8px;font:500 10px 'Courier New',monospace;cursor:pointer;letter-spacing:.06em;white-space:nowrap;\" style-hover=\"border-color:#c49b5b;color:#c49b5b;\">{{ darkLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ notCompact }}\">\n          <button sc-camel-on-click=\"{{ toggleAside }}\" aria-pressed=\"{{ asideOff }}\" title=\"Hide or show the reading panel\" style=\"{{ asideBtn }}\">{{ asideLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ openAbout }}\" data-about-open=\"1\" aria-haspopup=\"dialog\" aria-expanded=\"{{ aboutOpen }}\" style=\"border:1px solid #4a3f28;background:#201c13;color:#a9997d;border-radius:2px;padding:2px 8px;font:500 10px 'Courier New',monospace;cursor:pointer;letter-spacing:.06em;\" style-hover=\"border-color:#c49b5b;color:#c49b5b;\">ABOUT<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <sc-if value=\"{{ aboutOpen }}\">\n      <div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"about-title\" sc-camel-on-key-down=\"{{ trapFocus }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(10,9,6,.78);display:flex;align-items:flex-start;justify-content:center;padding:min(6vh,64px) 20px;overflow-y:auto;\">\n        <div data-tm-read=\"\" style=\"width:100%;max-width:880px;background:#f4efe6;border:1px solid #cdc0a6;border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden;\">\n\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:24px 30px 0;\">\n            <div>\n              <div style=\"display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;\">\n                <div id=\"about-title\" style=\"font:400 26px/1.2 Georgia,'Times New Roman',serif;color:#241f18;\">The Temple Mount / al-Ḥaram al-Sharīf<\u002Fdiv>\n                <span style=\"font:500 9px/1 'Courier New',monospace;letter-spacing:.16em;color:#8a6a3c;border:1px solid #c2ac86;border-radius:2px;padding:3px 6px 2px;\">BETA<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:6px;font:400 13px/1.5 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#6d6350;\">Twelve periods on one platform · prepared by Taylor Halverson, Ph.D.<\u002Fdiv>\n            <\u002Fdiv>\n            <button ref=\"{{ closeBtnRef }}\" data-about-close=\"1\" sc-camel-on-click=\"{{ closeAbout }}\" style=\"border:1px solid #cdc0a6;background:#eae3d4;color:#5d5342;border-radius:2px;padding:4px 9px;font:500 10px 'Courier New',monospace;cursor:pointer;flex:0 0 auto;white-space:nowrap;\" style-hover=\"border-color:#8a6a3c;color:#8a6a3c;\">CLOSE ✕<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div role=\"tablist\" aria-label=\"About sections\" style=\"display:flex;gap:26px;padding:18px 30px 0;border-bottom:1px solid #ddd2bd;flex-wrap:wrap;\">\n            <button data-el=\"1\" role=\"tab\" aria-selected=\"{{ isTab1 }}\" sc-camel-on-click=\"{{ setTab }}\" style=\"{{ tab1 }}\">The visualization<\u002Fbutton>\n            <button data-el=\"2\" role=\"tab\" aria-selected=\"{{ isTab2 }}\" sc-camel-on-click=\"{{ setTab }}\" style=\"{{ tab2 }}\">How to use it<\u002Fbutton>\n            <button data-el=\"3\" role=\"tab\" aria-selected=\"{{ isTab3 }}\" sc-camel-on-click=\"{{ setTab }}\" style=\"{{ tab3 }}\">Taylor Halverson, Ph.D.<\u002Fbutton>\n            <button data-el=\"4\" role=\"tab\" aria-selected=\"{{ isTab4 }}\" sc-camel-on-click=\"{{ setTab }}\" style=\"{{ tab4 }}\">Attributions and licensing<\u002Fbutton>\n            <button data-el=\"5\" role=\"tab\" aria-selected=\"{{ isTab5 }}\" sc-camel-on-click=\"{{ setTab }}\" style=\"{{ tab5 }}\">Terms, refunds &amp; license<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"padding:26px 30px 34px;\">\n\n            <sc-if value=\"{{ isTab1 }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;gap:26px;\">\n                <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;\">\n                  <div style=\"display:flex;flex-direction:column;gap:12px;\">\n                    <p style=\"margin:0;font:400 16px/1.7 Georgia,'Times New Roman',serif;color:#2c2823;\">One place, drawn twelve times. The slider follows the ridge and its later enclosure through Jerusalem's history — from a bare limestone ridge above a spring, through the First and Second Temple traditions, Aelia Capitolina and Byzantine Jerusalem, the early Islamic sanctuary, Crusader and later Islamic phases, and the Haram as it stands today.<\u002Fp>\n                    <p style=\"margin:0;font:400 16px/1.7 Georgia,'Times New Roman',serif;color:#2c2823;\">The view is axonometric — a plan seen from above at an angle — because elevation is most of the story here. What you are looking at is not a hill with buildings on it. It is a hill wrapped in a retaining box and filled to the brim, and the buildings sit on the fill.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:14px;\">\n                    <div style=\"border-left:2px solid #c49b5b;background:#ece4d3;padding:12px 15px;\">\n                      <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a6a3c;\">BETA<\u002Fdiv>\n                      <p style=\"margin:8px 0 0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Reconstructions, dates and confidence tags are still under review. Where scholars disagree, the visualization shows the disagreement rather than picking a winner — the Herodian sanctuary can be placed in any of the three locations that have been seriously argued for it.<\u002Fp>\n                    <\u002Fdiv>\n                    <div style=\"border-left:2px solid #a3a58c;background:#ece4d3;padding:12px 15px;\">\n                      <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#6c6c52;\">ON THE EVIDENCE<\u002Fdiv>\n                      <p style=\"margin:8px 0 0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">The open esplanade has never undergone a controlled, systematic archaeological excavation. Evidence from within the enclosure comes from standing architecture, limited building interventions, surveys, undocumented or poorly documented earth removal, and redeposited material. Everything above the retaining walls beyond that standing fabric is inference: from the walls themselves, from digs outside the enclosure, from ancient descriptions, and from debris sieved off-site. Every shape carries a tag saying which. Dates follow BC/AD; dual dates such as 587/586 BC and 516/515 BC reflect differences in regnal and calendar conventions among scholars, not uncertainty in this visualization's own reading.<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div>\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">WHAT THE FOUR TAGS MEAN<\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:12px;\">\n                    <div style=\"border:1px solid #ddd2bd;border-radius:3px;padding:11px 13px;\">\n                      <div style=\"font:500 9px/1 'Courier New',monospace;letter-spacing:.08em;color:#2f5136;background:#d6e2d2;display:inline-block;padding:3px 6px;border-radius:2px;\">EXCAVATED / STANDING<\u002Fdiv>\n                      <p style=\"margin:9px 0 0;font:400 12.5px/1.55 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Two distinct evidence types shown under one tag: standing architecture you can see and measure today, or fabric recovered in a controlled archaeological context. Neither is textual or inferred — but \"standing\" is not the same claim as \"excavated,\" and the essay text for each item says which applies.<\u002Fp>\n                    <\u002Fdiv>\n                    <div style=\"border:1px solid #ddd2bd;border-radius:3px;padding:11px 13px;\">\n                      <div style=\"font:500 9px/1 'Courier New',monospace;letter-spacing:.08em;color:#4a3f6b;background:#dcd8ea;display:inline-block;padding:3px 6px;border-radius:2px;\">TEXTUAL<\u002Fdiv>\n                      <p style=\"margin:9px 0 0;font:400 12.5px/1.55 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Described in a source — 1 Kings, Josephus, Mishnah Middot, a pilgrim's account — and drawn from that description.<\u002Fp>\n                    <\u002Fdiv>\n                    <div style=\"border:1px solid #ddd2bd;border-radius:3px;padding:11px 13px;\">\n                      <div style=\"font:500 9px/1 'Courier New',monospace;letter-spacing:.08em;color:#6b5322;background:#e8dfc4;display:inline-block;padding:3px 6px;border-radius:2px;\">CONJECTURAL<\u002Fdiv>\n                      <p style=\"margin:9px 0 0;font:400 12.5px/1.55 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">A reasonable filling-in. Shown because leaving it blank would misrepresent the site more than drawing it does.<\u002Fp>\n                    <\u002Fdiv>\n                    <div style=\"border:1px solid #ddd2bd;border-radius:3px;padding:11px 13px;\">\n                      <div style=\"font:500 9px/1 'Courier New',monospace;letter-spacing:.08em;color:#6d2b2b;background:#eed4d0;display:inline-block;padding:3px 6px;border-radius:2px;\">CONTESTED<\u002Fdiv>\n                      <p style=\"margin:9px 0 0;font:400 12.5px/1.55 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Specialists actively disagree. Where possible you can switch between the competing positions and see what changes.<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div>\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">SOURCES BEHIND THE DRAWING<\u002Fdiv>\n                  <ul style=\"margin:12px 0 0;padding-left:19px;display:flex;flex-direction:column;gap:7px;\">\n                    <li style=\"font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Retaining walls, gates, streets and the southern steps: the published record of excavation along the western and southern walls, and the Ophel.<\u002Fli>\n                    <li style=\"font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Herodian courts, porticoes and the Royal Stoa: Josephus, <em>Jewish War<\u002Fem> and <em>Antiquities<\u002Fem>, read against Mishnah Middot.<\u002Fli>\n                    <li style=\"font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">First Temple plan and fittings: 1 Kings 6–7 and 2 Chronicles 3–4, with comparison to excavated Levantine temples of the same type.<\u002Fli>\n                    <li style=\"font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Dome of the Rock, al-Aqsa and the Mamluk buildings: standing architecture, inscriptions, waqf records, and the surveys of the Haram.<\u002Fli>\n                    <li style=\"font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Finds without stratigraphy: the Temple Mount Sifting Project, treated as evidence of material, not of position.<\u002Fli>\n                  <\u002Ful>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isTab2 }}\">\n              <div style=\"display:flex;flex-direction:column;gap:24px;\">\n                <p style=\"margin:0;max-width:62ch;font:400 16px/1.7 Georgia,'Times New Roman',serif;color:#2c2823;\">The platform stays in the same place, at the same scale, in every period, so your eye learns where to look. Everything else is a way of asking a question about that one drawing.<\u002Fp>\n\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;\">\n                  <div style=\"display:flex;flex-direction:column;gap:9px;\">\n                    <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">MOVING THROUGH TIME<\u002Fdiv>\n                    <p style=\"margin:0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">The <strong>period slider<\u002Fstrong> runs from the Bronze Age ridge to the modern Haram. The essay on the right changes with it, and so does the key.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Overlay periods<\u002Fstrong> ghosts any other period on top of the one you are reading, at whatever opacity you set — the fastest way to see that the Dome of the Rock stands roughly where the sanctuary stood.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Present-day outline<\u002Fstrong> keeps the modern enclosure as a dashed line in every period, so nothing floats free of the ground that exists now.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:9px;\">\n                    <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">MOVING THE VIEW<\u002Fdiv>\n                    <p style=\"margin:0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Drag<\u002Fstrong> to rotate, <strong>shift-drag<\u002Fstrong> to pan, <strong>scroll<\u002Fstrong> to zoom; the sliders do the same thing more precisely.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Height exaggeration<\u002Fstrong> stretches vertical scale. At ×1 you are seeing true proportions; higher settings make the buried slope of the bedrock legible under the fill.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Switch to <strong>plan<\u002Fstrong> when you want to measure or compare footprints without perspective in the way.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:9px;\">\n                    <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">ASKING WHAT WE KNOW<\u002Fdiv>\n                    <p style=\"margin:0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Click any shape<\u002Fstrong> — on the drawing or in the key — and a note appears saying what it is, how confident the reconstruction is, and what that confidence rests on.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">In the Herodian period, the <strong>sanctuary location<\u002Fstrong> switch moves the temple between the three proposed positions — the traditional central one over the rock, and the northern and southern alternatives.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Why<\u002Fstrong> in the header reopens the standing limitation that governs everything here.<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:18px;\">\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">A GOOD FIRST PASS<\u002Fdiv>\n                  <p style=\"margin:10px 0 0;max-width:70ch;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Start at period 1 and read the ridge — the bare rock, the spring below, how small the settled area was. Then jump to the Herodian expansion and overlay period 1 on it at 50%: the difference between those two pictures reflects one of the largest construction projects undertaken at the site. Then walk forward one period at a time and watch what is kept, what is buried, and what is rebuilt on top.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isTab3 }}\">\n              <div style=\"display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:30px;\">\n                <div style=\"display:flex;flex-direction:column;gap:14px;\">\n                  <div>\n                    <div style=\"font:400 22px/1.2 Georgia,'Times New Roman',serif;color:#241f18;\">Taylor Halverson, Ph.D.<\u002Fdiv>\n                    <div style=\"margin-top:5px;font:500 10px/1 'Courier New',monospace;letter-spacing:.13em;color:#8a7a5c;\">AUTHOR · TEACHER · TOUR LEADER · SCRIPTURE SCHOLAR<\u002Fdiv>\n                  <\u002Fdiv>\n                  <p style=\"margin:0;font:400 15.5px/1.7 Georgia,'Times New Roman',serif;color:#2c2823;\">Taylor Halverson is a scholar of scripture and a teacher of learners — an entrepreneurship professor in the BYU Marriott School of Business who spends his working life helping people find and act on the best ideas and tools available to them.<\u002Fp>\n                  <p style=\"margin:0;font:400 15.5px/1.7 Georgia,'Times New Roman',serif;color:#2c2823;\">He is the author and editor of more than fifty books and nearly a thousand articles and blog posts, and a builder of scripture study resources: the ScripturePlus app with Scripture Central, whose scripture YouTube channel he co-hosted to more than fifty million views, and BYU's Virtual Scripture Group, whose team spent more than five years reconstructing New Testament Jerusalem in three dimensions. This visualization of the Temple Mount belongs to that same body of work — tools made so that ordinary readers can see what specialists see.<\u002Fp>\n                  <p style=\"margin:0;font:400 15.5px/1.7 Georgia,'Times New Roman',serif;color:#2c2823;\">He leads tours to Israel and the Middle East, China, India, Central America, Europe, and the national parks of the American West, where he unfolds how geology, geography, civilization, and scriptural texts created our beautiful present day.<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:20px;\">\n                  <div>\n                    <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">ACADEMIC TRAINING<\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:11px;\">\n                      <div style=\"font:400 13px/1.5 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Ph.D., Judaism &amp; Christianity in Antiquity — Indiana University<\u002Fdiv>\n                      <div style=\"font:400 13px/1.5 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Ph.D., Instructional Systems Technology — Indiana University<\u002Fdiv>\n                      <div style=\"font:400 13px/1.5 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">M.A., Biblical Studies — Yale University<\u002Fdiv>\n                      <div style=\"font:400 13px/1.5 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">B.A., Ancient Near Eastern Studies — Brigham Young University<\u002Fdiv>\n                    <\u002Fdiv>\n                    <p style=\"margin:13px 0 0;font:400 13px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#6d6350;\">Two doctorates in two separate fields — the ancient world, and the design of learning. Both of them are in this tool.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border-top:1px solid #ddd2bd;padding-top:16px;\">\n                    <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">ELSEWHERE<\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:7px;margin-top:11px;\">\n                      <a href=\"https://insights.taylorhalverson.com\" target=\"_blank\" style=\"font:400 13px/1.5 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;\">insights.taylorhalverson.com<\u002Fa>\n                      <a href=\"https://books.taylorhalverson.com\" target=\"_blank\" style=\"font:400 13px/1.5 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;\">books.taylorhalverson.com<\u002Fa>\n                      <a href=\"https://exodustours.com\" target=\"_blank\" style=\"font:400 13px/1.5 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;\">exodustours.com<\u002Fa>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isTab4 }}\">\n              <div style=\"display:flex;flex-direction:column;gap:24px;max-width:78ch;\">\n\n                <div>\n                  <p style=\"margin:0;font:400 15px/1.7 Georgia,'Times New Roman',serif;color:#2c2823;\">The drawings in this visualization are original. The measurements, dates and interpretations behind them are drawn from the published record, listed below by category. Coverage is uneven across the twelve periods because the evidence is uneven.<\u002Fp>\n                  <p style=\"margin:12px 0 0;font:400 13px/1.7 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#5b5342;\">Per-element sourcing appears in the key: selecting a labelled feature shows its evidence tag and the basis for it. This page is the consolidated bibliography.<\u002Fp>\n                  <p style=\"margin:12px 0 0;font:400 13px/1.7 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#5b5342;\">Independent educational project. Not affiliated with, sponsored by, or approved by the Jerusalem Islamic Waqf, the Hashemite Kingdom of Jordan, the State of Israel, the Israel Antiquities Authority, UNESCO, The Church of Jesus Christ of Latter-day Saints, or the scholars and publishers cited here. Names identify places, institutions, people and sources only.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:18px;\">\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">PRIMARY TEXTUAL SOURCES<\u002Fdiv>\n                  <p style=\"margin:11px 0 13px;font:400 12.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#6d6350;\">Cited by book, chapter and section throughout, so that any reader can go to the passage and judge it independently. English wording is this project’s own rendering.<\u002Fp>\n                  <div style=\"display:flex;flex-direction:column;gap:8px;\">\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Hebrew Bible.<\u002Fstrong> 1 Kings 5–8 and 2 Chronicles 3–4 for the First Temple dimensions; 2 Kings 25 and Jeremiah 52 for the 587/586 BC destruction; Ezra 3–6 and Haggai 2 for the Persian-period rebuilding; Nehemiah 3 for the wall circuit; Ezekiel 40–43 for a visionary plan used only as comparative architecture, never as a survey.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Mishnah.<\u002Fstrong> Tractate Middot for the 500-cubit square, the courts, the chambers and the gate positions; Tamid and Shekalim for use and function. Compiled c. AD 200, describing a building destroyed in 70; treated here as a later account of the Herodian complex rather than a measured plan.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Josephus.<\u002Fstrong> <em>The Jewish War<\u002Fem> V.184–247 for the porticoes, the courts and the sanctuary; <em>Antiquities<\u002Fem> XV.380–425 for the Herodian rebuilding programme. Among the most detailed surviving descriptions of the platform from antiquity — written for a Roman readership after the revolt by an author who witnessed the events but shaped the account to defend his own record.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Roman and late-antique witnesses.<\u002Fstrong> Tacitus, <em>Histories<\u002Fem> V, for the siege; Dio Cassius LXIX for Hadrian’s refoundation; the Bordeaux Pilgrim’s <em>Itinerarium<\u002Fem> (333) and the <em>Breviarius de Hierosolyma<\u002Fem> for the platform in Christian Jerusalem; Eusebius on the ruined site; the account attributed to Antiochus Strategos for the Persian sack of 614.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Islamic-period descriptions.<\u002Fstrong> al-Muqaddasī (10th c.) and Nāṣir-i Khusraw (1047) for the Umayyad and Fatimid Haram; Ibn al-Firkāḥ (d. 1329), <em>Bāʿith al-nufūs<\u002Fem>, for the merits-of-Jerusalem tradition and the sanctuary’s devotional geography; Mujīr al-Dīn al-‘Ulaymī (1495) for the Mamluk buildings, the fullest pre-modern topography of the enclosure.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Crusader and Ottoman travellers.<\u002Fstrong> Theoderich, John of Würzburg and William of Tyre for the Templum Domini and the Templar precinct; Felix Fabri (1480s) and Evliya Çelebi (17th c.) for later description; the Ottoman inscription record for the Süleymanic tile facing of 1545.<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:18px;\">\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">SURVEY AND EXCAVATION RECORD<\u002Fdiv>\n                  <p style=\"margin:11px 0 13px;font:400 12.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#6d6350;\">The measured evidence. Everything drawn as <em>excavated<\u002Fem> in this visualization traces to one or more of these.<\u002Fp>\n                  <div style=\"display:flex;flex-direction:column;gap:8px;\">\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Charles Warren, 1867–1870.<\u002Fstrong> The shafts and tunnels along the eastern and southern walls, published for the Palestine Exploration Fund in <em>The Recovery of Jerusalem<\u002Fem> and the Jerusalem volume of the <em>Survey of Western Palestine<\u002Fem>. The principal record of the sub-surface courses and the bedrock profile beneath the platform. The “earlier wall line” layer and the buried course heights follow his sections. Also Charles Wilson’s Ordnance Survey of Jerusalem (1864–65).<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Benjamin Mazar, Temple Mount Excavations, 1968–1978.<\u002Fstrong> The southern and south-western foot of the enclosure: the Herodian street, the fallen stones, the Royal Stoa staircase, Robinson’s Arch and the Double and Triple Gate approaches. Published in the <em>Qedem<\u002Fem> series with Eilat Mazar; the architectural record is largely the work of Leen Ritmeyer as chief architect. Meir Ben-Dov’s parallel volumes cover the Umayyad structures south of the wall.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Nahman Avigad, Jewish Quarter Excavations.<\u002Fstrong> The destruction layer of 70, the Burnt House and the Herodian residences — the dating anchor for period 6, none of it on the platform itself.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>City of David.<\u002Fstrong> Kathleen Kenyon and Roland de Vaux (1961–67), Yigal Shiloh (1978–85), Ronny Reich and Eli Shukron on the Gihon Spring and the Siloam Pool, and Eilat Mazar’s work on the northern spur. The basis for period 1’s placement of the town and its water source some 600 m south of the ridge.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Israel Antiquities Authority.<\u002Fstrong> Salvage excavation reports, the Western Wall plaza and tunnel documentation, and the notices in <em>Hadashot Arkheologiyot / Excavations and Surveys in Israel<\u002Fem>. Yuval Baruch and Ronny Reich’s work on the enclosure walls and the dating of their courses.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Temple Mount Sifting Project<\u002Fstrong> (Gabriel Barkay and Zachi Dvira, from 2004). Wet-sifting of debris removed during the 1996–99 el-Marwani Mosque works. The material derives from the platform surface but is unstratified, having been removed mechanically. The opus sectile floor reconstructions inform period 5.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>The standing buildings, measured.<\u002Fstrong> Robert Hamilton, <em>The Structural History of the Aqsa Mosque<\u002Fem> (1949), the record made during the 1938–42 repairs; K.&nbsp;A.&nbsp;C. Creswell, <em>Early Muslim Architecture<\u002Fem>, on the Dome of the Rock and the Umayyad fabric; M.&nbsp;H. Burgoyne, <em>Mamluk Jerusalem: An Architectural Study<\u002Fem> (1987), the standard measured survey of the madrasas, ribāṭs, the qanāṭir and the Sabīl Qāytbāy that populate period 11.<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:18px;\">\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">INTERPRETATION AND SYNTHESIS<\u002Fdiv>\n                  <p style=\"margin:11px 0 13px;font:400 12.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#6d6350;\">Secondary scholarship on which the interpretation of the evidence depends. These authors differ from one another on substantial points; where they do, the visualization presents the disagreement rather than resolving it.<\u002Fp>\n                  <div style=\"display:flex;flex-direction:column;gap:8px;\">\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>The three sanctuary placements.<\u002Fstrong> Leen Ritmeyer, <em>The Quest: Revealing the Temple Mount in Jerusalem<\u002Fem>, for the central placement over the rock and the 500-cubit square identified in the platform’s fabric. Asher Kaufman for the northern placement. Tuvia Sagiv for the southern. All three are shown as competing and attributed. The platform surface has not been excavated, and no placement can be established from physical evidence.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Herodian architecture.<\u002Fstrong> Ehud Netzer, <em>The Architecture of Herod, the Great Builder<\u002Fem>; Joseph Patrich on the Temple and its courts; Dan Bahat on the enclosure and the tunnels.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>The platform between 70 and 638.<\u002Fstrong> Yaron Eliav, <em>God’s Mountain: The Temple Mount in Time, Place, and Memory<\u002Fem>, on the Roman and Byzantine centuries; the basis for the treatment of periods 7 and 8.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>The Islamic Haram.<\u002Fstrong> Oleg Grabar, <em>The Shape of the Holy<\u002Fem> and <em>The Dome of the Rock<\u002Fem>; Andreas Kaplony, <em>The Ḥaram of Jerusalem 324–1099<\u002Fem>; Amikam Elad, <em>Medieval Jerusalem and Islamic Worship<\u002Fem>; Nazmi al-Jubeh and Robert Schick on the later fabric and its custodianship.<\u002Fp>\n                    <p style=\"margin:0;font:400 13.5px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\"><strong>Crusader and modern periods.<\u002Fstrong> Denys Pringle, <em>The Churches of the Crusader Kingdom of Jerusalem<\u002Fem>; Beatrice St Laurent on Ottoman and Mandate-era restoration; Simone Ricca, <em>Reinventing Jerusalem<\u002Fem>, on the 1967 clearance and the Western Wall plaza.<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:18px;\">\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">HOW THE DRAWINGS WERE MADE<\u002Fdiv>\n                  <p style=\"margin:11px 0 0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">The reconstructions were constructed from published measurements — course heights, wall lengths, gate widths and cubit figures — rather than traced from existing drawings. Where sources report differing figures, the variance is noted in the relevant evidence tag.<\u002Fp>\n                  <p style=\"margin:11px 0 0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">The visualization uses no photographs, archive scans, map tiles or aerial imagery.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:18px;\">\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">COPYRIGHT<\u002Fdiv>\n                  <p style=\"margin:11px 0 0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Text, captions, reconstruction geometry, drawings and interface © Taylor Halverson, Ph.D. All rights reserved.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:18px;\">\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">TYPEFACES<\u002Fdiv>\n                  <p style=\"margin:11px 0 0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Set in the system's own serif, sans-serif and monospace faces (e.g. Georgia, Segoe UI/Helvetica, Courier New) rather than a bundled or CDN-loaded font family. No third-party font files are shipped with or requested by this product.<\u002Fp>\n                  <p style=\"margin:11px 0 0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">All drawing is hand-authored vector geometry. No 3D modelling package, photogrammetry dataset, stock asset library or generated imagery was used at any stage.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:18px;\">\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">HOW TO CITE THIS VISUALIZATION<\u002Fdiv>\n                  <p style=\"margin:11px 0 0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Halverson, Taylor. <em>The Temple Mount / al-Ḥaram al-Sharīf: Twelve Periods<\u002Fem>. Interactive visualization. Cite the period number and element name, with date of consultation; the reconstructions are revised as evidence and criticism accumulate.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:18px;\">\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">REVISION HISTORY<\u002Fdiv>\n                  <p style=\"margin:11px 0 0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">v0.9 (beta) — September 5, 2026. Current release: audit-driven factual corrections (excavation-claim wording, Period 4 title, Haggai/Ezra citation, evidence-tag clarifications), accessibility pass (keyboard focus management, focus trap and restoration, 200%/400% zoom reflow), and mobile/tablet responsive layout.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:18px;\">\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">CORRECTIONS<\u002Fdiv>\n                  <p style=\"margin:11px 0 0;font:400 13.5px/1.65 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Corrections of fact, omitted attributions and scholarly objections are welcome and will be credited to those who raise them.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:14px;\">\n                  <p style=\"margin:0;font:400 12px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#6d6350;\">Project Created by Taylor Halverson, Ph.D. (Beta mode)<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ isTab5 }}\">\n              <div style=\"display:flex;flex-direction:column;gap:22px;max-width:78ch;\">\n\n                <p style=\"margin:0;font:400 15px/1.7 Georgia,'Times New Roman',serif;color:#2c2823;\">The Temple Mount / al-Ḥaram al-Sharīf: Twelve Periods — an interactive visualization<\u002Fp>\n\n                <div>\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">1. WHAT YOU'RE GETTING<\u002Fdiv>\n                  <p style=\"margin:11px 0 0;font:400 13.5px/1.7 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">This product is a Beta: an interactive model of twelve building phases of the Temple Mount / al-Ḥaram al-Sharīf site, with accompanying essays, a key of labelled features, and reference material, published by Taylor Halverson, Ph.D. (“Publisher”). It is a teaching aid and reconstruction, not a survey document — see the “The visualization” and “Attributions and licensing” tabs above for what that means and where the evidence comes from.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:16px;\"> re Publisher sells directly, a full refund is available on request within 14 days of purchase, provided the product has not been redistributed. To request a refund, email insights@taylorhalverson.com with your order confirmation and purchase date; expect acknowledgment within 3 business days and, once eligibility is confirmed, processing within 10 business days.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:16px;\">\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">5. PRIVACY<\u002Fdiv>\n                  <p style=\"margin:11px 0 0;font:400 13.5px/1.7 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">This product does not create accounts, collect form submissions, use analytics, or request location. It stores only your dark-mode preference in this browser. To operate, it loads React and ReactDOM from unpkg.com, which receives standard connection data such as IP address, browser information, requested URL, and time of request under its own privacy terms. External source links are governed by their destination sites.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:16px;\">\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">5. NO WARRANTY OF SCHOLARLY CONCLUSION<\u002Fdiv>\n                  <p style=\"margin:11px 0 0;font:400 13.5px/1.7 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Because this is a Beta reconstruction of a disputed archaeological site, Publisher makes no warranty that any specific dating, identification, or interpretation shown will not be revised in a later edition. The product is provided “as is” for its stated teaching purpose.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:16px;\">\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">6. LIMITATION OF LIABILITY<\u002Fdiv>\n                  <p style=\"margin:11px 0 0;font:400 13.5px/1.7 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">To the extent permitted by law, Publisher's liability for any claim arising from this product is limited to the amount paid for it.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:16px;\">\n                  <div style=\"font:600 9.5px/1 'Courier New',monospace;letter-spacing:.14em;color:#8a7a5c;\">7. GOVERNING LAW &amp; CONTACT<\u002Fdiv>\n                  <p style=\"margin:11px 0 0;font:400 13.5px/1.7 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#4a4335;\">Contact for licensing, refunds, or rights questions: <a href=\"mailto:insights@taylorhalverson.com\" style=\"color:#6c6c52;\">insights@taylorhalverson.com<\u002Fa>. The user agrees that any legal action, dispute, or proceeding arising out of or relating to this product must be brought exclusively in the state or federal courts located in Utah County, Utah. Both parties irrevocably consent to the personal jurisdiction of these courts and waive any objection based on improper venue or inconvenient forum.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"border-top:1px solid #ddd2bd;padding-top:14px;\">\n                  <p style=\"margin:0;font:400 12px/1.6 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#6d6350;\">Project Created by Taylor Halverson, Ph.D. (Beta mode)<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <main data-tm-main=\"\" ref=\"{{ paneRef }}\" sc-camel-on-click=\"{{ onCanvasTap }}\" style=\"flex:1 1 0;min-height:250px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;padding:8px 14px;background:radial-gradient(ellipse at 50% 36%, #262319 0%, #131209 78%);\">\n      <sc-if value=\"{{ notProj }}\" hint-placeholder-val=\"{{ true }}\">\n      <div data-panel=\"overlays\" sc-camel-on-click=\"{{ stopClick }}\" style=\"position:absolute;left:8px;top:6px;z-index:4;max-width:190px;background:rgba(27,24,17,.86);border:1px solid #332d21;border-radius:3px;padding:7px 9px;display:flex;flex-direction:column;gap:6px;\">\n        <button data-ov-toggle=\"\" sc-camel-on-click=\"{{ toggleOvPanel }}\" aria-expanded=\"{{ ovPanelOpen }}\" style=\"{{ ovPanelBtn }}\">{{ ovPanelLabel }}<\u002Fbutton>\n        <div data-ov-body=\"\" style=\"{{ ovBodyStyle }}\">\n        <div style=\"font:500 9.5px 'Courier New',monospace;letter-spacing:.1em;color:#968564;\">OVERLAY PERIODS<\u002Fdiv>\n        <div style=\"display:flex;gap:4px;flex-wrap:wrap;\">\n          <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"12\">\n            <button data-el=\"{{ c.n }}\" sc-camel-on-click=\"{{ toggleOv }}\" style=\"{{ c.ovStyle }}\" style-hover=\"border-color:#c49b5b;\">{{ c.n }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:6px;font:400 10px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#6f6553;\">\n          <input type=\"range\" min=\"10\" max=\"90\" step=\"5\" value=\"{{ opPct }}\" sc-camel-on-input=\"{{ setOp }}\" style=\"width:74px;height:3px;\">\n          <span style=\"font:500 10px 'Courier New',monospace;color:#c49b5b;\">{{ opLabel }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ clearOv }}\" style=\"border:1px solid #3a3327;background:none;color:#6f6553;border-radius:2px;padding:1px 6px;font:400 9.5px 'Courier New',monospace;cursor:pointer;\">clear<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #2c271d;padding-top:6px;display:flex;flex-direction:column;gap:6px;\">\n          <div style=\"font:400 9.5px/1.4 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#968564;width:100%;\">Layers and colour:<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:row;flex-wrap:wrap;gap:6px 16px;\">\n          <button sc-camel-on-click=\"{{ toggleGhost }}\" aria-pressed=\"{{ ghost }}\" title=\"Dashed outline of the wall line in the last period where it differed — so you can see the platform grow\" style=\"display:flex;align-items:center;gap:8px;border:none;background:none;padding:0;text-align:left;cursor:pointer;font:400 10.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#a9997d;\">\n            <span style=\"{{ swGhost }}\"><span style=\"{{ swGhostKnob }}\"><\u002Fspan><\u002Fspan>Show earlier wall line\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toggleAnchor }}\" aria-pressed=\"{{ anchor }}\" title=\"Rings the rock outcrop — the one point that never moves, so you can orient yourself in every period\" style=\"display:flex;align-items:center;gap:8px;border:none;background:none;padding:0;text-align:left;cursor:pointer;font:400 10.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#a9997d;\">\n            <span style=\"{{ swAnchor }}\"><span style=\"{{ swAnchorKnob }}\"><\u002Fspan><\u002Fspan>Mark the bedrock summit\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toggleEra }}\" aria-pressed=\"{{ eraOn }}\" title=\"Tints each period\\u2019s buildings with its own hue, so eras stand apart from the stone\" style=\"display:flex;align-items:center;gap:8px;border:none;background:none;padding:0;text-align:left;cursor:pointer;font:400 10.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#a9997d;\">\n            <span style=\"{{ swEra }}\"><span style=\"{{ swEraKnob }}\"><\u002Fspan><\u002Fspan>Colour by period\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toggleNames }}\" aria-pressed=\"{{ namesOn }}\" title=\"Off by default: hover or tap any element instead\" style=\"display:flex;align-items:center;gap:8px;border:none;background:none;padding:0;text-align:left;cursor:pointer;font:400 10.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#a9997d;\">\n            <span style=\"{{ swNames }}\"><span style=\"{{ swNamesKnob }}\"><\u002Fspan><\u002Fspan>Names on the model\n          <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <div data-panel=\"compass\" role=\"img\" aria-label=\"{{ compassLabel }}\" style=\"position:absolute;right:10px;top:8px;z-index:4;width:62px;height:62px;border-radius:50%;border:1px solid #3a3226;background:rgba(24,21,15,.72);\">\n        <span style=\"position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;background:#6f6553;\"><\u002Fspan>\n        <span style=\"{{ posN }}\">N<\u002Fspan>\n        <span style=\"{{ posE }}\">E<\u002Fspan>\n        <span style=\"{{ posS }}\">S<\u002Fspan>\n        <span style=\"{{ posW }}\">W<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ isProj }}\">\n        <button sc-camel-on-click=\"{{ toggleProj }}\" style=\"position:absolute;right:80px;top:8px;z-index:8;border:1px solid #4a3f28;background:rgba(27,24,17,.9);color:#c49b5b;border-radius:2px;padding:5px 10px;font:500 11px 'Courier New',monospace;cursor:pointer;letter-spacing:.08em;\" style-hover=\"border-color:#c49b5b;color:#efe6d4;\">EXIT PROJECTION ✕<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ is3d }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"width:100%;height:100%;cursor:grab;position:relative;user-select:none;-webkit-user-select:none;touch-action:none;\">\n          <div data-panel=\"camera\" sc-camel-on-click=\"{{ stopClick }}\" style=\"{{ camStyle }}\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;\">\n              <span style=\"font:600 9px 'Courier New',monospace;letter-spacing:.16em;color:#968564;\">VIEW isplay:var(--tm-lbl,inline);font:400 1em Georgia,'Times New Roman',serif;\">dome rebuilt 1959–64, gold-clad 1993<\u002Ftext>\n          <\u002Fg>\n          <rect data-el=\"aqsa-mod\" sc-camel-on-click=\"{{ pick }}\" x=\"170\" y=\"437\" width=\"55\" height=\"80\" fill=\"#e6dcc4\" opacity=\".22\" stroke=\"#e6dcc4\" stroke-width=\"1.2\" style=\"cursor:pointer\"><\u002Frect>\n          <g data-el=\"marwani\" sc-camel-on-click=\"{{ pick }}\" style=\"cursor:pointer\">\n            <rect x=\"272\" y=\"424\" width=\"84\" height=\"92\" fill=\"#8fb3c9\" opacity=\".3\" stroke=\"#c0cfa2\" stroke-width=\"1.3\"><\u002Frect>\n            <text x=\"272\" y=\"418\" fill=\"#c0cfa2\" style=\"display:var(--tm-lbl2,var(--tm-lbl,inline));font:400 0.95em 'Courier New',monospace;\">el-Marwani Mosque, 1999<\u002Ftext>\n          <\u002Fg>\n          <g data-el=\"plaza\" sc-camel-on-click=\"{{ pick }}\" style=\"cursor:pointer\">\n            <polygon points=\"-16,438 62,442 60,528 -20,522\" fill=\"#e6dcc4\" opacity=\".18\" stroke=\"#e6dcc4\" stroke-width=\"1.2\"><\u002Fpolygon>\n            <text x=\"-34\" y=\"556\" fill=\"#e6dcc4\" style=\"display:var(--tm-lbl2,var(--tm-lbl,inline));font:400 0.95em 'Courier New',monospace;\">Western Wall plaza, 1967<\u002Ftext>\n          <\u002Fg>\n          <g data-el=\"sifting\" sc-camel-on-click=\"{{ pick }}\" style=\"cursor:pointer\">\n            <path d=\"M300,560 h64 M300,560 l-8,22 h80 l-8,-22\" fill=\"none\" stroke=\"#e0a86a\" stroke-width=\"1.4\"><\u002Fpath>\n            <text x=\"264\" y=\"600\" fill=\"#e0a86a\" style=\"display:var(--tm-lbl2,var(--tm-lbl,inline));font:400 0.95em 'Courier New',monospace;\">Sifting Project — debris sieved off-site<\u002Ftext>\n          <\u002Fg>\n        <\u002Fg>\n        <g id=\"layer-end\"><\u002Fg>\n      <\u002Fsvg>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasSel }}\">\n        <div role=\"status\" style=\"{{ selPop }}\">\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap;\">\n            <div style=\"{{ selSwatch }}\"><\u002Fdiv>\n            <span style=\"font:500 13.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#efe6d4;\">{{ selName }}<\u002Fspan>\n            <span style=\"{{ selTag }}\">{{ selConf }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ clearSel }}\" style=\"margin-left:auto;border:none;background:none;color:#7d7159;font:400 15px/1 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;cursor:pointer;\" style-hover=\"color:#efe6d4;\">×<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font:400 12.5px/1.55 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#a9997d;\">{{ selBasis }}<\u002Fdiv>\n          <div style=\"font:400 10px 'Courier New',monospace;color:#6f6553;margin-top:8px;\">{{ selPeriod }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fmain>\n\n\n    <div style=\"{{ timeStyle }}\">\n      <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:nowrap;overflow-x:auto;\">\n        <div style=\"font:400 12.5px Georgia,'Times New Roman',serif;color:#efe6d4;white-space:nowrap;\">{{ pTitle }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleToday }}\" aria-pressed=\"{{ today }}\" style=\"display:flex;align-items:center;gap:8px;border:none;background:none;padding:0;cursor:pointer;font:400 11.5px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#a9997d;white-space:nowrap;\">\n          <span style=\"{{ swToday }}\"><span style=\"{{ swTodayKnob }}\"><\u002Fspan><\u002Fspan>Present-day outline\n        <\u002Fbutton>\n        <div style=\"display:flex;align-items:center;gap:5px;\">\n          <button data-el=\"3d\" sc-camel-on-click=\"{{ setMode }}\" style=\"{{ modeBtn3d }}\">2.5D<\u002Fbutton>\n          <button data-el=\"plan\" sc-camel-on-click=\"{{ setMode }}\" style=\"{{ modeBtnPlan }}\">plan<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ notCompact }}\">\n        <button sc-camel-on-click=\"{{ toggleTimeOpen }}\" aria-expanded=\"{{ timeOpen }}\" style=\"{{ timeToggleBtn }}\">{{ timeToggleLabel }}<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"{{ timeBodyStyle }}\">\n      <div style=\"display:flex;align-items:center;gap:5px;padding-bottom:2px;min-width:0;\">\n        <button data-d=\"-1\" sc-camel-on-click=\"{{ stepPeriod }}\" disabled=\"{{ atFirst }}\" aria-label=\"Previous period\" style=\"{{ prevBtn }}\">‹<\u002Fbutton>\n        <button data-d=\"1\" sc-camel-on-click=\"{{ stepPeriod }}\" disabled=\"{{ atLast }}\" aria-label=\"Next period\" style=\"{{ nextBtn }}\">›<\u002Fbutton>\n        <div ref=\"{{ chipsRef }}\" data-time-chips=\"1\" style=\"display:flex;gap:5px;overflow-x:auto;min-width:0;flex:1 1 auto;scroll-behavior:smooth;\">\n        <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"12\">\n          <button data-el=\"{{ c.n }}\" sc-camel-on-click=\"{{ jump }}\" style=\"{{ c.style }}\" style-hover=\"border-color:#c49b5b;color:#efe6d4;\">{{ c.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;border-top:1px solid #2a2620;padding-top:7px;\">\n        <div style=\"font:600 9.5px 'Courier New',monospace;letter-spacing:.14em;color:#968564;white-space:nowrap;\">MILESTONES<\u002Fdiv>\n        <div ref=\"{{ milesRef }}\" data-time-miles=\"1\" style=\"display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:2px;min-width:0;scroll-behavior:smooth;\">\n          <sc-for list=\"{{ miles }}\" as=\"m\" hint-placeholder-count=\"9\">\n            <button data-el=\"{{ m.n }}\" sc-camel-on-click=\"{{ jump }}\" title=\"{{ m.title }}\" style=\"{{ m.style }}\" style-hover=\"border-color:#c49b5b;color:#efe6d4;\">{{ m.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ notProj }}\" hint-placeholder-val=\"{{ true }}\
