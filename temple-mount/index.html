        <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">On 15 July 1099, the armies of the First Crusade broke into Jerusalem after a five-week siege. The massacre that followed, in which large numbers of the city's Muslim and Jewish inhabitants were killed, is described in horrified detail by both Muslim chroniclers and the crusaders' own writers, some of whom recorded it as a triumph. For the next eighty-eight years, the Haram was the ceremonial heart of a Latin Christian kingdom.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The Crusaders read the site through their own scriptural map. The Dome of the Rock was identified as the Temple of the Lord — <em>the Dome converted to a church (Templum Domini)<\u002Fem> — believed to be either the temple of Solomon itself or its direct successor, the building Jesus knew. The al-Aqsa Mosque became the <em>Templum Salomonis<\u002Fem>, Solomon's palace. Neither identification is historically correct, but both shaped what happened to the buildings.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The Dome of the Rock was consecrated as a church and given to a community of Augustinian canons. A gold cross was fixed above the dome. The rock itself was paved over with marble, an altar was built on it, and an iron grille was set around it — partly for liturgy and partly to stop pilgrims chipping off pieces to take home, a real and documented problem. Interior fittings, painted decoration and Latin inscriptions were added. Remarkably, the Umayyad mosaics were largely left in place, which is a substantial reason they survive.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The building's silhouette travelled. Because Europeans believed it was Solomon's Temple, its centralized octagonal plan was copied and echoed in churches across Europe, most famously by the Templar order, and it appears on seals and in manuscript illustration as the standard image of \"the Temple.\" A great deal of European visual tradition about the Jerusalem temple derives, by way of this misidentification, from a seventh-century Islamic shrine.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The al-Aqsa Mosque first served as the royal palace of the kings of Jerusalem. In 1119 King Baldwin II granted it to a new order of knights sworn to protect pilgrims; from their quarters in the supposed Temple of Solomon they took the name Poor Fellow-Soldiers of Christ and of the Temple of Solomon — the Knights Templar. Over the following decades the order expanded the complex substantially, adding halls, workshops, storerooms, cloister ranges and a church to the west and south of the mosque. Standing Crusader vaults, capitals, carved doorways and rib-vaulted rooms survive both in and beside the building; some Crusader-carved capitals were later reused in Muslim buildings on the platform.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The vast vaulted space under the southeastern corner was used for horses and equipment. This is the origin of the name Solomon's Stables, which stuck for eight centuries and misled generations of visitors into thinking the vaults were tenth-century BC work. They are not: the southeastern substructures preserve multiple construction phases, with proposed dates for individual walls, piers, and vaults ranging from Herodian or Roman-period work to early Islamic and later rebuilding; attribution remains disputed — which is why the key tags them \"inferred,\" not \"excavated.\"<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">Muslims and Jews were generally barred from living in the city under Crusader rule, though the picture became more complex over time, with pilgrimage and trade continuing and some communities returning. The Spanish Jewish poet and philosopher Judah Halevi and the traveller Benjamin of Tudela both engaged with Jerusalem in this era, and Benjamin's twelfth-century itinerary records a small Jewish presence in the city.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The kingdom's defeat at the Horns of Hattin in July 1187 destroyed its field army, and Saladin took Jerusalem that October. The terms were negotiated rather than stormed: inhabitants could ransom themselves, and there was no general massacre. The cross was removed from the dome, the Christian additions inside were taken out, the rock was uncovered again, and the buildings were ritually washed with rosewater before being restored to Muslim worship. The grille around the rock, however, stayed in place for centuries — one of many small pieces of Crusader fabric absorbed into the site.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The Crusader layer is unusually well evidenced compared with most periods here, because so much of it is standing architecture that can be examined directly, and because both sides produced detailed written accounts. It is also a useful reminder for reading the whole sequence: the same stones have been continuously reinterpreted by each community that held them, and several of the site's most familiar names — including \"Solomon's Stables\" — are the fossils of interpretations that turned out to be wrong.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The Crusader Haram was also a working economic and institutional space. Pilgrims paid for candles, guides and relics; the canons of the Templum Domini held property across the kingdom; the Templars ran workshops, stores and stables and controlled one of the city's most valuable enclosures. Written charters, seals and building accounts document all of this, which is why we can describe the period's administration in more detail than its predecessors — parchment survives where excavation is impossible.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">Something of the Crusader Haram travelled outward, too. The dome's octagonal image spread through European art and architecture; carved capitals and sculptural fragments made in Jerusalem workshops of this period are among the finest Romanesque work in the region, and some were later dismantled and reused in Muslim buildings on and around the platform. For the communities excluded from the city during much of this period, the site remained a focus of writing, prayer and pilgrimage from a distance. When Saladin took the city, the change of hands was fast; the physical fabric absorbed the eighty-eight years and kept going.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">For archaeologists, the Crusader century is unusually legible on this site precisely because so much of it is still in place. Standing rib vaults, moulded doorways, carved capitals, masons' marks and rebuilt gate passages can be examined, measured and compared with dated Crusader work elsewhere in the kingdom — at Acre, Nazareth and Belvoir. The result is that for one period out of twelve, we can talk about construction sequence and workshop practice on the platform itself with real confidence.<\u002Fp><p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">That confidence has a limit worth naming. What can be read is the fabric of two buildings and the additions around them, not the ground beneath. Nobody has excavated the Crusader floors, drains or refuse deposits on the esplanade, so questions about how the space was actually used day to day — where pilgrims queued, what was sold, where the stables' fittings sat — are answered from charters and chronicles rather than from soil.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">For the Crusader century the chain has an unusual middle link: images. The walls and the two main buildings still stand, so the frame is measured. The changes the Crusaders made — an altar and choir screen inside the Dome of the Rock, a wrought-iron grille around the rock, an eastern porch, the conversion of al-Aqsa into the Templars' headquarters and the vaults into stables — are described in Latin chronicles and pilgrim accounts, and several survive as physical fragments: the grille itself was in place until the twentieth century, and Crusader capitals and sculpture from the platform are catalogued. Twelfth-century seals of the Templars and maps of Jerusalem show the Templum Domini as a domed building, which corroborates identification without adding dimensions. Nothing here needs a reconstructed height, because the buildings whose heights matter were already standing.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ e11 }}\">\n        <div>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The seven centuries between Saladin's conquest in 1187 and the end of Ottoman rule in 1917 gave the Haram most of the appearance it has today. Little of it involved new construction at the center; almost all of it was restoration, refinement, and a gradual filling-in of the edges. Because these buildings are standing and most carry dated inscriptions, this is the best-documented period in the whole sequence.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">Saladin's own program was one of restoration. The Dome of the Rock was returned to its Islamic form and repaired. In the al-Aqsa Mosque he installed a carved wooden minbar (the pulpit a preacher speaks from), or pulpit, that had been commissioned decades earlier by Nur al-Din of Aleppo in anticipation of Jerusalem's recovery. It was a masterpiece of interlocking joinery — assembled from thousands of pieces of wood and ivory without nails — and it stood in the mosque for nearly eight centuries until it was destroyed by an arson attack in 1969. A painstaking replica, reconstructed from photographs and measured drawings, was installed in 2007. The Ayyubids also added arcades and refurbished gates, and the mosque's mosaic-decorated drum was restored.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">Under the Mamluk sultans, who ruled from Cairo from 1250 to 1517, Jerusalem became a major center of religious learning and pious endowment. This produced the single most characteristic feature of the Haram's present appearance: the dense ring of buildings along its western and northern edges. Dozens of madrasas (teaching colleges) — colleges of law and religious study — plus ribāṭs (pilgrim hostels) for pilgrims and Sufi lodges, tomb-chambers for their founders, and sabils, or public fountains, were built directly against the enclosure walls, opening onto the esplanade through richly carved portals.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">Mamluk architecture in Jerusalem is instantly recognizable: alternating courses of light and dark stone called <em>ablaq<\u002Fem>, elaborately carved stalactite vaulting called <em>muqarnas<\u002Fem> over doorways, and long carved foundation inscriptions naming the patron and the exact year. Those inscriptions are why this period is so securely dated: the buildings state their own construction dates in their own stonework. Among the best known are the Ashrafiyya Madrasa, described by a contemporary as the third jewel of the Haram, and the Tankiziyya. Together they created a kind of urban wall of institutions along the western edge, mediating between the city streets and the open sacred space.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The finest freestanding Mamluk work on the platform is Sabīl Qāytbāy, built in 1482 for the sultan of that name, just west of the raised platform. It is a domed fountain over a cistern, and its dome is carved with an intricate arabesque relief — the only stone dome of its type in the city, and generally considered the high point of Mamluk stonework in Jerusalem. The arcades at the heads of the stairways onto the upper platform, the qanāṭir, were built and rebuilt across the Ayyubid and Mamluk periods; each set frames a view of the Dome of the Rock and structures the approach to it.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The Ottomans took Jerusalem in 1517, and under Süleyman the Magnificent the city received the works that most define it today. Between 1537 and 1541, the city walls were rebuilt on largely medieval lines — the walls tourists walk now are Süleyman's, not Herod's or Hadrian's, though they incorporate earlier fabric and reused blocks. He also built or restored a series of public fountains and rebuilt water supply infrastructure.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The most visible Ottoman intervention on the Haram came in 1545, when the decaying exterior mosaics of the Dome of the Rock were replaced with glazed ceramic tiles. The blue, turquoise, white and yellow revetment (a facing laid over the structure beneath) that makes the building so recognizable in photographs is Ottoman, not Umayyad; it has been repaired and renewed repeatedly since, including a full replacement in the twentieth century. Windows were reglazed with stucco-and-glass grilles, and inscription bands in Ottoman-period calligraphy were added.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">Alongside all this, the site's other communities lived with a much more constrained arrangement. Access to the Haram itself was restricted to Muslims, and Jewish prayer concentrated at the exposed stretch of the Herodian western retaining wall, in a narrow alley within the Mughrabi Quarter — the origin of the Western Wall as a fixed place of prayer in its modern form. Ottoman-era documents record repeated disputes over rights and furnishings in that alley, disputes that would harden in the nineteenth and twentieth centuries into the arrangements known as the Status Quo.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">In the nineteenth century, European surveyors arrived. Charles Wilson's Ordnance Survey of Jerusalem in 1864–65 produced the first accurate measured plans; Charles Warren's shafts and tunnels of 1867–70 reached bedrock at the foot of the walls and mapped cisterns and substructures. Their drawings remain primary evidence, because much of what they recorded is now inaccessible. Almost everything modern scholarship knows about the enclosure's foundations begins with those two surveys.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">Behind almost every building of these centuries stands the waqf (an Islamic charitable endowment), the Islamic charitable endowment. A patron would assign the income of shops, farmland or a bathhouse permanently to a madrasa, fountain or tomb, funding its staff and repairs. Endowment deeds survive in quantity and name founders, salaries, teaching duties and maintenance obligations. That system explains both the density of institutions around the Haram and their long survival: each came with its own income stream. It also means the site's history in this period can be read in legal documents as well as in stone.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">Practical upkeep mattered as much as patronage. The platform's cisterns and the aqueduct from the south had to be cleaned and repaired; the arcades, paving and stairs needed periodic rebuilding; the Dome's timber structure, lead and later tiles required constant attention, and earthquakes in this long span forced several campaigns of repair. Inscriptions record many of these works with their dates, which is how a site that has never been excavated nevertheless has a fairly detailed building history for its last eight hundred years — the buildings tell you themselves.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The Haram in these centuries was also a lived-in landscape rather than a monument. Sources and travellers' accounts describe teaching circles in the arcades, water sellers, gardeners tending the olive and cypress trees on the esplanade, custodians with keys, and the daily and Friday rhythms of prayer that organized the whole space. Families held hereditary offices connected to the sanctuary for generations. None of this leaves a footprint on a plan, which is one reason a drawing like this one, however carefully tagged, will always understate what the site actually was.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">These seven centuries are the best-documented in the whole sequence, and for once the documents are administrative rather than literary. The buildings along the northern and western edges — madrasas, ribats, the Ashrafiyya, the arcades and fountains — are standing, dated by their own foundation inscriptions, and cross-checked against waqf endowment deeds that name patrons, dates and functions. That is a chain with no conjectural link in it: inscription, deed, standing wall. The Ottoman contribution is equally documented, notably the 1545 tile revetment of the Dome of the Rock, which is dated by its own inscriptions. What remains uncertain is not the buildings but the ground under them: no excavation accompanies any of this construction, so what these foundations sit on, and what they cut through, is unknown. The drawing shows the buildings at their measured heights and says nothing about what is beneath.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ e12 }}\">\n        <div>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The modern history of the Haram is inseparable from the political history of Jerusalem, and it is where any honest visualization has to be most careful. What follows describes what each community holds and what happened, without adjudicating claims that remain live.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">Under the British Mandate after 1917, the buildings were surveyed and repaired. The architect Ernest Richmond documented the Dome of the Rock in detail, and structural work on the al-Aqsa Mosque in the late 1930s and early 1940s, supervised by R. W. Hamilton, gave the only opportunity to date to examine earlier phases beneath the mosque floor — the closest thing to an excavation the platform has ever had, and it was a rescue operation inside one building, not a survey of the site. The period also saw serious intercommunal violence connected to the site, including the 1929 riots that followed disputes over prayer arrangements at the Western Wall.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">From 1948 to 1967 the Old City, including the Haram, was under Jordanian control, and the Islamic Waqf administered the site under Jordanian custodianship. During those years Jews were in practice unable to reach the Western Wall. The major physical change of the period was the dome itself: the old lead sheathing had decayed badly, and between 1959 and 1964 it was replaced with a covering of anodised aluminium-bronze alloy, which gave the building a duller bronze colour familiar from photographs of the era. In 1993 it was recovered again, in gold-plated copper funded by King Hussein of Jordan, producing the bright gold surface seen today.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">In June 1967, Israel captured the Old City. Within days, the Mughrabi Quarter in front of the Western Wall was demolished and its residents relocated, creating the large open plaza that exists now. Administration of the Haram itself was left with the Waqf under an arrangement usually described as the Status Quo: the Waqf manages the site and Muslim worship there; Israel controls external security and access; non-Muslim visitors may enter at set times but the formal arrangement does not permit non-Muslim prayer. As of September 2026, public Jewish prayer has increasingly occurred despite the formal restriction, and both the meaning and enforcement of the arrangement are actively contested. The Status Quo has been repeatedly contested and repeatedly strained, and disputes over its interpretation have triggered major episodes of violence. Sovereignty over the site is one of the central unresolved issues of the Israeli–Palestinian conflict.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">For Muslims, the Haram is the third holiest site in Islam, the place of the Night Journey and ascension, and a functioning space of daily prayer for a living community. For Jews, the Temple Mount is the holiest site in Judaism, the location of both temples and the focus of prayer and mourning for two millennia; many rabbinic authorities forbid entry to the platform on grounds of ritual purity, while other groups advocate visiting. For Christians, the site carries the memory of the temple of the Gospels. These are not competing accounts of the same evidence — they are different kinds of claim, and archaeology does not arbitrate between them.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">In 1999, the Waqf converted the vaulted southeastern substructure — the space long called Solomon's Stables — into the el-Marwani Mosque, a prayer hall for thousands of worshippers. Creating an emergency exit involved removing a large quantity of fill, reportedly hundreds of truckloads, which was dumped in the Kidron Valley. Israeli archaeologists protested that antiquities-rich soil had been removed without archaeological supervision; the Waqf's position was that the work was maintenance of an active religious building on a site under its administration. The episode is a compressed version of the whole problem: a living sanctuary and an archaeological site occupying exactly the same ground.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">Out of that dispute came the Temple Mount Sifting Project, begun in 2004, which wet-sifts the discarded soil at an off-site facility, much of the labour done by volunteers. The results are genuinely valuable: tens of thousands of coins, pottery from every period, arrowheads, seal impressions, jewellery, glass, hundreds of thousands of mosaic tesserae, and a set of stone floor tile fragments that researchers reconstruct as Herodian-period opus sectile paving. But the material has no stratigraphy. It cannot be assigned to a layer, a building or a room. It can tell you what was on the mount; it cannot tell you where, when in relation to what, or with what.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">That is the note to end on, and it is the reason this visualization is built the way it is. Move the slider back through twelve periods and watch what the confidence tags do. At the modern end and in the early Islamic period, most elements are standing buildings you could photograph. In the Herodian period, the walls and gates are excavated but the entire sacred complex on top is textual or contested. In the First Temple period, everything is textual. The shapes on the map look equally solid at every point in the sequence — that is a limitation of drawing, not a claim about knowledge. The tags, not the shapes, carry the truth.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The site's modern status is also formal. The Old City and its walls were listed as a UNESCO World Heritage Site in 1981 and placed on the List of World Heritage in Danger the following year, and the condition and management of the Haram's monuments have been the subject of international reporting ever since. Conservation work continues under the Waqf, with periodic structural surveys of the Dome of the Rock and the mosque, repairs to the arcades and paving, and specialist attention to the mosaics and the timber dome. Because the site is in daily religious use, conservation is a continuous, negotiated activity rather than a project with an end date.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">Research under these conditions has become mostly non-invasive. Scholars work from measured surveys and photogrammetry, from historical drawings such as Wilson's and Warren's, from published records of the 1938–42 repairs, from the walls that can be reached from outside, and from sieved debris. Ground-penetrating radar and thermography have been tried and produce results too ambiguous to settle the questions people most want answered. Some things will simply remain unknown: what lies under the esplanade's paving, whether First Temple foundations survive, and exactly where the sanctuary stood.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">That is not a failure of archaeology so much as a limit set by the site's own life. A place that has been continuously sacred, rebuilt and contested for three thousand years is not a stratified excavation waiting to be opened; it is a working sanctuary, a heritage monument, and a political fact at the same time. The most accurate visualization is one that says clearly which lines are measured, which are argued, and which are simply drawn because a text describes them.<\u002Fp>\n          <p style=\"margin:0 0 15px;font:400 16px/1.75 Georgia,'Times New Roman',serif;color:#2c2823;\">The modern period closes the loop by making the evidence chain visible as a method rather than a result. Everything drawn is measurable: the enclosure, the two great buildings, the arcades, the plaza cut in 1967. The reconstruction problem has moved underground and off-site — to Warren's nineteenth-century shafts and galleries, to the 1938–42 records beneath al-Aqsa, to ground-penetrating radar that returns ambiguous readings, and to the sifted soil from the 1999 works, which yields material without position. Set the slider back through the twelve periods and the chain shortens as you go: at this end it runs walls → standing buildings → survey; in the Herodian period it runs walls → excavated gates → Josephus → reconstructed height; in the First Temple period it runs walls that did not yet exist → 1 Kings → comparison with other Levantine temples. Same drawing conventions, radically different warrant. That is the thing this tool is built to show.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div id=\"essay-end\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ compact }}\">\n    <div sc-camel-on-click=\"{{ toCanvas }}\" style=\"{{ scrimStyle }}\" aria-hidden=\"true\"><\u002Fdiv>\n    <nav aria-label=\"Primary\" style=\"{{ navStyle }}\">\n      <button sc-camel-on-click=\"{{ toCanvas }}\" aria-pressed=\"{{ atCanvas }}\" style=\"{{ barCanvas }}\">\n        Canvas\n      <\u002Fbutton>\n      <button data-el=\"time\" sc-camel-on-click=\"{{ openSheet }}\" aria-pressed=\"{{ atTime }}\" style=\"{{ barTime }}\">\n        Timeline\n      <\u002Fbutton>\n      <button data-el=\"view\" sc-camel-on-click=\"{{ openSheet }}\" aria-pressed=\"{{ atView }}\" style=\"{{ barView }}\">\n        View\n      <\u002Fbutton>\n      <button data-el=\"read\" sc-camel-on-click=\"{{ openSheet }}\" aria-pressed=\"{{ atRead }}\" style=\"{{ barRead }}\">\n        Reading\n      <\u002Fbutton>\n    <\u002Fnav>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1480,&quot;height&quot;:940},&quot;startPeriod&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;max&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Defaults&quot;},&quot;overlayOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.35,&quot;min&quot;:0.1,&quot;max&quot;:0.9,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Defaults&quot;},&quot;showPresentOutline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Defaults&quot;},&quot;darkReading&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Defaults&quot;}}\">\nclass Component extends DCLogic {\n  state = { p: 2, ov: {}, op: 0.35, today: true, sel: null, theory: 'central', mode: '3d', yaw: -0.5, tilt: 0.8, zoom: 1.15, panX: 0, panY: 0, vex: 1.7, sw: 0, ghost: true, anchor: true, dens: 'hover', proj: false, dark: false, hov: null, era: true };\n\n  static MILES = [\n    ['Traditionally mid-10th c. BC', 2, 'Solomon\\u2019s temple in the biblical account (1 Kings 6\\u20138); date and early architectural phases disputed'],\n    ['587/586 BC', 3, 'Babylonian destruction'],\n    ['516/515 BC', 3, 'The rebuilt temple (Zerubbabel\\u2019s) completed'],\n    ['164 BC', 4, 'Maccabean cleansing and rededication'],\n    ['20 BC', 5, 'Herod begins the great expansion'],\n    ['AD 70', 6, 'Titus destroys the temple'],\n    ['AD 130/135', 7, 'Aelia Capitolina founded — the year is debated: Dio implies before the Bar Kokhba revolt, coins suggest about 130, the colony was laid out after 135'],\n    ['AD 691', 9, 'Dome of the Rock built under \\u02bfAbd al-Malik'],\n    ['1099', 10, 'Crusader Templum Domini'],\n    ['1187', 11, 'Saladin restores the Haram'],\n    ['1967', 12, 'Present arrangement of the Haram']\n  ];\n\n  static PERIODS = [\n    { n:1, label:'Ridge', title:'Pre-Israelite ridge (Bronze Age)', range:'c. 3000 – 1000 BC' },\n    { n:2, label:'I Temple', title:'The First Temple', range:'Traditionally mid-10th c. – 587/586 BC' },\n    { n:3, label:'587/586–516/515', title:'Destruction and the Temple of Zerubbabel', range:'587/586 – 516/515 BC' },\n    { n:4, label:'Hasmonean', title:'Persian, Hellenistic, and Hasmonean development', range:'538 – 20/19 BC' },\n    { n:5, label:'Herodian', title:'The Herodian expansion', range:'c. 20/19 BC – AD 70' },\n    { n:6, label:'AD 70', title:'Destruction', range:'AD 70' },\n    { n:7, label:'Aelia', title:'Aelia Capitolina and Julian', range:'AD 130 – 363' },\n    { n:8, label:'Byzantine', title:'Byzantine period: the platform as ruin', range:'c. AD 324 – 638' },\n    { n:9, label:'Umayyad', title:'Early Islamic: the Haram takes shape', range:'AD 638 – 750' },\n    { n:10, label:'Crusader', title:'Crusader Templum Domini', range:'1099 – 1187' },\n    { n:11, label:'Mamluk', title:'Ayyubid, Mamluk and Ottoman', range:'1187 – 1917' },\n    { n:12, label:'Modern', title:'The modern Haram', range:'1917 – present' }\n  ];\n\n  static KEYS = {\n    1: [\n      ['The bare rock summit (es-Sakhra)','excavated','Standing, visible, and geologically continuous with the ridge. Its shape has been surveyed repeatedly; it has never been excavated around.','#c9a248'],\n      ['The cave beneath the rock','inferred','Accessible and mapped, but its origin — natural cavity, tomb, cistern — is unresolved and undated.','#8a7444'],\n      ['Rock-cut cisterns','conjectural','Mapped by Warren (1860s–70s). Rock-cutting leaves no datable stratigraphy; most are probably later.','#8a7444'],\n      ['Shape of the ridge (contour lines)','inferred','Reconstructed from bedrock levels recorded in cisterns and in excavations outside the walls.','#8a7444'],\n      ['The spring and the town below, to the south (Gihon)','excavated','Extensively excavated in several campaigns: fortifications, water systems and domestic quarters on the lower ridge; the remains and their dates remain debated. The conventional Middle Bronze date for the Spring Tower fortifications has been challenged by radiocarbon results pointing to the Iron Age; the date and building sequence remain disputed.','#968564']\n    ],\n    2: [\n      ['The temple building — porch, main hall, inner room (ulam, hekhal, debir)','textual','1 Kings 6–7 and 2 Chronicles 3–4. Side chambers rise in three storeys of 5, 6 and 7 cubits (1 Kings 6:6). Ezekiel 40–42 describes a visionary temple and is used only by analogy. No stone of this building has ever been excavated.','#a04a3c'],\n      ['The two free-standing bronze pillars (Jachin and Boaz)','textual','Described in 1 Kings 7:15–22. Free-standing pillars are paralleled at ʿAin Dara and Tell Taʿyinat.','#d4705c'],\n      ['The great bronze basin and its stands (the \"sea\" and lavers)','textual','1 Kings 7:23–39. No fragment recovered.','#d4705c'],\n      ['The altar and its courtyard','textual','Biblical narrative; dimensions differ between sources.','#d4705c'],\n      ['How far the sacred precinct reached','conjectural','Unknown. Drawn small and dashed because the pre-Herodian enclosure size is itself debated.','#a04a3c']\n    ],\n    3: [\n      ['587/586 BC destruction','excavated','Burnt houses, arrowheads and collapse are excavated in the City of David and Jewish Quarter — not on the platform.','#7a736a'],\n      ['The rebuilt temple (Zerubbabel\\'s)','textual','Ezra 3–6, Haggai, later Josephus. Nothing excavated. The plan drawn here assumes it followed the earlier building; the decree in Ezra 6:3 gives 60 cubits high and 60 wide, which cannot be squared with 1 Kings and may be garbled.','#9db4c4'],\n      ['The altar, rebuilt first','textual','Ezra 3:2–3 places the altar before the house was rebuilt.','#9db4c4']\n    ],\n    4: [\n      ['The earlier walled platform (pre-Herodian enclosure)','contested','Its size and position are argued from the \"straight joint\", from Middot\\'s 500-cubit square, and from wall masonry. Ritmeyer\\'s square is one reading among several.','#5fbfb2'],\n      ['The seam in the eastern wall (the \"straight joint\")','excavated','Visible and measurable: a vertical seam about 32 m north of the southeast corner where Herodian masonry abuts earlier work.','#5fbfb2'],\n      ['Older stonework south of the seam','excavated','Different tooling and course heights; dated variously to the Hasmonean or Persian period.','#5fbfb2'],\n      ['Earth fills of the Hasmonean period','inferred','Known from probes outside the enclosure and from the Ophel, not from the platform.','#5fbfb2']\n    ],\n    5: [\n      ['The retaining walls and their giant course (the Master Course)','excavated','Standing to great height; individual ashlars up to c. 12 m long with drafted margins. Directly measurable.','#d8b45f'],\n      ['Robinson\\'s Arch and its stair','excavated','Springing stones in situ; the pier, shops and the street below were excavated by Mazar and Ben-Dov.','#d8b45f'],\n      ['Wilson\\'s Arch','excavated','Standing; recent excavation beneath it dated construction and later rebuilds.','#d8b45f'],\n      ['Two blocked western gates (Barclay\\'s and Warren\\'s)','excavated','Lintel and blocked jambs survive in the Western Wall and its tunnels.','#f0dca8'],\n      ['The southern pilgrim gates (Double and Triple Gates, traditionally identified with Middot\\'s Hulda Gates)','excavated','The gates themselves are blocked but visible in the southern wall, with Herodian domed vestibules and passages behind; the identification with Middot\\'s Huldah Gates is traditional, not certain.','#f0dca8'],\n      ['Southeastern vaults (\"Solomon\\'s Stables\")','inferred','The vaults are real and accessible; the substructure contains multiple building phases, including early Islamic and later fabric, and proposed Herodian components and their extent remain disputed.','#d8b45f'],\n      ['The great columned hall along the south side (Royal Stoa)','textual','Josephus, Antiquities 15. Supported by carved architectural fragments fallen from above the southern wall.','#d8b45f'],\n      ['Antonia Fortress','contested','Josephus locates it at the northwest; its size and whether the rock scarp there is its base are disputed.','#d8b45f'],\n      ['The low barrier and its warning inscription (soreg)','excavated','Two inscribed blocks survive (Istanbul, 1871; Jerusalem, 1936). The barrier\\'s exact line is not known.','#e8cf8c'],\n      ['The inner courts and their gates (Court of the Women, Nicanor Gate)','textual','Mishnah Middot and Josephus, which disagree on measurements.','#e8cf8c'],\n      ['Altar and sanctuary','contested','Existence certain; position on the platform disputed — see the three reconstructions above.','#f5e3af'],\n      ['The eastern colonnade (Solomon\\'s Porch)','textual','Josephus calls the eastern portico Solomon\\'s; John 10:23 and Acts 3:11, 5:12 place teaching there. Drawn in a cool accent to separate it from the Royal Stoa.','#b8d2d6'],\n      ['Street-level shops under Robinson\\'s Arch','excavated','A row of small vaulted shops opening onto the Herodian street was excavated at the foot of the pier.','#d8b45f'],\n      ['Trumpeting Place parapet','excavated','The inscribed block \"to the place of trumpeting to de[clare]\" fell from this southwestern corner onto the street below, where it was found in 1968.','#e0a86a']\n    ],\n    6: [\n      ['Collapsed courses on the street','excavated','Ashlars found lying where they fell on the Herodian pavement at the southwest corner.','#b03f6c'],\n      ['Trumpeting Place inscription','excavated','Found in that collapse in 1968; reads \"to the place of trumpeting to de[clare]\".','#dd7fa4'],\n      ['Burning within the enclosure','textual','Josephus, War 6. Ash and burnt debris of AD 70 are excavated in the city, not on the platform.','#b03f6c']\n    ],\n    7: [\n      ['An open, empty platform (esplanade)','inferred','Pilgrim and literary accounts describe an open, ruined area; no Roman-period building has been excavated on it.','#8f79b8'],\n      ['A Roman temple to Jupiter (Capitolium)','contested','Cassius Dio says Hadrian founded one on the site; the Chronicon Paschale places it elsewhere. Position and existence both argued.','#b7a3d8'],\n      ['Imperial statues (Hadrianic)','contested','The Bordeaux Pilgrim mentions two statues; a reused inscribed block in the southern wall (the Antoninus Pius stone) shows imperial material was here, but reused.','#b7a3d8'],\n      ['An attempt to rebuild the temple (under Julian), 363','textual','Ammianus Marcellinus and church historians. Abandoned after fire and earthquake; no remains identified.','#b7a3d8']\n    ],\n    8: [\n      ['Reported neglect/refuse in later texts','textual','Later Christian and Islamic texts describe neglect and refuse on or near the platform; the reports are not stratigraphic evidence, and their physical extent is uncertain.','#6f74b0'],\n      ['\"The pierced stone\"','textual','A stone on the site anointed and mourned by Jews once a year, per the Bordeaux Pilgrim. Whether it is es-Sakhra is not certain.','#a2a6dd'],\n      ['Byzantine material in the fill','excavated','Byzantine pottery, tesserae and coins appear in Sifting Project debris — present on the mount, but out of context.','#6f74b0']\n    ],\n    9: [\n      ['Dome of the Rock, 691/692','excavated','Standing. Its foundation inscription names ʿAbd al-Malik and the date. The late seventh-century core, inscription, and substantial interior mosaic decoration survive; the dome and other fabric underwent later rebuilding and restoration.','#8fd0a0'],\n      ['Dome of the Chain','inferred','Standing, Umayyad in origin, but repeatedly rebuilt; purpose (model, treasury, prayer place) debated.','#bfeccb'],\n      ['Early mosque, attested later 7th c.','textual','Arculf (visiting c. 670) and later Arabic sources describe a simple timber building holding a large congregation at the south end; construction date, form and builder uncertain.','#6fae7f'],\n      ['al-Aqsa under al-Walid','inferred','Papyri from Aphrodito record labour and supplies; excavations under the mosque floor by Hamilton (1938–42) found earlier phases.','#6fae7f'],\n      ['Umayyad palace complex','excavated','Large courtyard buildings south and southwest of the walls, extensively excavated, with a bridge to the Haram; function and links to the Haram are interpreted.','#6fae7f'],\n      ['749 earthquake','excavated','Destruction and rebuilding phases visible in the palaces and in the mosque\\'s structural history.','#e0a86a']\n    ],\n    10: [\n      ['The Dome converted to a church (Templum Domini)','excavated','Standing fabric: the rock was paved over, an altar and iron grille installed, a cross set on the dome.','#cfa0dd'],\n      ['al-Aqsa as palace, then Templar headquarters (Templum Salomonis)','excavated','Royal palace, then Templar headquarters; Crusader vaults, capitals and additions survive in and beside the building.','#cfa0dd'],\n      ['Halls and workshops of the Templars','inferred','Known from standing remains west of al-Aqsa and from pilgrim descriptions of the complex.','#cfa0dd'],\n      ['Vaults as stables','textual','Crusader writers describe horses stabled in the southeastern vaults, the origin of the name \"Solomon\\'s Stables\".','#cfa0dd']\n    ],\n    11: [\n      ['The domed drinking fountain (Sabīl Qāytbāy), 1482','excavated','Standing and dated by inscription; the finest Mamluk stone dome in the city.','#9fdfe4'],\n      ['The free-standing stair arcades (qanāṭir)','excavated','Standing at the heads of the stairs to the upper platform; built and rebuilt from the Ayyubid period onward.','#9fdfe4'],\n      ['Teaching colleges and pilgrim hostels (madrasas and ribāṭs)','excavated','Standing along the western and northern edges, most dated by their own inscriptions.','#5aa8b0'],\n      ['The carved wooden pulpit (minbar of Nūr al-Dīn)','textual','Installed by Saladin in 1187; destroyed by arson in 1969, replaced by a replica in 2007.','#9fdfe4'],\n      ['Tile facing on the Dome (revetment), 1545','excavated','Ottoman replacement of the decayed exterior mosaics; renewed several times since.','#9fdfe4'],\n      ['The city walls of Süleyman, 1537–41','excavated','Standing; the northern city wall and the Haram\\'s north edge are tied together.','#9fdfe4']\n    ],\n    12: [\n      ['Dome, 1959–64 and 1993','excavated','Anodised aluminium-bronze replaced the lead sheathing; regilded in gold-plated copper in 1993.','#f0dca8'],\n      ['el-Marwani Mosque, 1999','excavated','The southeastern vaults converted for prayer; the removal of some 400 truckloads of fill prompted the Sifting Project.','#c0cfa2'],\n      ['Western Wall plaza, 1967','excavated','Created by clearing the Mughrabi Quarter after the 19
