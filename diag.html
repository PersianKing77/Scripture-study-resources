<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostic</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #1a1a1a; color: #eee; padding: 2rem; max-width: 700px; margin: 0 auto; }
  h1 { font-size: 1.3rem; }
  input { width: 100%; padding: 0.6rem; font-size: 1rem; margin: 0.5rem 0 1rem; box-sizing: border-box; }
  button { padding: 0.7rem 1.4rem; font-size: 1rem; cursor: pointer; }
  pre { background: #000; color: #0f0; padding: 1rem; border-radius: 6px; white-space: pre-wrap; word-break: break-word; margin-top: 1.5rem; font-size: 0.95rem; }
  .label { color: #999; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>Login diagnostic — shows the raw answer, no dev tools needed</h1>
<div class="label">Email to test</div>
<input type="email" id="email" value="taylor.halverson@gmail.com">
<button id="go">Run the check</button>
<pre id="out">Result will appear here…</pre>

<script>
  document.getElementById('go').addEventListener('click', async () => {
    const out = document.getElementById('out');
    const email = document.getElementById('email').value.trim();
    out.textContent = 'Checking…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const text = await res.text();
      out.textContent = 'HTTP status: ' + res.status + '\n\n' + text;
    } catch (err) {
      out.textContent = 'Request itself failed: ' + err;
    }
  });
</script>
</body>
</html>
