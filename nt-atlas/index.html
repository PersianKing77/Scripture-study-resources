  function scrubMarkup(list){
    scrubList = list;
    if(!scrubOn){
      return `<div class="scrub"><button class="soff" id="scrubon">Play the timeline →</button></div>`;
    }
    scrubIx = Math.max(0, Math.min(list.length - 1, scrubIx));
    const e = list[scrubIx] || {};
    const p = byId[e.place] || {};
    return `<div class="scrub">
      <div class="sl">${e.phase || ''} · ${scrubIx+1} of ${list.length}</div>
      <div class="snow">${e.t || ''}</div>
      <div class="sref">${e.ref || ''} · ${p.name || ''}</div>
      <div class="srow">
        <button class="sbtn" id="sprev" aria-label="Previous event"${scrubIx===0?' disabled':''}>◀</button>
        <input type="range" id="srange" min="1" max="${list.length}" value="${scrubIx+1}"
          aria-label="Chronological position">
        <button class="sbtn" id="snext" aria-label="Next event"${scrubIx===list.length-1?' disabled':''}>▶</button>
      </div>
      <div class="srow"><button class="soff" id="scruboff">Leave the timeline</button></div>
    </div>`;
  }
  function bindScrub(){
    const on = listEl.querySelector('#scrubon');
    if(on){ on.onclick = () => { scrubOn = true; scrubIx = 0; render(); applyScrub(); }; return; }
    const off = listEl.querySelector('#scruboff');
    if(off) off.onclick = () => { scrubOn = false; L_.trail.clearLayers(); if(map.hasLayer(L_.trail)) map.removeLayer(L_.trail); render(); applyHighlight(); };
    const r = listEl.querySelector('#srange');
    if(r){
      r.oninput = () => { scrubIx = +r.value - 1; paintScrubLabel(); };
      r.onchange = () => { scrubIx = +r.value - 1; applyScrub(); };
    }
    const pv = listEl.querySelector('#sprev'), nx = listEl.querySelector('#snext');
    if(pv) pv.onclick = () => { scrubIx--; applyScrub(); };
    if(nx) nx.onclick = () => { scrubIx++; applyScrub(); };
  }
  function paintScrubLabel(){
    const e = scrubList[Math.max(0,Math.min(scrubList.length-1,scrubIx))] || {};
    const p = byId[e.place] || {};
    const box = listEl.querySelector('.scrub');
    if(!box) return;
    box.querySelector('.sl').textContent = `${e.phase || ''} · ${scrubIx+1} of ${scrubList.length}`;
    box.querySelector('.snow').textContent = e.t || '';
    box.querySelector('.sref').textContent = `${e.ref || ''} · ${p.name || ''}`;
  }
  /* the trail: everything reached so far, with the current stop accented */
  function applyScrub(){
    if(!scrubOn || !scrubList.length) return;
    scrubIx = Math.max(0, Math.min(scrubList.length - 1, scrubIx));
    const e = scrubList[scrubIx];
    const seen = new Set(scrubList.slice(0, scrubIx + 1).map(x => x.place));
    L_.trail.clearLayers();
    const pts = [];
    scrubList.slice(0, scrubIx + 1).forEach(x => {
      const p = byId[x.place]; if(!p) return;
      const last = pts[pts.length-1];
      if(!last || last[0] !== p.lat || last[1] !== p.lon) pts.push([p.lat, p.lon]);
    });
    if(pts.length > 1) L.polyline(pts, {pane:'lines', color:'#8c1f0f', weight:2, opacity:.55, dashArray:'2 6'}).addTo(L_.trail);
    L_.trail.addTo(map);
    Object.entries(placeMarkers).forEach(([id,m]) => {
      const el = m.getElement && m.getElement(); if(!el) return;
      const pin = el.querySelector('.pin'); if(!pin) return;
      pin.classList.toggle('hl', id === e.place);
      pin.classList.toggle('dim', !seen.has(id));
    });
    render();
    const p = byId[e.place];
    if(p) goToPoint([p.lat, p.lon], Math.max(map.getZoom(), 9.5));
  }

  /* ——— scripture-reference lookup ——— */
  const BOOKS = {
    gen:'Genesis', genesis:'Genesis', ex:'Exodus', exod:'Exodus', exodus:'Exodus',
    lev:'Leviticus', leviticus:'Leviticus', num:'Numbers', numbers:'Numbers',
    deut:'Deuteronomy', deuteronomy:'Deuteronomy', dt:'Deuteronomy',
    josh:'Joshua', joshua:'Joshua', judg:'Judges', judges:'Judges',
    '1sam':'1 Samuel', '1samuel':'1 Samuel', '2sam':'2 Samuel', '2samuel':'2 Samuel',
    '1kings':'1 Kings', '1kgs':'1 Kings', '2kings':'2 Kings', '2kgs':'2 Kings',
    ps:'Psalm', psa:'Psalm', psalm:'Psalm', psalms:'Psalm',
    isa:'Isaiah', is:'Isaiah', isaiah:'Isaiah', jer:'Jeremiah', jeremiah:'Jeremiah',
    ezek:'Ezekiel', eze:'Ezekiel', ezekiel:'Ezekiel', hos:'Hosea', hosea:'Hosea',
    amos:'Amos', mic:'Micah', micah:'Micah', zech:'Zechariah', zec:'Zechariah', zechariah:'Zechariah',
    mal:'Malachi', malachi:'Malachi',
    mt:'Matthew', matt:'Matthew', mat:'Matthew', matthew:'Matthew',
    mk:'Mark', mr:'Mark', mark:'Mark',
    lk:'Luke', lu:'Luke', luke:'Luke',
    jn:'John', joh:'John', john:'John',
    ac:'Acts', acts:'Acts',
    '2cor':'2 Corinthians', '2corinthians':'2 Corinthians',
    heb:'Hebrews', hebrews:'Hebrews',
    '1macc':'1 Maccabees', '1maccabees':'1 Maccabees', maccabees:'1 Maccabees'
  };
  const bookKey = s => s.toLowerCase().replace(/[.\s]/g,'');
  const RE = /^([1-3]?\s*[a-z]+)\.?\s*(\d+)?(?:\s*[:.]\s*(\d+))?(?:\s*[–—-]\s*(\d+)(?:\s*[:.]\s*(\d+))?)?\s*$/i;

  /* a typed query like "Mark 5", "Jn 4:6" or "Acts 10" */
  function parseQueryRef(q){
    const m = RE.exec(q.trim()); if(!m) return null;
    const book = BOOKS[bookKey(m[1])]; if(!book) return null;
    return {book, ch: m[2] ? +m[2] : null, v: m[3] ? +m[3] : null,
      label: book + (m[2] ? ' ' + m[2] : '') + (m[3] ? ':' + m[3] : '')};
  }

  /* a stored reference: "Matthew 24–25", "Luke 24:13–35", "John 18:28–19:16", "Acts 10" */
  const refCache = {};
  function parseStoredRef(ref){
    if(refCache[ref] !== undefined) return refCache[ref];
    const out = [];
    ref.split(';').forEach(part => {
      const m = RE.exec(part.trim()); if(!m) return;
      const book = BOOKS[bookKey(m[1])]; if(!book) return;
      const c1 = m[2] ? +m[2] : null, v1 = m[3] ? +m[3] : null;
      let c2 = c1, v2 = v1;
      if(m[5] !== undefined && m[5] !== ''){ c2 = +m[4]; v2 = +m[5]; }        /* 18:28–19:16 */
      else if(m[4] !== undefined && m[4] !== ''){
        if(v1 !== null) v2 = +m[4];                                          /* 24:13–35   */
        else c2 = +m[4];                                                     /* 24–25      */
      }
      out.push({book, c1, c2, v1, v2});
    });
    refCache[ref] = out;
    return out;
  }

  function refHit(qr, refString){
    return parseStoredRef(refString).some(r => {
      if(r.book !== qr.book) return false;
      if(qr.ch === null) return true;
      const lo = r.c1 === null ? qr.ch : r.c1, hi = r.c2 === null ? lo : r.c2;
      if(qr.ch < lo || qr.ch > hi) return false;
      if(qr.v === null || r.v1 === null) return true;
      if(lo !== hi) return true;                     /* spans chapters — chapter match is enough */
      const vhi = r.v2 === null ? r.v1 : r.v2;
      return qr.v >= r.v1 && qr.v <= vhi;
    });
  }

  function render(){
    filtersEl.style.display = (tab === 'events') ? 'flex' : 'none';
    if(tab === 'events') renderFilters();
    if(tab === 'places') renderPlaces();
    else if(tab === 'cfm') renderCFM();
    else if(tab === 'events') renderEvents();
    else if(tab === 'tours') renderTours();
    else if(tab === 'journeys') renderJourneys();
    else renderLayers();
  }

  function renderFilters(){
    const anyOn = phaseSel.size || themeSel.size;
    const chip = (o, on) => `<button class="chip${on?' on':''}" data-f="${o}" aria-pressed="${on?'true':'false'}">${o}</button>`;
    filtersEl.innerHTML =
      '<div class="fhint">Filter the map — tap several to combine</div>' +
      chip('All', !anyOn) +
      PHASES.map(o => chip(o, phaseSel.has(o))).join('') +
      THEMES.map(o => chip(o, themeSel.has(o))).join('');
    filtersEl.querySelectorAll('.chip').forEach(c => c.onclick = () => {
      const f = c.dataset.f;
      if(f === 'All'){ phaseSel.clear(); themeSel.clear(); }
      else {
        const set = PHASES.indexOf(f) > -1 ? phaseSel : themeSel;
        if(set.has(f)) set.delete(f); else set.add(f);
      }
      applyHighlight(); render(); updateLegend();
    });
  }

  function evMatches(e){
    if(phaseSel.size && !phaseSel.has(e.phase)) return false;
    if(themeSel.size && !themeSel.has(e.theme)) return false;
    return true;
  }

  /* the filter chips act on the map, not just the list: matching places are lit,
     the rest recede, and any route belonging to a selected phase draws itself */
  let hlPlaces = new Set();
  let autoLayer = false;
  function applyHighlight(){
    const active = phaseSel.size > 0 || themeSel.size > 0;
    /* a CFM week owns the map's highlighting until filters are used */
    if(!active && cfmWeek !== null){ autoOn.clear(); refreshJourneys(); cfmPaint(); return; }
    hlPlaces = new Set(active ? D.EVENTS.filter(evMatches).map(e => e.place) : []);
    Object.entries(placeMarkers).forEach(([id,m]) => {
      const el = m.getElement && m.getElement(); if(!el) return;
      const pin = el.querySelector('.pin'); if(!pin) return;
      pin.classList.toggle('hl', active && hlPlaces.has(id));
      pin.classList.toggle('dim', active && !hlPlaces.has(id));
    });
    autoOn.clear();
    if(phaseSel.size) D.JOURNEYS.forEach(j => { if(phaseSel.has(j.phase)) autoOn.add(j.id); });
    const userRoutes = Object.keys(journeyOn).some(k => journeyOn[k]);
    if(autoOn.size && !layerOn.journeys){ autoLayer = true; setLayerCheckbox('journeys', true); }
    else if(!autoOn.size && autoLayer && !userRoutes){ autoLayer = false; setLayerCheckbox('journeys', false); }
    else refreshJourneys();

    /* bring the matched set into view — fitBounds honours padding, so the drawer
       width is reserved and nothing lands under the open panel */
    if(active && hlPlaces.size){
      const pts = [...hlPlaces].map(id => byId[id]).filter(Boolean).map(p => [p.lat, p.lon]);
      if(pts.length){
        let b = L.latLngBounds(pts);
        if(pts.length > 1) b = b.pad(.14);
        const drawer = drawerShift() > 0 ? drawerWidth() : 0;
        const vdrawer = isMobileLayout() ? sheetHeight() : 0;
        map.fitBounds(b, {paddingTopLeft:[24,24], paddingBottomRight:[drawer + 24, vdrawer + 34], maxZoom:13, animate:false});
        applyZoomTier();
      }
    }
    declutterLabels();
  }

  function match(p){
    if(!query) return true;
    const hay = [p.name, p.modern, p.blurb, p.region, p.greco, p.jewish, p.arch, p.geo, p.why,
      (p.scriptures||[]).map(s => s.ref + ' ' + s.text).join(' ')].join(' ').toLowerCase();
    return hay.indexOf(query) > -1;
  }

  function renderPlaces(){
    const qr = query ? parseQueryRef(query) : null;
    const pool = qr
      ? D.PLACES.filter(p => (p.scriptures||[]).some(s => refHit(qr, s.ref))
          || D.EVENTS.some(e => e.place === p.id && refHit(qr, e.ref)))
      : D.PLACES.filter(match);
    const banner = qr
      ? `<div class="refbanner">Passages in <b>${qr.label}</b> — ${pool.length} place${pool.length===1?'':'s'}</div>` : '';
    const groups = {};
    pool.forEach(p => { (groups[p.region] = groups[p.region] || []).push(p); });
    const order = REGION_ORDER.filter(r => groups[r]).concat(Object.keys(groups).filter(r => REGION_ORDER.indexOf(r) < 0));
    if(!order.length){
      listEl.innerHTML = banner + `<div class="empty">${qr ? 'No place in the atlas is tied to that passage.' : 'No place matches that search.'}</div>`;
      return;
    }
    const refblock = (query || tourId) ? '' :
      `<div class="grouphdr">Reference</div>
       <button class="item" data-ref="about">
         <div class="nm">About this atlas</div>
         <div class="mt">Prepared by Taylor Halverson, PhD · beta version</div>
         <div class="rf">About the author, sources, and how to use it</div>
       </button>
       <button class="item" data-ref="herods">
         <div class="nm">The Herods — who's who</div>
         <div class="mt">Five rulers called Herod, two Philips, four generations</div>
       </button>
       <button class="item" data-ref="profiles">
         <div class="nm">Elevation profiles</div>
         <div class="mt">The Jericho ascent, the pilgrim road, and the whole rift</div>
       </button>`;
    listEl.innerHTML = banner + packBar() + savedBlock() + refblock + order.map(r =>
      `<div class="grouphdr">${r}</div>` + groups[r].map(p =>
        `<button class="item${selected===p.id?' on':''}${pack.has(p.id)?' picked':''}" data-pid="${p.id}">
           <div class="nm">${p.name}</div>
           <div class="mt">${p.modern}</div>
           <div class="mt" style="font-size:11px">${(TIERS[p.conf]||{}).label || ''} · ${p.lat.toFixed(3)}, ${p.lon.toFixed(3)}</div>
           ${packMode ? '<span class="chk"></span>' : (stars.has(p.id) ? '<span class="star" title="Saved">★</span>' : '')}
         </button>`).join('')).join('');
    bindItems();
  }

  function renderEvents(){
    const qr = query ? parseQueryRef(query) : null;
    let evs = D.EVENTS.filter(e => {
      if(!evMatches(e)) return false;
      if(!query) return true;
      if(qr) return refHit(qr, e.ref);
      const p = byId[e.place] || {};
      return (e.t + ' ' + e.ref + ' ' + e.s + ' ' + (p.name||'')).toLowerCase().indexOf(query) > -1;
    });
    const banner = qr
      ? `<div class="refbanner">Events in <b>${qr.label}</b> — ${evs.length} match${evs.length===1?'':'es'}</div>` : '';
    if(!evs.length){
      listEl.innerHTML = banner + '<div class="empty">No event matches those filters.</div>';
      return;
    }
    const groups = {};
    evs.forEach(e => { (groups[e.phase] = groups[e.phase] || []).push(e); });
    const active = phaseSel.size || themeSel.size;
    const tally = active
      ? `<div class="tally">${evs.length} event${evs.length===1?'':'s'} · ${hlPlaces.size} place${hlPlaces.size===1?'':'s'} lit on the map<button class="chip" id="clearf">Clear</button></div>` : '';
    listEl.innerHTML = banner + scrubMarkup(evs) + tally + PHASES.filter(ph => groups[ph]).map(ph =>
      `<div class="grouphdr">${ph}</div>` + groups[ph].map(e =>
        `<button class="item${selected===e.place?' on':''}" data-pid="${e.place}" data-eid="${e.id}">
           <div class="nm">${e.t}</div>
           <div class="rf">${e.ref} · ${(byId[e.place]||{}).name||''}</div>
           <div class="mt" style="font-style:normal;color:var(--ink-3)">${e.s}</div>
         </button>`).join('')).join('');
    const cf = listEl.querySelector('#clearf');
    if(cf) cf.onclick = () => { phaseSel.clear(); themeSel.clear(); applyHighlight(); render(); updateLegend(); };
    bindScrub();
    bindItems();
  }

  function renderJourneys(){
    listEl.innerHTML = `<div class="grouphdr">Traced routes — tap to show on the map</div>` +
      D.JOURNEYS.map(j =>
        `<label class="lyr" style="border-left:3px solid ${j.color}">
           <input type="checkbox" data-jid="${j.id}"${journeyOn[j.id]?' checked':''}>
           <span><span class="lt">${j.name}</span>
             <span class="ld" style="display:block"><b style="color:#8c3a2b;font-weight:400">${j.refs}</b> — ${j.note}</span></span>
         </label>`).join('') +
      `<div class="ringctl" style="border-top:1px solid #c3b190;margin-top:8px">
         <button class="chip" id="j-all">Show all routes</button>
         <button class="chip" id="j-none" style="margin-left:6px">Hide all</button>
       </div>`;
    listEl.querySelectorAll('input[data-jid]').forEach(cb => cb.onchange = () => setJourney(cb.dataset.jid, cb.checked));
    listEl.querySelector('#j-all').onclick = () => { D.JOURNEYS.forEach(j => setJourney(j.id, true)); render(); };
    listEl.querySelector('#j-none').onclick = () => { D.JOURNEYS.forEach(j => setJourney(j.id, false)); render(); };
  }

  function setJourney(id, on){
    journeyOn[id] = on;
    if(on && !layerOn.journeys) setLayerCheckbox('journeys', true);
    else refreshJourneys();
    updateLegend();
  }

  function setLayerCheckbox(id, on){
    applyLayer(id, on);
    const cb = document.querySelector(`input[data-lid="${id}"]`);
    if(cb) cb.checked = on;
  }

  function renderLayers(){
    listEl.innerHTML = '<div class="layers">' + LAYERS.map(l => {
      if(l.sec) return `<div class="lyr-sec">${l.sec}</div>`;
      return `<label class="lyr">
          <input type="checkbox" data-lid="${l.id}"${layerOn[l.id]?' checked':''}>
          <span class="swatch" style="background:${l.c}"></span>
          <span><span class="lt">${l.t}</span><span class="ld">${l.d}</span></span>
        </label>` + (l.ring ? `<div class="ringctl">Measure walking distance from:
          <select id="ringsel">${D.PLACES.map(p => `<option value="${p.id}"${p.id===ringCenter?' selected':''}>${p.name}</option>`).join('')}</select></div>` : '');
    }).join('') + '</div>';
    listEl.querySelectorAll('input[data-lid]').forEach(cb => cb.onchange = () => { applyLayer(cb.dataset.lid, cb.checked); updateLegend(); writeHash(); });
    const rs = listEl.querySelector('#ringsel');
    if(rs) rs.onchange = () => { ringCenter = rs.value; if(layerOn.rings) drawRings(); };
  }

  function bindItems(){
    listEl.querySelectorAll('[data-ref="herods"]').forEach(b => b.onclick = showHerods);
    listEl.querySelectorAll('[data-ref="about"]').forEach(b => b.onclick = showAbout);
    listEl.querySelectorAll('[data-ref="profiles"]').forEach(b => b.onclick = showProfiles);
    listEl.querySelectorAll('.item[data-pid]').forEach(b => b.onclick = () => select(b.dataset.pid, b.dataset.eid));
    const pd = listEl.querySelector('#packdone'), pp = listEl.querySelector('#packprint'),
          pc = listEl.querySelector('#packclear');
    if(pd) pd.onclick = () => { packMode = false; render(); };
    if(pp) pp.onclick = printPacket;
    if(pc) pc.onclick = () => { pack.clear(); render(); };
    const sc = listEl.querySelector('#savedclear');
    if(sc) sc.onclick = () => {
      if(!confirm('Remove all saved places? Your notes are kept.')) return;
      stars.clear(); store.write('ntatlas.stars', []); render();
    };
  }

  /* ——— legend ——— */
  let legendOpen = false;
  function updateLegend(){
    const rows = [];
    if(layerOn.places) rows.push(
      ['kd','#8c3a2b','Jerusalem / capital'], ['kd','#4b3f8f','Greco-Roman city'],
      ['kd','#6b6b28','Decapolis city'], ['kd','#2f6b46','Village or town'], ['kd','#3f6b6b','Site or landmark'],
      ['kdash','#8c5a2b','Dashed ring — identification contested'],
      ['khollow','#8c3a2b','Hollow dot — traditional or conjectural']);
    if(layerOn.roads) rows.push(['k','#7a5c34','Roman road']);
    if(layerOn.regions) rows.push(['k','#6b3f6b','Tetrarchy border']);
    if(layerOn.culture) rows.push(['kd','#3f6b6b','Gentile territory'],['kd','#a8763c','Samaritan territory']);
    if(layerOn.water) rows.push(['k','#2f6b78','The Jordan']);
    if(layerOn.rings) rows.push(['k','#8c3a2b',"Day's walk ring"]);
    const js = D.JOURNEYS.filter(j => (journeyOn[j.id] || autoOn.has(j.id)) && layerOn.journeys);
    js.forEach(j => rows.push(['k', j.color, j.name.replace(/ \(.*\)/,'')]));
    document.getElementById('legend').innerHTML = (rows.length
      ? '<h4>Legend</h4>' + rows.map(([k,c,t]) => {
          /* the two confidence rows have to look like what they describe, or the key
             is telling the reader something the map is not */
          const style = k === 'k' ? 'border-top-color:' + c
            : k === 'kdash' ? 'background:transparent;border:2px dashed ' + c
            : k === 'khollow' ? 'background:#f6eeda;border:2px dotted ' + c
            : 'background:' + c;
          const cls = (k === 'kdash' || k === 'khollow') ? 'kd' : k;
          return `<div class="row"><span class="${cls}" style="${style}"></span><span>${t}</span></div>`;
        }).join('')
      : '<h4>Legend</h4><div class="row" style="color:var(--ink-3)"><span>No layers shown.</span></div>')
      + '<div class="srcnote">Place confidence describes identification of the physical location; it does not by itself mean scripture or history locates the <i>event</i> there too — see "Event location" notes in place detail where they differ. Historical overlays drawn after Josephus, the Mishnah, and modern excavation reports; boundaries and routes are approximate. Base map © OpenStreetMap contributors.</div>';
    const legendEl = document.getElementById('legend');
    legendEl.dataset.collapsed = legendOpen ? '0' : '1';
    const h4 = legendEl.querySelector('h4');
    /* collapsed by default on the mobile sheet only, where the legend used to eat a
       fixed slice of an already-short panel; a tap expands it without a rebuild */
    if(h4) h4.onclick = () => { legendOpen = !legendOpen; legendEl.dataset.collapsed = legendOpen ? '0' : '1'; };
  }

  /* ——— guided tours ——— */
  let tourId = null, tourStep = 0;
  const tourById = {}; D.TOURS.forEach(t => tourById[t.id] = t);

  function renderTours(){
    if(!tourId){
      listEl.innerHTML = '<div class="grouphdr">Guided tours — walk a sequence at your own pace</div>' +
        D.TOURS.map(t =>
          `<button class="item" data-tour="${t.id}">
             <div class="nm">${t.name}</div>
             <div class="mt" style="font-style:normal">${t.sub}</div>
             <div class="rf">${t.steps.length} stops</div>
           </button>`).join('');
      listEl.querySelectorAll('[data-tour]').forEach(b => b.onclick = () => enterTour(b.dataset.tour));
      return;
    }
    const t = tourById[tourId];
    listEl.innerHTML =
      `<div class="tourhead"><h3>${t.name}</h3><div class="ts">${t.sub}</div>
         <button id="exittour">← All tours</button>
         <button id="printtour">Print this tour</button>
         <button id="linktour">Copy link</button></div>` +
      t.steps.map((s,i) =>
        `<button class="step${i===tourStep?' on':''}" data-si="${i}">
           <span class="num">${i+1}</span>
           <span><span class="st">${s.t}</span><span class="sr" style="display:block">${s.ref}</span></span>
         </button>`).join('');
    listEl.querySelector('#exittour').onclick = exitTour;
    listEl.querySelector('#printtour').onclick = () => printTour(t);
    listEl.querySelector('#linktour').onclick = e => copyLink(e.currentTarget);
    listEl.querySelectorAll('[data-si]').forEach(b => b.onclick = () => goStep(+b.dataset.si));
  }

  function enterTour(id){
    tourId = id; tourStep = 0;
    drawTourPath();
    render();
    goStep(0);
  }
  function clearTour(){
    tourId = null; L_.tourpath.clearLayers();
    if(map.hasLayer(L_.tourpath)) map.removeLayer(L_.tourpath);
  }
  function exitTour(){
    clearTour();
    closeDetail(); render();
  }
  function drawTourPath(){
    L_.tourpath.clearLayers();
    const t = tourById[tourId]; if(!t) return;
    const pts = [];
    t.steps.forEach(s => {
      const p = byId[s.place]; if(!p) return;
      const last = pts[pts.length-1];
      if(!last || last[0] !== p.lat || last[1] !== p.lon) pts.push([p.lat, p.lon]);
    });
    if(pts.length > 1){
      L.polyline(pts, {pane:'lines', color:'#f3e9d4', weight:8, opacity:.6}).addTo(L_.tourpath);
      L.polyline(pts, {pane:'lines', color:'#8c1f0f', weight:3, opacity:.9, dashArray:'2 7'}).addTo(L_.tourpath);
    }
    L_.tourpath.addTo(map);
  }
  function goStep(i){
    const t = tourById[tourId]; if(!t) return;
    tourStep = Math.max(0, Math.min(t.steps.length - 1, i));
    render();
    select(t.steps[tourStep].place, null, t.steps[tourStep]);
    writeHash();
  }

  /* ——— CFM: lesson focus mode ———
     Picking a week frames its theatre of action, lights the sites and routes that
     block of scripture covers, dims everything else, and puts the lesson card in
     the sidebar. Filters, tours and a manual route choice all override it. */
  const CFM = D.CFM || [];
  const cfmByWeek = {}; CFM.forEach(w => cfmByWeek[w.week] = w);
  const cfmOn = new Set();
  let cfmWeek = null;

  const cfmPlaces = w => (w.relevantPlaceIds || []).map(id => byId[id]).filter(Boolean);
  const cfmRoutes = w => (w.relevantJourneyIds || []).map(id => D.JOURNEYS.find(j => j.id === id)).filter(Boolean);
  const cfmShort = w => w.title.replace(/^Week (\d+): /, 'Wk $1 · ');

  function cfmPaint(){
    const w = cfmByWeek[cfmWeek];
    const ids = w ? new Set(w.relevantPlaceIds || []) : null;
    Object.entries(placeMarkers).forEach(([id,m]) => {
      const el = m.getElement && m.getElement(); if(!el) return;
      const pin = el.querySelector('.pin'); if(!pin) return;
      pin.classList.toggle('hl', !!ids && ids.has(id));
      pin.classList.toggle('dim', !!ids && !ids.has(id));
    });
    declutterLabels();
  }

  function setCfmWeek(n, opts){
    const w = cfmByWeek[n]; if(!w) return;
    cfmWeek = n;
    if(tourId) clearTour();
    phaseSel.clear(); themeSel.clear();
    if(scrubOn){ scrubOn = false; L_.trail.clearLayers(); if(map.hasLayer(L_.trail)) map.removeLayer(L_.trail); }
    autoOn.clear();
    D.JOURNEYS.forEach(j => journeyOn[j.id] = false);
    cfmOn.clear();
    (w.relevantJourneyIds || []).forEach(id => cfmOn.add(id));
    setLayerCheckbox('journeys', cfmOn.size > 0);
    refreshJourneys();
    cfmPaint();
    const sel = document.getElementById('cfm-sel'); if(sel) sel.value = String(n);
    setTab('cfm'); render(); updateLegend();
    if(!(opts && opts.noFly)){
      const gutter = drawerShift() > 0 ? drawerWidth() : 0;
      const vgutter = isMobileLayout() ? sheetHeight() : 0;
      goToBounds(L.latLngBounds(w.targetBounds),
        {paddingTopLeft:[26,26], paddingBottomRight:[gutter + 26, vgutter + 36], maxZoom:16});
    }
    if(isMobileLayout() && !detail.classList.contains('open')) openDrawer();
    writeHash();
  }

  function exitCfm(){
    cfmWeek = null;
    cfmOn.clear();
    D.JOURNEYS.forEach(j => journeyOn[j.id] = false);
    setLayerCheckbox('journeys', false);
    cfmPaint();
    const sel = document.getElementById('cfm-sel'); if(sel) sel.value = '';
    render(); updateLegend();
    goView('whole');
    writeHash();
  }

  function stepCfm(d){
    if(cfmWeek === null) return setCfmWeek(d > 0 ? 0 : CFM.length - 1);
    const n = Math.max(0, Math.min(CFM.length - 1, cfmWeek + d));
    if(n !== cfmWeek) setCfmWeek(n);

      ${lt ? `<div class="ps-conf"><b>The letter</b><br>

  function printPlace(p){ sheet.innerHTML = placeSheet(p); window.print(); }

  /* ——— shareable links ——— */
  let hashLock = false;
  function writeHash(){
    if(hashLock) return;
    const bits = [];
    if(cfmWeek !== null) bits.push('cfm=' + cfmWeek);
    if(tourId) bits.push('tour=' + tourId + ':' + (tourStep + 1));
    else if(selected) bits.push('place=' + selected);
    const on = LAYERS.filter(l => l.id && layerOn[l.id]).map(l => l.id);
    if(on.length) bits.push('layers=' + on.join(','));
    const h = bits.join('&');
    history.replaceState(null, '', location.pathname + location.search + (h ? '#' + h : ''));
  }
  function readHash(){
    const raw = location.hash.replace(/^#/, '');
    if(!raw) return false;
    const q = {};
    raw.split('&').forEach(kv => { const i = kv.indexOf('='); if(i > 0) q[kv.slice(0,i)] = decodeURIComponent(kv.slice(i+1)); });
    hashLock = true;
    if(q.layers){
      const want = new Set(q.layers.split(','));
      LAYERS.forEach(l => { if(l.id) setLayerCheckbox(l.id, want.has(l.id)); });
    }
    let landed = false;
    if(q.cfm !== undefined && cfmByWeek[+q.cfm]){ setCfmWeek(+q.cfm); landed = true; }
    if(q.tour && tourById[q.tour.split(':')[0]]){
      const [id, st] = q.tour.split(':');
      setTab('tours'); enterTour(id); goStep((+st || 1) - 1); landed = true;
    } else if(q.place && byId[q.place]){
      select(q.place); landed = true;
    }
    hashLock = false;
    if(landed) writeHash();
    return landed;
  }
  function copyLink(btn){
    writeHash();
    const url = location.href;
    const done = () => { const t = btn.textContent; btn.textContent = 'Link copied'; setTimeout(() => btn.textContent = t, 1600); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, done);
    else {
      const ta = document.createElement('textarea');
      ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta); done();
    }
  }

  /* keyboard access to the markers */
  document.addEventListener('keydown', e => {

    if(!pin) return;
    e.preventDefault();

  });

  /* ——— elevation profiles ——— */
  function profileSvg(pr){
    const W = 420, H = 165, L = 34, R = 8, T = 14, B = 26;
    const fts = pr.pts.map(p => p.ft), mis = pr.pts.map(p => p.mi);
    const fmin = Math.min(...fts), fmax = Math.max(...fts), mmax = Math.max(...mis);
    const pad = (fmax - fmin) * .12;
    const lo = fmin - pad, hi = fmax + pad;
    const x = mi => L + (mi / mmax) * (W - L - R);
    const y = ft => T + (1 - (ft - lo) / (hi - lo)) * (H - T - B);
    const line = pr.pts.map((p,i) => (i ? 'L' : 'M') + x(p.mi).toFixed(1) + ' ' + y(p.ft).toFixed(1)).join(' ');
    const area = line + ` L${x(mmax).toFixed(1)} ${y(lo).toFixed(1)} L${x(0).toFixed(1)} ${y(lo).toFixed(1)} Z`;
    const sea = (lo < 0 && hi > 0) ? `<line x1="${L}" y1="${y(0).toFixed(1)}" x2="${W-R}" y2="${y(0).toFixed(1)}"
      stroke="#2f6b78" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="${L+3}" y="${(y(0)-3).toFixed(1)}" font-size="7" fill="#2f6b78">sea level</text>` : '';
    const marks = pr.pts.filter(p => p.l).map(p =>
      `<circle cx="${x(p.mi).toFixed(1)}" cy="${y(p.ft).toFixed(1)}" r="2.6" fill="#8c3a2b"/>
       <text x="${x(p.mi).toFixed(1)}" y="${(y(p.ft) - 7).toFixed(1)}" font-size="7.5" fill="#241c14"
         text-anchor="${p.mi > mmax * .82 ? 'end' : (p.mi < mmax * .12 ? 'start' : 'middle')}">${p.l}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Elevation profile: ${pr.name}">
      <path d="${area}" fill="#d9c9a4" opacity=".55"/>
      <path d="${line}" fill="none" stroke="#7a5c34" stroke-width="1.6"/>
      ${sea}${marks}
      <text x="4" y="${(T+4)}" font-size="7.5" fill="#645436">${fmax.toLocaleString()} ft</text>
      <text x="4" y="${(H-B+4)}" font-size="7.5" fill="#645436">${fmin.toLocaleString()} ft</text>
      <text x="${L}" y="${H-8}" font-size="7.5" fill="#645436">0 mi</text>
      <text x="${W-R}" y="${H-8}" font-size="7.5" fill="#645436" text-anchor="end">${mmax} mi</text>
    </svg>`;
  }
  function showProfiles(){
    detail.innerHTML = `
      <div class="dhead">
        <button class="dclose" title="Close" aria-label="Close">×</button>
        <div class="cat">Terrain</div>

      </div>
      <div class="dbody">
        ${D.PROFILES.map(pr => `<div class="prof">
          <h4>${pr.name}</h4>
          <div class="ps">${pr.sub}</div>
          <div class="pr">${pr.ref}</div>
          ${profileSvg(pr)}
          <p>${pr.note}</p>
        </div>`).join('')}

    openPanel();
  }

  /* one place that opens any reference panel: wires the close button, moves focus
     into the panel for keyboard and screen-reader users, clears the mobile drawer,
     and traps Tab inside the panel while it's open (WCAG 2.1.2 / 2.4.3) */
  let panelReturnFocus = null, panelTrapWired = false;
  function panelFocusables(){
    return [...detail.querySelectorAll('a[href],button,textarea,select,input,[tabindex]:not([tabindex="-1"])')]
      .filter(el => el.offsetParent !== null);
  }
  function openPanel(){
    if(!panelTrapWired){
      panelTrapWired = true;
      detail.addEventListener('keydown', e => {
        if(!detail.classList.contains('open')) return;
        if(e.key === 'Escape'){ closeDetail(); return; }
        if(e.key !== 'Tab') return;
        const items = panelFocusables();
        if(!items.length) return;
        const first = items[0], last = items[items.length - 1];
        if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
      });
    }
    if(!detail.classList.contains('open')) panelReturnFocus = document.activeElement;
    detail.classList.add('open');
    detail.setAttribute('aria-modal', 'true');
    const x = detail.querySelector('.dclose');
    if(x){ x.setAttribute('aria-label','Close'); x.onclick = closeDetail; }
    if(isMobileLayout()) closeDrawer();
    if(x) x.focus();
  }

  /* ——— about ——— */
  function showAbout(){
    detail.innerHTML = `
      <div class="dhead">
        <button class="dclose" title="Close">×</button>
        <div class="cat">About</div>
        <h2>New Testament Atlas</h2>

        <div class="blurb">An interactive atlas of the world of the Gospels and early Acts — Galilee, the Decapolis,

        <div class="sec"><h3>Beta reconstruction notice</h3>
          <p>This beta presents a schematic educational reconstruction based on selected published research.
          Dates, elevations, dimensions, routes, and disputed identifications may be simplified. Where evidence

        <div class="sec"><h3>What's in it</h3>
          <p>${D.PLACES.filter(p=>!p.nonSite).length} places, ${D.EVENTS.length} events, ${D.JOURNEYS.length} traced routes,

        <div class="sec"><h3>How sure are we?</h3>
          <p>Every place carries a graded identification — <b style="font-weight:500">secure</b>,
          <b style="font-weight:500">probable</b>, <b style="font-weight:500">contested</b> or
          <b style="font-weight:500">conjectural</b> — shown as a chip in its panel and on the map itself:
          contested sites wear a dashed ring, conjectural ones a hollow dot. Where two candidates are argued
          in print, the panel lays out both. Every panel also lists its sources by author and title.</p></div>

        <div class="sec"><h3>How to use it</h3>
          <p><b style="font-weight:500">Search a reference.</b> Type <em>Mark 5</em>, <em>Jn 4:6</em> or
          <em>Acts 10</em> and the atlas finds the places and events tied to that passage.</p>
          <p><b style="font-weight:500">Filter the map.</b> On the Events tab, tap a phase or theme —
          matching places light up, everything else recedes, and the relevant route draws itself. Tap several to combine.</p>
          <p><b style="font-weight:500">Walk a tour.</b> The Tours tab steps through a sequence with Back and Next.</p>
          <p><b style="font-weight:500">Turn layers on and off.</b> Boundaries, roads, terrain, harbours, the Twelve,
          rabbinic academies, sacred sites, walking distances, modern names.</p>
          <p><b style="font-weight:500">Print or share.</b> Any place or tour prints as a study sheet, and the link
          in your address bar carries your place and your active layers.</p>
          <p><b style="font-weight:500">Study tools.</b> The <em>Tools</em> menu measures the distance and days
          on foot between any two places, shows the chronology band, runs a map-recall drill with the labels
          off, saves the view as an image, builds a multi-place printed packet, and keeps your saved places
          and notes — which print on the sheet with the rest. Shortcuts: <em>M</em>, <em>T</em>, <em>Q</em>,
          <em>S</em>, <em>P</em> for presenter mode.</p></div>

        <div class="sec"><h3>Sources &amp; cautions</h3>
          <p>Scripture is quoted from the World English Bible, a public-domain modern-English translation. Historical and cultural notes draw on Josephus,
          the Mishnah and Talmud, Greco-Roman writers, and published excavation reports. Where archaeology and
          the ancient sources disagree — as over the date the Samaritan temple on Gerizim fell — both are given.</p>
          <p>Political boundaries and journey routes are drawn from real terrain but remain approximate —
          ancient frontiers were zones, not lines. Where a site's identification is genuinely debated
          (Cana, Bethsaida, Emmaus, the Praetorium, the mount of the Transfiguration), the panel says so and
          names the competing candidates rather than resolving them.</p>
          <p>The parchment view is the modern map, tinted; switching to Modern removes the tint.
          ${BASEMAP.credit.charAt(0).toUpperCase() + BASEMAP.credit.slice(1)}.</p>
          ${(D.GENERAL_SOURCES || []).length ? `<h3 style="margin-top:15px">Cited throughout</h3>

        <div class="sec"><h3>Beta</h3>

        <div class="sec"><h3>About the author</h3>
          <p><b style="font-weight:500">Taylor Halverson, Ph.D.</b><br>
          <span style="color:var(--ink-3)">Author · Teacher · Tour leader · Scripture scholar</span></p>
          <p style="margin-top:9px">Taylor Halverson is a scholar of scripture and a teacher of learners — an

          <p style="margin-top:9px">He is the author and editor of more than fifty books and nearly a thousand

    if(e.metaKey || e.ctrlKey || e.altKey) return;

  /* ——— saved places & notes ———
     Kept in this browser only. A teacher preparing week 14 wants their own note
     on Capernaum to still be there next year; nothing leaves the device. */
  const store = {
    read(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
    write(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  let stars = new Set(store.read('ntatlas.stars', []));
  let notes = store.read('ntatlas.notes', {});
  function toggleStar(pid){
    stars.has(pid) ? stars.delete(pid) : stars.add(pid);
    store.write('ntatlas.stars', [...stars]);
  }
  function setNote(pid, txt){
    if(txt && txt.trim()) notes[pid] = txt; else delete notes[pid];
    store.write('ntatlas.notes', notes);
  }
  function paintStar(btn, pid){
    if(!btn) return;
    const on = stars.has(pid);
    btn.textContent = on ? '★ Saved' : '☆ Save';

    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

          <span class="star" title="Saved">★</span>
        </button>`;
      }).join('');
  }

  /* ——— confidence rendering ——— */
  function confChip(p){
    const t = TIERS[p.conf]; if(!t) return '';
    return `<div class="confchip" style="color:${t.color}" title="${esc(t.blurb)}"><span class="dot"></span>${t.short}</div>`;
  }
  function confBlock(p){
    const t = TIERS[p.conf]; if(!t) return '';
    if(p.conf === 'certain' && !p.confNote) return '';
    return `<div class="confblock" style="border-left-color:${t.color}">
      <div class="cb-t" style="color:${t.color}">${t.label}</div>
      <div>${t.blurb}</div>
      ${p.confNote ? `<div style="margin-top:8px">${p.confNote}</div>` : ''}
    </div>`;
  }

  /* ——— study packet: several places, one print run ——— */
  let packMode = false;
  const pack = new Set();
  function packBar(){
    if(!packMode) return '';
    return `<div class="packbar">
      <span class="pc">Study packet — ${pack.size} place${pack.size===1?'':'s'} chosen</span>
      <button class="chip" id="packprint"${pack.size?'':' disabled'}>Print packet</button>
      <button class="chip" id="packclear">Clear</button>
      <button class="chip" id="packdone">Done</button>
    </div>`;
  }
  function togglePack(pid){
    pack.has(pid) ? pack.delete(pid) : pack.add(pid);
    render();
    say(pack.size + ' places in the packet');
  }
  function printPacket(){
    const ids = [...pack].filter(id => byId[id]);
    if(!ids.length) return;
    sheet.innerHTML = ids.map((id,i) =>
      `<div${i ? ' class="ps-break"' : ''}>${placeSheet(byId[id])}</div>`).join('');
    window.print();
  }

  /* ——— measure: two places, the distance, and the days it cost ——— */
  grp('measure'); L_.measure.addTo(map);
  let measureOn = false, mA = null, mB = null;
  const measurebar = document.getElementById('measurebar');
  function setMeasure(on, firstPid){
    measureOn = on;
    document.body.classList.toggle('measure', on);
    if(!on){ mA = mB = null; L_.measure.clearLayers(); }
    else { mA = firstPid || null; mB = null; if(firstPid) closeDetail(); }
    drawMeasure();
    buildToolsMenu();
    say(on ? 'Measure mode on. Tap two places.' : 'Measure mode off.');
  }
  function haversine(a, b){
    const R = 6371, rad = x => x * Math.PI / 180;
    const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
    const s = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  function bearingWord(a, b){
    const rad = x => x * Math.PI/180, deg = x => x * 180/Math.PI;
    const y = Math.sin(rad(b.lon-a.lon)) * Math.cos(rad(b.lat));
    const x = Math.cos(rad(a.lat))*Math.sin(rad(b.lat)) - Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lon-a.lon));
    const br = (deg(Math.atan2(y,x)) + 360) % 360;
    return ['north','north-east','east','south-east','south','south-west','west','north-west'][Math.round(br/45) % 8];
  }
  /* one distance formatter for every tool. Jerusalem's sites sit a few hundred
     metres apart, so anything that rounds to whole miles answers "0" exactly where
     the atlas is studied hardest — Praetorium to Golgotha, Siloam to the Temple. */
  function fmtDist(km){
    const mi = km * 0.621371;
    if(km < 1.6){
      const m = Math.max(10, Math.round(km * 1000 / 10) * 10);
      const yd = Math.max(10, Math.round(km * 1093.613 / 10) * 10);
      return {short: m + ' m · ' + yd + ' yd', long: m + ' metres · ' + yd + ' yards'};
    }
    if(mi < 10) return {short: km.toFixed(1) + ' km · ' + mi.toFixed(1) + ' mi',
                        long: km.toFixed(1) + ' km · ' + mi.toFixed(1) + ' miles'};
    return {short: Math.round(km) + ' km · ' + Math.round(mi) + ' mi',
            long: Math.round(km).toLocaleString() + ' km · ' + Math.round(mi).toLocaleString() + ' miles'};
  }
  /* a bare quantity for the quiz hint — never zero */
  function fmtGap(km){
    const mi = km * 0.621371;
    if(km < 1.6) return Math.max(10, Math.round(km * 1000 / 10) * 10) + ' metres';
    if(mi < 10) return mi.toFixed(1) + ' miles';
    return Math.round(mi) + ' miles';
  }
  const shortName = p => SHORT[p.id] || p.name.split(' (')[0];
  function onFoot(mi){
    const km = mi / 0.621371;
    if(km < 1.6) return 'about ' + Math.max(2, Math.round(km / 4.8 * 60 / 5) * 5) + ' minutes on foot';
    if(mi < 3) return 'under an hour on foot';
    if(mi < 13){ const h = Math.max(1, Math.round(mi/3)); return h === 1 ? 'about an hour on foot' : 'about ' + h + ' hours on foot'; }
    const lo = Math.max(1, Math.floor(mi/22)), hi = Math.max(lo+1, Math.ceil(mi/15));
    return 'roughly ' + lo + '–' + hi + ' days on foot';
  }
  function measurePick(pid){
    if(!mA || mB){ mA = pid; mB = null; }
    else if(pid !== mA) mB = pid;
    drawMeasure();
  }
  function drawMeasure(){
    L_.measure.clearLayers();
    if(!measureOn) return;
    const a = byId[mA], b = byId[mB];
    if(!a){
      measurebar.innerHTML = `<span class="mval">Measure</span>
        <span class="mhint">Tap a place on the map, then tap a second one.</span>
        <button id="mclose">Done</button>`;
    } else if(!b){
      measurebar.innerHTML = `<span class="mval">From ${a.name}</span>
        <span class="mhint">Now tap the place you are measuring to.</span>
        <button id="mreset">Restart</button><button id="mclose">Done</button>`;
      L.circleMarker([a.lat,a.lon], {pane:'lines', radius:9, color:'#8c3a2b', weight:2, fill:false, dashArray:'3 3'}).addTo(L_.measure);
    } else {
      const km = haversine(a, b), mi = km * 0.621371, d = fmtDist(km);
      L.polyline([[a.lat,a.lon],[b.lat,b.lon]], {pane:'lines', color:'#8c3a2b', weight:2.4, dashArray:'7 5', opacity:.9}).addTo(L_.measure);
      [a,b].forEach(p => L.circleMarker([p.lat,p.lon], {pane:'lines', radius:6, color:'#8c3a2b', weight:2, fillColor:'#f3e9d4', fillOpacity:1}).addTo(L_.measure));
      const mid = L.latLng((a.lat+b.lat)/2, (a.lon+b.lon)/2);
      L.marker(mid, {pane:'lines', interactive:false, icon:L.divIcon({className:'',
        html:`<div class="mlabel">${d.short}</div>`, iconSize:[0,0]})}).addTo(L_.measure);
      measurebar.innerHTML = `<span class="mval">${a.name} → ${b.name}</span>
        <span><b>${d.long}</b> as the crow flies<br>
        <span class="mhint">${onFoot(mi)} · bearing ${bearingWord(a,b)} · real roads follow the passes and fords, so add roughly a fifth</span></span>
        <button id="mreset">Restart</button><button id="mclose">Done</button>`;
      map.fitBounds(L.latLngBounds([[a.lat,a.lon],[b.lat,b.lon]]).pad(.35), {animate:false, maxZoom:13});
      applyZoomTier();
    }
    const r = measurebar.querySelector('#mreset'), c = measurebar.querySelector('#mclose');
    if(r) r.onclick = () => { mA = mB = null; drawMeasure(); };
    if(c) c.onclick = () => setMeasure(false);
  }

  /* ——— chronology band ———
     The Gospels almost never give a year, so this is narrative sequence by phase,
     not a dated timeline. Saying so is part of the tool. */
  let tlBuilt = false;
  const tlEl = document.getElementById('timeline');
  function buildTimeline(){
    if(tlBuilt) return;
    const phases = [];
    D.EVENTS.forEach(e => {
      let g = phases.find(x => x.n === e.phase);
      if(!g){ g = {n:e.phase, list:[]}; phases.push(g); }
      g.list.push(e);
    });
    tlEl.innerHTML = `<div class="tl-top">
        <div class="tl-t">Chronology — the narrative order of the Gospels and Acts</div>
        <button class="tl-x" id="tl-close" aria-label="Hide the chronology band">×</button>
      </div>
      <div class="tl-band">${phases.map(g => `<div class="tl-ph" style="flex:${g.list.length}">
        <div class="tl-pn">${g.n}</div>
        <div class="tl-ticks">${g.list.map(e =>
          `<button class="tl-k" data-eid="${e.id}" data-pid="${e.place}" title="${esc(e.t)} — ${esc(e.ref)}" aria-label="${esc(e.t)}"></button>`).join('')}</div>
      </div>`).join('')}</div>
      <div class="tl-cap" id="tl-cap">Tap a mark to go there. The Gospels rarely date events, so the band follows narrative sequence, not absolute years.</div>`;
    tlEl.querySelector('#tl-close').onclick = () => setTimelineOn(false);
    const cap = tlEl.querySelector('#tl-cap');
    tlEl.querySelectorAll('.tl-k').forEach(k => k.onclick = () => {
      const e = D.EVENTS.find(x => x.id === k.dataset.eid); if(!e) return;
      tlEl.querySelectorAll('.tl-k').forEach(x => x.classList.remove('on'));
      k.classList.add('on');
      const p = byId[e.place] || {};
      cap.innerHTML = `<b>${e.t}</b> — ${e.ref} · ${p.name || ''} · ${e.phase}. ${e.s}`;
      select(e.place);
    });
    tlBuilt = true;
  }
  function setTimelineOn(on){
    if(on) buildTimeline();
    document.body.classList.toggle('timeline-on', on);
    map.invalidateSize();
    buildToolsMenu();
    say(on ? 'Chronology band shown' : 'Chronology band hidden');
  }

  /* ——— map recall ———
     Labels off, dots on. This is the drill a teacher runs weekly, and the
     reason they keep a map open at all. */
  const QUIZ_SETS = [
    {id:'galilee', n:'Galilee & the lake', f:p => /Galilee|Gaulanitis/.test(p.region)},
    {id:'jerusalem', n:'Jerusalem, within the walls', f:p => p.cat === 'jerusalem' || p.id === 'jerusalem'},
    {id:'judea', n:'Judea, Samaria & the coast', f:p => /Judea|Samaria|Perea|Phoenicia/.test(p.region)},
    {id:'decapolis', n:'The Decapolis & the north', f:p => /Decapolis|Syria|Iturea/.test(p.region)},
    {id:'paul', n:"Paul's world", f:p => MEDREGIONS.has(p.region)},
    {id:'all', n:'The whole atlas', f:() => true}
  ];
  let quiz = null;
  const quizbar = document.getElementById('quizbar');
  function showQuizPicker(){
    detail.innerHTML = `
      <div class="dhead">
        <button class="dclose" title="Close">×</button>
        <div class="cat">Practice</div>
        <h2>Map recall</h2>
        <div class="mod">The names come off the map. You put them back.</div>
      </div>
      <div class="dbody">
        <div class="blurb">Ten places, one at a time, with the labels hidden. Tap the dot you think it is —
          a miss tells you how far off you were and in which direction, and a second miss shows you the answer.</div>
        <div class="sec"><h3>Choose a set</h3>
          <div class="cfmweeks">${QUIZ_SETS.map(s => {
            const n = D.PLACES.filter(s.f).length;
            return `<button class="chip" data-qz="${s.id}" style="white-space:nowrap">${s.n} · ${n}</button>`;
          }).join('')}</div></div>
        <div class="sec"><h3>Why bother</h3>
          <p>Geography is the one part of scripture study that rewards recall directly: once the map is in your head,
          every crossing of the lake, every journey up to Jerusalem, and every road Paul takes carries its own
          argument without a footnote.</p></div>
      </div>`;
    openPanel();
    detail.querySelectorAll('[data-qz]').forEach(b => b.onclick = () => startQuiz(b.dataset.qz));
  }
  function startQuiz(setId){
    const s = QUIZ_SETS.find(x => x.id === setId) || QUIZ_SETS[0];
    const pool = D.PLACES.filter(s.f);
    if(pool.length < 4){ say('Not enough places in that set.'); return; }
    const order = pool.slice().sort(() => Math.random() - .5).slice(0, Math.min(10, pool.length));
    quiz = {set:s, pool, q:order, i:0, score:0, miss:0};
    if(measureOn) setMeasure(false);
    closeDetail(); closeViews(); if(isMobileLayout()) closeDrawer();
    document.body.classList.add('quiz');
    map.fitBounds(L.latLngBounds(pool.map(p => [p.lat, p.lon])).pad(.06), {animate:false});
    applyZoomTier();
    clearQuizMarks();
    paintQuiz();
    buildToolsMenu();
    say('Map recall started. ' + order.length + ' places.');
  }
  function clearQuizMarks(){
    mapEl.querySelectorAll('.pin').forEach(el => el.classList.remove('qright','qwrong','qshow'));
  }
  function paintQuiz(fb, cls){
    if(!quiz) return;
    const t = quiz.q[quiz.i];
    quizbar.innerHTML = `
      <span class="qq">${t ? 'Where is ' + shortName(t) + '?' : 'Done'}</span>
      <span><span class="qs">${quiz.i + 1} of ${quiz.q.length} · score ${quiz.score}</span>
      ${fb ? `<br><span class="qfb ${cls || ''}">${fb}</span>` : ''}</span>
      <button id="qskip">Skip</button><button id="qend">End</button>`;
    quizbar.querySelector('#qskip').onclick = () => revealAndAdvance();
    quizbar.querySelector('#qend').onclick = endQuiz;
  }
  function pinEl(pid){
    const m = placeMarkers[pid], el = m && m.getElement && m.getElement();
    return el ? el.querySelector('.pin') : null;
  }
  function revealAndAdvance(){
    const t = quiz.q[quiz.i];
    const el = pinEl(t.id);
    if(el){ el.classList.add('qshow','qwrong'); }
    setTimeout(() => { clearQuizMarks(); nextQuestion(); }, 1400);
    paintQuiz('The answer was ' + t.name + '.', 'no');
  }
  function nextQuestion(){
    quiz.i++; quiz.miss = 0;
    if(quiz.i >= quiz.q.length) return finishQuiz();
    paintQuiz();
  }
  function quizAnswer(pid){
    const t = quiz.q[quiz.i];
    if(!t) return;
    if(pid === t.id){
      quiz.score++;
      const el = pinEl(pid); if(el) el.classList.add('qright','qshow');
      paintQuiz('Right — ' + t.name + '.', 'ok');
      setTimeout(() => { clearQuizMarks(); nextQuestion(); }, 900);
      return;
    }
    quiz.miss++;
    const hit = byId[pid];
    const km = haversine(hit, t);
    const el = pinEl(pid); if(el) el.classList.add('qwrong');
    setTimeout(() => { const e2 = pinEl(pid); if(e2) e2.classList.remove('qwrong'); }, 900);
    if(quiz.miss >= 2) return revealAndAdvance();
    paintQuiz(`That is ${shortName(hit)} — ${shortName(t)} is ${fmtGap(km)} ${bearingWord(hit, t)} of it. One more try.`, 'no');
  }
  function finishQuiz(){
    const pct = Math.round(quiz.score / quiz.q.length * 100);
    const verdict = pct >= 90 ? 'You know this map.' : pct >= 70 ? 'Solid — the gaps are worth a second pass.'
      : pct >= 40 ? 'Worth running again; the map rewards repetition.' : 'Start with one region rather than the whole atlas.';
    const set = quiz.set;
    detail.innerHTML = `
      <div class="dhead">
        <button class="dclose" title="Close">×</button>
        <div class="cat">Practice</div>
        <h2>${quiz.score} of ${quiz.q.length}</h2>
        <div class="mod">${set.n} · ${verdict}</div>
      </div>
      <div class="dbody">
        <div class="sec"><h3>Run it again</h3>
          <div class="cfmweeks">${QUIZ_SETS.map(s => `<button class="chip" data-qz="${s.id}">${s.n}</button>`).join('')}</div></div>
      </div>`;
    endQuiz(true);
    openPanel();
    detail.querySelectorAll('[data-qz]').forEach(b => b.onclick = () => startQuiz(b.dataset.qz));
  }
  function endQuiz(keepPanel){
    quiz = null;
    document.body.classList.remove('quiz');
    clearQuizMarks();
    if(!keepPanel) closeDetail();
    buildToolsMenu();
    declutterLabels();
    say('Map recall ended.');
  }

  /* ——— save the view as an image ———
     Composites the tiles, the vector panes and the labels onto a canvas, with the
     credit strip printed in, so a teacher can drop the view into a slide. */
  function wrapCanvasText(ctx, text, font, maxWidth){
    ctx.font = font;
    const words = text.split(' ');
    const lines = []; let cur = '';
    for(const w of words){
      const test = cur ? cur + ' ' + w : w;
      if(ctx.measureText(test).width > maxWidth && cur){ lines.push(cur); cur = w; }
      else cur = test;
    }
    if(cur) lines.push(cur);
    return lines;
  }

  async function exportImage(){
    const size = map.getSize();
    const measure = document.createElement('canvas').getContext('2d');
    const padX = 12, padTop = 10, lineGap = 3, maxTextW = size.x - padX * 2;
    const creditLines = [
      { font: "500 12px Spectral, Georgia, serif", h: 14, color: '#241c14',
        text: 'New Testament Atlas — created, written and owned by Taylor Halverson, PhD (beta)' },
      { font: "9px Spectral, Georgia, serif", h: 11, color: '#6b5c46',
        text: '© ' + new Date().getFullYear() + ' Taylor Halverson · insights.taylorhalverson.com · ' + BASEMAP.credit },
      { font: "9px Spectral, Georgia, serif", h: 11, color: '#6b5c46',
        text: 'OpenTopoMap portion licensed CC BY-SA 3.0 — reuse of that portion remains under CC BY-SA · creativecommons.org/licenses/by-sa/3.0' }
    ];
    const wrapped = creditLines.map(l => ({ ...l, lines: wrapCanvasText(measure, l.text, l.font, maxTextW) }));
    const totalLines = wrapped.reduce((n, l) => n + l.lines.length, 0);
    const strip = padTop * 2 + wrapped.reduce((h, l) => h + l.lines.length * (l.h + lineGap), 0);
    const scale = Math.min(2, window.devicePixelRatio || 1);
    const cv = document.createElement('canvas');
    cv.width = Math.round(size.x * scale); cv.height = Math.round((size.y + strip) * scale);
    const ctx = cv.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#e2d5b6'; ctx.fillRect(0, 0, size.x, size.y + strip);
    const box = mapEl.getBoundingClientRect();
    const at = el => { const r = el.getBoundingClientRect(); return {x:r.left - box.left, y:r.top - box.top, w:r.width, h:r.height}; };

    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, size.x, size.y); ctx.clip();
    if(parchment) ctx.filter = 'sepia(.4) saturate(.7) contrast(.95) brightness(1.08) blur(.5px) hue-rotate(-6deg)';
    mapEl.querySelectorAll('img.leaflet-tile-loaded').forEach(img => {
      const r = at(img);
      try{ ctx.drawImage(img, r.x, r.y, r.w, r.h); }catch(e){}
    });
    ctx.filter = 'none';
    if(parchment){
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = 'rgba(190,168,126,.26)';
      ctx.fillRect(0, 0, size.x, size.y);
      ctx.globalCompositeOperation = 'source-over';
    }
    /* the vector panes carry their own viewBox, so they scale correctly as images */
    for(const svg of mapEl.querySelectorAll('svg.leaflet-zoom-animated')){
      const r = at(svg);
      if(!r.w || !r.h) continue;
      const clone = svg.cloneNode(true);
      clone.setAttribute('width', r.w); clone.setAttribute('height', r.h);
      const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
      await new Promise(res => {
        const im = new Image();
        im.onload = () => { try{ ctx.drawImage(im, r.x, r.y, r.w, r.h); }catch(e){} res(); };
        im.onerror = res; im.src = url;
      });
    }
    /* region names, then the pins and their labels */
    mapEl.querySelectorAll('.rlabel').forEach(el => {
      const cs = getComputedStyle(el);
      if(cs.display === 'none') return;
      const r = at(el);
      ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      ctx.textBaseline = 'top'; ctx.fillStyle = cs.color; ctx.globalAlpha = +cs.opacity || 1;
      ctx.fillText(el.textContent, r.x, r.y);
      ctx.globalAlpha = 1;
    });
    mapEl.querySelectorAll('.pin').forEach(pin => {
      const pcs = getComputedStyle(pin);
      if(+pcs.opacity < .25) return;
      const dot = pin.querySelector('i'), lbl = pin.querySelector('b');
      if(dot){
        const d = at(dot), dcs = getComputedStyle(dot);
        const cx = d.x + d.w/2, cy = d.y + d.h/2;
        if(cx > -30 && cy > -30 && cx < size.x + 30 && cy < size.y + 30){
          ctx.beginPath(); ctx.arc(cx, cy, Math.max(2, d.w/2), 0, Math.PI*2);
          ctx.fillStyle = dcs.backgroundColor; ctx.fill();
          ctx.lineWidth = 1.4; ctx.strokeStyle = '#fdf9ef'; ctx.stroke();
        }
      }
      if(lbl && getComputedStyle(lbl).display !== 'none'){
        const l = at(lbl), lcs = getComputedStyle(lbl);
        ctx.font = `${lcs.fontStyle} ${lcs.fontWeight} ${lcs.fontSize} ${lcs.fontFamily}`;
        ctx.textBaseline = 'top';
        ctx.lineWidth = 3.5; ctx.strokeStyle = '#f3e9d4';
        ctx.strokeText(lbl.textContent, l.x, l.y);
        ctx.fillStyle = lcs.color;
        ctx.fillText(lbl.textContent, l.x, l.y);
      }
    });
    ctx.restore();

    ctx.fillStyle = '#f3e9d4'; ctx.fillRect(0, size.y, size.x, strip);
    ctx.textBaseline = 'top';
    let ly = size.y + padTop;
    for(const l of wrapped){
      ctx.font = l.font; ctx.fillStyle = l.color;
      for(const line of l.lines){ ctx.fillText(line, padX, ly); ly += l.h + lineGap; }
    }

    try{
      await new Promise((res, rej) => cv.toBlob(b => {
        if(!b) return rej(new Error('no blob'));
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'nt-atlas-' + (selected || 'view') + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        res();
      }, 'image/png'));
      say('Image saved.');
    }catch(e){
      say('This browser would not release the image.');
      alert('This browser blocked saving the map as an image (the tile server refused a cross-origin read). ' +
        'Use Print instead, or take a screenshot.');
    }
  }

  /* ——— study tools menu ——— */
  const toolsBtn = document.getElementById('btn-tools');
  const mbTools = document.getElementById('mb-tools');
  const toolsMenu = document.getElementById('toolsmenu');
  let toolsAnchor = toolsBtn;
  function buildToolsMenu(){
    const item = (id, label, sub, on) =>
      `<button data-t="${id}"${on ? ' class="on"' : ''} role="menuitem">${label}<span class="ts">${sub}</span></button>`;
    toolsMenu.innerHTML =
      '<div class="tmsec">Measure &amp; practise</div>' +
      item('measure', measureOn ? 'Measuring — tap two places' : 'Measure distance', 'Straight-line miles and the days on foot (M)', measureOn) +
      item('quiz', 'Map recall', 'Labels off — put the names back (Q)', !!quiz) +
      '<div class="tmsec">See it differently</div>' +
      item('present', document.body.classList.contains('present') ? 'Presenter mode on' : 'Presenter mode',
        'Room-sized type and heavier routes (P)', document.body.classList.contains('present')) +
      item('base', parchment ? 'Switch to the modern map' : 'Switch to parchment',
        parchment ? 'Drop the tint and the grain' : 'Tint the modern map as parchment') +
      item('timeline', document.body.classList.contains('timeline-on') ? 'Hide the chronology band' : 'Chronology band',
        'Every event in narrative order (T)', document.body.classList.contains('timeline-on')) +
      item('profiles', 'Elevation profiles', 'What “going up to Jerusalem” actually cost') +
      '<div class="tmsec">Take it with you</div>' +
      item('image', 'Save this view as an image', 'A PNG with the credit printed in') +
      item('packet', packMode ? 'Finish the study packet' : 'Build a study packet',
        'Several places, printed as one handout', packMode) +
      item('saved', 'Saved places & notes', stars.size ? stars.size + ' saved · your notes print on the sheet' : 'Nothing saved yet') +
      '<div class="tmsec">This atlas</div>' +
      item('about', 'About &amp; sources', 'Who made it, what it rests on') +
      item('licences', 'Licences &amp; attribution', 'Every third-party part, and its terms') +
      item('aboutpage', 'About this project', 'The overview page') +
      item('feedback', 'Report an error', 'Corrections are the point of a beta');
    toolsMenu.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { closeTools(); runTool(b.dataset.t); });
  }
  function openTools(anchor){
    toolsAnchor = anchor || toolsBtn;
    buildToolsMenu();
    closeViews();
    const inBar = toolsAnchor === mbTools;
    const r = toolsAnchor.getBoundingClientRect();
    const gap = 6, edge = 12;
    toolsMenu.style.right = inBar ? '8px' : Math.max(8, window.innerWidth - r.right) + 'px';
    /* measure, then clamp: below the anchor if it fits, otherwise above it, and
       scrolling inside either way — the feedback path must always be reachable */
    toolsMenu.style.maxHeight = 'none';
    toolsMenu.style.top = (r.bottom + gap) + 'px';
    toolsMenu.classList.add('open');
    const h = toolsMenu.scrollHeight;
    const below = window.innerHeight - r.bottom - gap - edge;
    const above = r.top - gap - edge;
    if(h > below && above > below){
      toolsMenu.style.top = Math.max(edge, r.top - gap - Math.min(h, above)) + 'px';
      toolsMenu.style.maxHeight = Math.min(h, above) + 'px';
    } else {
      toolsMenu.style.maxHeight = Math.max(140, below) + 'px';
    }
    toolsBtn.setAttribute('aria-expanded', String(!inBar));
    mbTools.setAttribute('aria-expanded', String(inBar));
    mbTools.classList.toggle('on', inBar);
  }
  function closeTools(){
    toolsMenu.classList.remove('open');
    toolsBtn.setAttribute('aria-expanded', 'false');
    mbTools.setAttribute('aria-expanded', 'false');
    mbTools.classList.remove('on');
  }
  toolsBtn.onclick = e => { e.stopPropagation(); toolsMenu.classList.contains('open') ? closeTools() : openTools(toolsBtn); };
  mbTools.onclick = e => { e.stopPropagation(); toolsMenu.classList.contains('open') ? closeTools() : openTools(mbTools); };
  document.addEventListener('click', e => {
    if(!toolsMenu.classList.contains('open')) return;
    if(toolsMenu.contains(e.target) || e.target === toolsBtn || e.target === mbTools) return;
    closeTools();
  });
  function runTool(t){
    if(t === 'measure') return setMeasure(!measureOn);
    if(t === 'timeline') return setTimelineOn(!document.body.classList.contains('timeline-on'));
    if(t === 'quiz') return quiz ? endQuiz() : showQuizPicker();
    if(t === 'profiles') return showProfiles();
    if(t === 'image') return exportImage();
    if(t === 'about') return showAbout();
    if(t === 'licences') return showLicences();
    if(t === 'aboutpage'){ location.href = 'about.html'; return; }
    if(t === 'present'){ setPresent(!document.body.classList.contains('present')); return; }
    if(t === 'base'){ setBase(!parchment); syncBaseButtons(); buildToolsMenu(); return; }
    if(t === 'feedback') return showFeedback();
    if(t === 'saved'){
      setTab('places'); packMode = false; render();
      if(isMobileLayout()) openDrawer();
      say(stars.size + ' saved places');
      return;
    }
    if(t === 'packet'){
      packMode = !packMode;
      setTab('places'); render();
      if(packMode && isMobileLayout()) openDrawer();
      say(packMode ? 'Packet mode on. Tap places to add them.' : 'Packet mode off.');
      return;
    }
  }

  /* ——— report an error ——— */
  const FEEDBACK_EMAIL = 'insights@taylorhalverson.com';
  function showFeedback(){
    const ctx = selected && byId[selected] ? byId[selected].name : 'the atlas';
    const body = encodeURIComponent('Where: ' + ctx + '\nLink: ' + location.href +
      '\n\nWhat looks wrong:\n\n\nWhat it should say (and where that comes from):\n\n');
    detail.innerHTML = `
      <div class="dhead">
        <button class="dclose" title="Close">×</button>
        <div class="cat">Beta</div>
        <h2>Report an error</h2>
        <div class="mod">The first hundred readers will find things no audit would.</div>
      </div>
      <div class="dbody">
        <div class="blurb">This atlas makes specific claims about specific places. If one of them is wrong —
          a coordinate, a date, a reading of an excavation, a scripture reference — that is worth more than a compliment.</div>
        <div class="sec"><h3>What helps most</h3>
          <p>Name the place, quote the line, and say what it should say. If the correction rests on a
            publication, name it: the sources list in every panel is there so a claim can be argued.</p></div>
        <div class="sec"><h3>Send it</h3>
          <div class="cfmweeks">
            ${FEEDBACK_EMAIL ? `<a class="chip" style="text-decoration:none" href="mailto:${FEEDBACK_EMAIL}?subject=${encodeURIComponent('NT Atlas beta — correction: ' + ctx)}&body=${body}">Email the correction</a>` : ''}
            <a class="chip" style="text-decoration:none" href="https://insights.taylorhalverson.com" target="_blank" rel="noopener">insights.taylorhalverson.com</a>
            <button class="chip" id="fblink">Copy the link to this view</button>
          </div>
          <p class="srccav">A link carries your place, your layers and your lesson week, so a correction can be
            reproduced exactly as you saw it.</p></div>
      </div>`;
    openPanel();
    const c = detail.querySelector('#fblink');
    if(c) c.onclick = e => copyLink(e.currentTarget);
  }

  /* ——— keyboard shortcuts for the tools ——— */
  document.addEventListener('keydown', e => {
    const t = e.target;
    if(t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if(k === 'm'){ e.preventDefault(); setMeasure(!measureOn); }
    else if(k === 't'){ e.preventDefault(); setTimelineOn(!document.body.classList.contains('timeline-on')); }
    else if(k === 'q'){ e.preventDefault(); quiz ? endQuiz() : showQuizPicker(); }
    else if(k === 's' && selected){ e.preventDefault(); toggleStar(selected);
      paintStar(detail.querySelector('#dstar'), selected); render();
      say(stars.has(selected) ? 'Saved' : 'Removed from saved'); }
    else if(e.key === 'Escape'){
      if(toolsMenu.classList.contains('open')) return closeTools();
      if(quiz) return endQuiz();
      if(measureOn) return setMeasure(false);
      if(packMode){ packMode = false; render(); return; }
    }
  });

  /* ——— offline ———
     Meetinghouses and tour buses have bad wifi. Registered only over http(s);
     opened straight off disk there is nothing to register against. */
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  /* ——— boot ——— */
  LAYERS.forEach(l => { if(l.id) applyLayer(l.id, !!l.on); });
  map.invalidateSize();
  map.setView(VIEWS.whole.c, VIEWS.whole.z, {animate:false});
  applyZoomTier();
  document.querySelector('[data-view="whole"]').classList.add('on');
  render(); updateLegend(); buildToolsMenu();

  let restored = null;
  try{ restored = localStorage.getItem('ntatlas.sel'); }catch(e){}
  /* the restore is the first thing a returning reader sees, and it would otherwise
     run before the grid is laid out — wait for a measured canvas before flying.
     Belt and braces: whichever of the two hooks fires first wins, once. */
  let bootDone = false;
  function bootRestore(){
    if(bootDone) return;
    map.invalidateSize({animate:false});
    const s = map.getSize();
    if(!s.x || !s.y) return;   /* relayout() will call again when the container gains a size */
    bootDone = true;
    if(!readHash() && restored && byId[restored]) select(restored);
    declutterLabels();
  }
  bootHooked = true;
  requestAnimationFrame(() => requestAnimationFrame(bootRestore));
  window.addEventListener('load', bootRestore);
  setTimeout(bootRestore, 400);
  setTimeout(bootRestore, 1200);
  setTimeout(bootRestore, 3000);
  window.addEventListener('hashchange', () => { if(!hashLock) readHash(); });

  /* a tab that boots hidden never gets a measured container; re-measure when it
     becomes visible and put the selected place back in the middle */
  document.addEventListener('visibilitychange', () => {
    if(document.hidden) return;
    map.invalidateSize();
    const p = selected && byId[selected];
    if(p) goToPoint([p.lat, p.lon], map.getZoom());
    declutterLabels();
  });

  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    if(viewsheet.classList.contains('open')) return closeViews();
    if(aside.classList.contains('open') && isMobileLayout()) return closeDrawer();
    closeDetail();
  });
})();
</script>
</body>
</html>
