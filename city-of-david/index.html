document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0.9);\n    --s2: rgba(250,247,241,0.9);\n    --s3: rgba(247,244,236,0.95);\n    --s4: rgba(60,48,30,0.07);\n    --s5: rgba(60,48,30,0.08);\n    --s6: rgba(60,48,30,0.05);\n    --s7: rgba(90,80,62,0.13);\n    --s8: rgba(62,52,34,0.10);\n    --s9: rgba(0,0,0,0.16);\n    --s10: rgba(0,0,0,0.2);\n  }\n  html, body { margin: 0; padding: 0; background: var(--c0d0b09, #0d0b09); }\n  * { box-sizing: border-box; }\n  a { color: var(--cc88a3c, #c88a3c); text-decoration: none; border-bottom: 1px solid rgba(200,138,60,0.35); }\n  a:hover { color: var(--ce0a75c, #e0a75c); border-bottom-color: rgba(224,167,92,0.7); }\n  ::-webkit-scrollbar { width: 9px; height: 9px; }\n  ::-webkit-scrollbar-track { background: var(--c0d0b09, #0d0b09); }\n  ::-webkit-scrollbar-thumb { background: var(--c322b22, #322b22); border-radius: 5px; }\n  ::-webkit-scrollbar-thumb:hover { background: var(--c4a4034, #4a4034); }\n  input[type=range].cod { -webkit-appearance: none; appearance: none; background: transparent; }\n  input[type=range].cod::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 30px; border-radius: 3px; background: var(--cf0e7d5, #f0e7d5); border: 1px solid var(--c0d0b09, #0d0b09); box-shadow: 0 0 0 1px var(--s9, rgba(0,0,0,0.6)), 0 3px 10px var(--s10, rgba(0,0,0,0.7)); cursor: grab; margin-top: -8px; }\n  input[type=range].cod::-webkit-slider-thumb:active { cursor: grabbing; background: var(--cfdf6e6, #fdf6e6); }\n  input[type=range].cod::-webkit-slider-runnable-track { height: 14px; background: transparent; }\n  input[type=range].cod::-moz-range-thumb { width: 13px; height: 28px; border-radius: 3px; background: var(--cf0e7d5, #f0e7d5); border: 1px solid var(--c0d0b09, #0d0b09); cursor: grab; }\n  input[type=range].codsm::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--cc8b99c, #c8b99c); border: none; margin-top: -4px; cursor: pointer; }\n  input[type=range].codsm::-webkit-slider-runnable-track { height: 4px; background: var(--c2e2820, #2e2820); border-radius: 2px; }\n  input[type=range].codsm { -webkit-appearance: none; appearance: none; background: transparent; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"{{ shellStyle }}\">\n\n  <header style=\"{{ headerStyle }}\">\n    <div style=\"flex: 0 0 auto; min-width: 0; display: flex; align-items: baseline; gap: 18px;\">\n      <h1 style=\"flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0; font-family: 'EB Garamond', serif; font-weight: 500; font-size: 21px; letter-spacing: 0.02em; color: var(--cf0e7d5, #f0e7d5);\">The City of David<\u002Fh1>\n      <span style=\"flex: none; align-self: center; padding: 3px 7px 2px; border: 1px solid rgba(200,138,60,0.55); border-radius: 3px; background: rgba(200,138,60,0.12); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cd9a662, #d9a662);\">Beta<\u002Fspan>\n      <p style=\"{{ headSubStyle }}\">Southeastern ridge of Jerusalem · Gihon Spring to the Pool of Siloam · c. 4500 BC – today<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 14px;\">\n      <div style=\"{{ headPhaseStyle }}\">\n        <span style=\"width: 9px; height: 9px; border-radius: 50%; background: {{ activeColor }}; flex: none;\"><\u002Fspan>\n        <span style=\"{{ headPhaseNameStyle }}\">{{ activeName }}<\u002Fspan>\n        <span style=\"{{ headPhaseYearStyle }}\">{{ activeSpan }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"{{ paneToggleWrap }}\">\n        <sc-for list=\"{{ paneToggles }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ p.click }}\" title=\"{{ p.title }}\" style=\"{{ p.style }}\">{{ p.n }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ toggleTheme }}\" title=\"Switch between the dark and the light scheme\" style=\"{{ themeBtn }}\">{{ themeLabel }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ toggleHelp }}\" style=\"{{ helpBtn }}\">About<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div ref=\"{{ helpRef }}\" role=\"dialog\" aria-modal=\"true\" aria-label=\"About this project\" sc-camel-tab-index=\"-1\" style=\"{{ helpStyle }}\">\n    <div style=\"max-width: 760px; margin: 0 auto; padding: 30px 34px 48px;\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--c2a241d, #2a241d);\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n          <button sc-camel-on-click=\"{{ goRead }}\" style=\"{{ tabReadBtn }}\">How to read this<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goModel }}\" style=\"{{ tabModelBtn }}\">The model<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goAuthor }}\" style=\"{{ tabAuthorBtn }}\">Taylor Halverson, Ph.D.<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goAttrib }}\" style=\"{{ tabAttribBtn }}\">Credits<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goLegal }}\" style=\"{{ tabLegalBtn }}\">Terms &amp; License<\u002Fbutton>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleHelp }}\" style=\"{{ helpBtn }}\">Close<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"{{ paneRead }}\">\n      <h2 style=\"margin: 26px 0 0; font-family: 'EB Garamond', serif; font-weight: 400; font-size: 27px; color: var(--cf4ecdb, #f4ecdb);\">How to read this<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px 34px; margin-top: 22px;\">\n        <div>\n          <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">Colour = era<\u002Fp>\n          <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1);\">The base map is deliberately grey. Colour belongs to time: each of the five eras has its own hue, and the phases inside an era are shades of it. The blue thread — spring, tunnel, pool — is drawn in every phase, because the water is the one thing that never changed.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">Line = how sure we are<\u002Fp>\n          <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1);\">Solid means excavated and not seriously disputed. Long dashes mean the line is partly reconstructed between excavated points. Short dashes mean scholars disagree about its date or identification. Dotted means it is drawn only to help you read the map. Hatching marks destruction and collapse.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">Four ways to look<\u002Fp>\n          <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1);\">Plan looks straight down and numbers each element to the list on the right. Section cuts straight across the ridge at a station you choose, so you can see how far the spring sits below the crest. Elevation is the honest one: the whole ridge across the top, and a true-scale window below it that you move by clicking the strip. 3D lets you orbit the landform.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">Moving around<\u002Fp>\n          <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1);\">Drag the timeline, or press the left and right arrow keys to step one phase at a time. The sentence under the slider says what changed. Everything an expert might want — opacities, height exaggeration, x-ray, satellite alignment — sits behind Expert controls in the left column.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 26px 0 0; padding-top: 16px; border-top: 1px solid var(--c2a241d, #2a241d); font-size: 11.5px; line-height: 1.6; color: var(--c9c9082, #9c9082);\">This is a reading of published excavation, not a photograph of the past. Where the evidence is contested — the date of the Stepped Stone Structure, the Large Stone Structure as a Davidic palace, Nehemiah's wall, the Seleucid Akra — the disagreement is shown rather than resolved, and the essay for each phase sets out both sides.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"{{ paneModel }}\">\n        <h2 style=\"margin: 26px 0 0; font-family: 'EB Garamond', serif; font-weight: 400; font-size: 27px; color: var(--cf4ecdb, #f4ecdb);\">The City of David<\u002Fh2>\n        <p style=\"margin: 8px 0 0; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c9c9082, #9c9082);\">Prepared by Taylor Halverson, Ph.D. · Beta<\u002Fp>\n        <p style=\"margin: 20px 0 0; font-family: 'EB Garamond', serif; font-size: 16.5px; line-height: 1.65; color: var(--cd5cab7, #d5cab7); text-wrap: pretty;\">Thirteen phases of the southeastern ridge of Jerusalem, from the first spring-side settlement to the archaeological park standing there now, drawn on one fixed footprint so that every period can be laid over every other. Each phase carries the same four views — plan, section, elevation, 3D — and an essay setting out what was found, who found it, and what remains argued.<\u002Fp>\n\n        <div style=\"margin: 24px 0 0; padding: 14px 16px; border: 1px solid rgba(200,138,60,0.35); border-radius: 4px; background: rgba(200,138,60,0.07);\">\n          <p style=\"margin: 0 0 6px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cd9a662, #d9a662);\">Beta<\u002Fp>\n          <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">Phase dates, structure footprints and the identification of individual buildings are the least settled parts of this reconstruction. Where the published evidence is itself unsettled, the drawing says so through its line weight rather than quietly choosing a side.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px 34px; margin-top: 26px;\">\n          <div>\n            <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">On the terrain<\u002Fp>\n            <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">The landform is built from measured points: the Gihon Spring at 636 m, the Pool of Siloam at 635.7 m, the ridge crest falling from about 725 m at the north to 624 m at the south end. Hezekiah's Tunnel drops roughly 30 cm over its 533 m, and the model holds that. Slopes between those anchors are reasoned, not surveyed.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">On vertical exaggeration<\u002Fp>\n            <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">The ridge is genuinely subtle, so the 3D view exaggerates height — ×1.6 by default — to make it legible. The factor is stated on screen at all times and the slider will return it to true 1:1. Plan distances are never exaggerated.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">Sources<\u002Fp>\n            <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">Published excavation from Warren, Parker and Vincent, Weill, Macalister, Kenyon, Shiloh, Avigad, Reich and Shukron, Mazar, and the current Givati Parking Lot and Pilgrimage Road work; elevations from published spot heights; gradients from the tunnel surveys. The full list, and who is responsible for the confidence tags, is under Credits.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">Scripture text<\u002Fp>\n            <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">Scripture quotations are from the American Standard Version (ASV, 1901), a public-domain translation — no permission from a Bible publisher is needed. The commentary beside each reference is the author's own, and the identification of a verse with a feature on the ground is an argument, not a fact — 2 Samuel 5:8 and the Spring Tower being the clearest case.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">The flanks are modelled<\u002Fp>\n            <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">The Kidron and Tyropoeon valley sides are interpolated between a few published spot heights. The crest line and the water system are reliable; the flanks are an informed sketch, and the cross-ridge cut is a reconstruction rather than a measured section.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">Your own imagery<\u002Fp>\n            <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">A satellite photograph from your own device can be loaded into the plan view and aligned to the ridge with scale, rotation, stretch and pan. It is held on this device.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin: 26px 0 0; padding-top: 16px; border-top: 1px solid var(--c2a241d, #2a241d); font-size: 11.5px; line-height: 1.6; color: var(--c9c9082, #9c9082);\">Corrections are welcome — particularly measured elevations for the eastern and western flanks, which are the weakest part of the landform.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"{{ paneAttrib }}\">\n        <h2 style=\"margin: 26px 0 0; font-family: 'EB Garamond', serif; font-weight: 400; font-size: 27px; color: var(--cf4ecdb, #f4ecdb);\">Credits<\u002Fh2>\n        <p style=\"margin: 8px 0 0; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c9c9082, #9c9082);\">Sources, attributions and terms<\u002Fp>\n        <p style=\"margin: 18px 0 0; font-family: 'EB Garamond', serif; font-size: 16.5px; line-height: 1.62; color: var(--cd5cab7, #d5cab7); max-width: 680px; text-wrap: pretty;\">These drawings are a reading of published excavation. This page records who found and published the material they rest on, which parts of the landform are measured and which are modelled, and the terms of use.<\u002Fp>\n\n        <sc-for list=\"{{ attribGroups }}\" as=\"g\" hint-placeholder-count=\"7\">\n          <div style=\"margin-top: 34px;\">\n            <h3 style=\"margin: 0; font-family: 'EB Garamond', serif; font-weight: 400; font-size: 21px; line-height: 1.25; color: var(--cf4ecdb, #f4ecdb);\">{{ g.h }}<\u002Fh3>\n            <p style=\"{{ g.noteStyle }}\">{{ g.note }}<\u002Fp>\n            <div style=\"display: flex; flex-direction: column; gap: 12px; margin-top: 15px;\">\n              <sc-for list=\"{{ g.items }}\" as=\"i\" hint-placeholder-count=\"5\">\n                <div style=\"{{ i.row }}\">\n                  <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 13px;\">\n                    <span style=\"font-family: 'EB Garamond', serif; font-size: 16.5px; line-height: 1.2; color: var(--cf0e7d5, #f0e7d5);\">{{ i.w }}<\u002Fspan>\n                    <span style=\"{{ i.yStyle }}\">{{ i.y }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <p style=\"margin: 7px 0 0; font-family: 'EB Garamond', serif; font-size: 14.5px; line-height: 1.5; color: var(--cd5cab7, #d5cab7); text-wrap: pretty;\">{{ i.t }}<\u002Fp>\n                  <p style=\"margin: 6px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--c8a7f6d, #8a7f6d); text-wrap: pretty;\">{{ i.f }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <p style=\"margin: 30px 0 0; padding-top: 16px; border-top: 1px solid var(--c2a241d, #2a241d); font-size: 11.5px; line-height: 1.6; color: var(--c9c9082, #9c9082);\">Scripture is quoted from the American Standard Version (ASV, 1901), public domain. Project Created by Taylor Halverson, Ph.D. (Beta mode)<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"{{ paneLegal }}\">\n        <h2 style=\"margin: 26px 0 0; font-family: 'EB Garamond', serif; font-weight: 400; font-size: 27px; color: var(--cf4ecdb, #f4ecdb);\">Terms of Use, Refund Policy &amp; License<\u002Fh2>\n        <p style=\"margin: 8px 0 0; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c9c9082, #9c9082);\">City of David — an interactive atlas<\u002Fp>\n\n        <div style=\"margin-top: 26px; max-width: 680px; display: flex; flex-direction: column; gap: 22px;\">\n          <div>\n            <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">1. What you're getting<\u002Fp>\n            <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">This product is a Beta: an interactive model of the City of David's building phases, with accompanying essays and reference material, published by Taylor Halverson, Ph.D. (\"Publisher\"). It is a teaching aid and reconstruction, not a survey document — see the \"How to read this\" and \"The model\" tabs for what that means.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">2. License to use<\u002Fp>\n            <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">Publisher grants the purchaser or recipient a personal, non-exclusive, non-transferable license to view and use this product for personal study, teaching, and classroom use. Redistribution of the product file itself, or extraction of its model, essays, or illustrations for republication, requires Publisher's prior written permission. Third-party components (typefaces, code libraries) remain under their own licenses — see the Credits tab and THIRD_PARTY_NOTICES.md.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">3. Scripture text<\u002Fp>\n            <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">Scripture quotations are from the American Standard Version (1901), a translation whose U.S. copyright has expired. Its public-domain status is claimed for the United States only and has not been separately verified for every distribution territory.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">4. Refunds<\u002Fp>\n            <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">If this product was purchased through a store or platform, that platform's refund policy governs first. Where Publisher sells directly, a full refund is available on request within 14 days of purchase, provided the product has not been redistributed; request a refund via the contact below.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">5. No warranty of scholarly conclusion<\u002Fp>\n            <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">Because this is a Beta reconstruction of a disputed archaeological site, Publisher makes no warranty that any specific dating, identification, or interpretation shown will not be revised in a later edition. The product is provided \"as is\" for its stated teaching purpose.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">6. Limitation of liability<\u002Fp>\n            <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">To the extent permitted by law, Publisher's liability for any claim arising from this product is limited to the amount paid for it.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">7. Governing law &amp; contact<\u002Fp>\n            <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.6; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">Contact for licensing, refunds, or rights questions: insights.taylorhalverson.com. The user agrees that any legal action, dispute, or proceeding arising out of or relating to this product must be brought exclusively in the state or federal courts located in Utah County, Utah. Both parties irrevocably consent to the personal jurisdiction of these courts and waive any objection based on improper venue or inconvenient forum.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"{{ paneAuthor }}\">\n        <h2 style=\"margin: 26px 0 0; font-family: 'EB Garamond', serif; font-weight: 400; font-size: 27px; color: var(--cf4ecdb, #f4ecdb);\">Taylor Halverson, Ph.D.<\u002Fh2>\n        <p style=\"margin: 8px 0 0; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c9c9082, #9c9082);\">Author · Teacher · Tour leader · Scripture scholar<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 15px; margin-top: 20px; max-width: 620px;\">\n          <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 16.5px; line-height: 1.65; color: var(--cd5cab7, #d5cab7); text-wrap: pretty;\">Taylor Halverson is a scholar of scripture and a teacher of learners — an entrepreneurship professor in the BYU Marriott School of Business who spends his working life helping people find and act on the best ideas and tools available to them.<\u002Fp>\n          <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 16.5px; line-height: 1.65; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">He is the author and editor of more than fifty books and nearly a thousand articles and blog posts, and a builder of scripture study resources: the ScripturePlus app with Scripture Central, whose scripture YouTube channel he co-hosted to more than fifty million views, and BYU's Virtual Scripture Group, whose team spent more than five years reconstructing New Testament Jerusalem in three dimensions. This visualization of the City of David belongs to that same body of work — tools made so that ordinary readers can see what specialists see.<\u002Fp>\n          <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 16.5px; line-height: 1.65; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">He leads tours to Israel and the Middle East, China, India, Central America, Europe, and the national parks of the American West, where he unfolds how geology, geography, civilization, and scriptural texts created our beautiful present day.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px 34px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--c2a241d, #2a241d);\">\n          <div>\n            <p style=\"margin: 0 0 9px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">Academic training<\u002Fp>\n            <div style=\"display: flex; flex-direction: column; gap: 6px; font-family: 'EB Garamond', serif; font-size: 14.5px; line-height: 1.45; color: var(--ccec4b1, #cec4b1);\">\n              <span>Ph.D., Judaism &amp; Christianity in Antiquity — Indiana University<\u002Fspan>\n              <span>Ph.D., Instructional Systems Technology — Indiana University<\u002Fspan>\n              <span>M.A., Biblical Studies — Yale University<\u002Fspan>\n              <span>B.A., Ancient Near Eastern Studies — Brigham Young University<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin: 12px 0 0; font-size: 11.5px; line-height: 1.6; color: var(--c9c9082, #9c9082); text-wrap: pretty;\">Two doctorates in two separate fields — the ancient world, and the design of learning. Both of them are in this tool.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin: 0 0 9px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">Elsewhere<\u002Fp>\n            <div style=\"display: flex; flex-direction: column; gap: 7px; font-size: 13px;\">\n              <a href=\"https://insights.taylorhalverson.com\" target=\"_blank\" rel=\"noopener\">insights.taylorhalverson.com<\u002Fa>\n              <a href=\"https://books.taylorhalverson.com\" target=\"_blank\" rel=\"noopener\">books.taylorhalverson.com<\u002Fa>\n              <a href=\"https://exodustours.com\" target=\"_blank\" rel=\"noopener\">exodustours.com<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <aside style=\"{{ asideStyle }}\">\n    <button sc-camel-on-click=\"{{ closeUI }}\" style=\"{{ sheetCloseStyle }}\">Close<\u002Fbutton>\n\n    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--c171410, #171410); border: 1px solid var(--c2a241d, #2a241d); border-radius: 4px;\">\n      <button sc-camel-on-click=\"{{ setPlan }}\" style=\"{{ planBtn }}\">Plan<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ setSection }}\" style=\"{{ sectionBtn }}\">Section<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ setElev }}\" style=\"{{ elevBtn }}\">Elevation · walk the ridge<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ set3d }}\" style=\"{{ d3Btn }}\">3D · orbit the ridge<\u002Fbutton>\n    <\u002Fdiv>\n    <p style=\"margin: 8px 0 0; font-size: 9.5px; line-height: 1.5; letter-spacing: 0.06em; color: var(--c8a8072, #8a8072); text-transform: uppercase;\">{{ viewHint }}<\u002Fp>\n\n    <div style=\"display: flex; align-items: center; justify-content: space-between; margin: 22px 0 8px;\">\n      <p style=\"margin: 0; font-size: 10px; letter-spacing: 0.16em; color: var(--c948a7c, #948a7c); text-transform: uppercase;\">Phases · click to select<\u002Fp>\n      <button sc-camel-on-click=\"{{ soloActive }}\" title=\"Turn off every overlay except the selected phase\" style=\"background: none; border: none; padding: 0; font-family: inherit; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--c8a7f6d, #8a7f6d); cursor: pointer; border-bottom: 1px solid var(--c3a332a, #3a332a);\">Solo<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n      <sc-for list=\"{{ eras }}\" as=\"e\" hint-placeholder-count=\"5\">\n        <div>\n          <div style=\"display: flex; align-items: center; gap: 8px; margin: 0 0 4px;\">\n            <span style=\"font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c8a8072, #8a8072); white-space: nowrap;\">{{ e.label }}<\u002Fspan>\n            <span style=\"flex: 1; height: 1px; background: var(--c241f19, #241f19);\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 1px;\">\n            <sc-for list=\"{{ e.rows }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ p.select }}\" style=\"{{ p.rowStyle }}\">\n                <button sc-camel-on-click=\"{{ p.toggle }}\" title=\"Show or hide this phase as an underlay\" style=\"{{ p.dotStyle }}\"><\u002Fbutton>\n                <span style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;\">\n                  <span style=\"font-size: 11.5px; line-height: 1.25; text-wrap: pretty;\">{{ p.n }}<\u002Fspan>\n                  <span style=\"font-size: 9.5px; color: var(--c948a7c, #948a7c); letter-spacing: 0.03em;\">{{ p.short }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 20px; display: flex; flex-direction: column; gap: 12px;\">\n      <div style=\"{{ advBlock }}\">\n        <div style=\"display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.1em; color: var(--c948a7c, #948a7c); text-transform: uppercase; margin-bottom: 6px;\">\n          <span>Overlay opacity<\u002Fspan><span>{{ opPct }}<\u002Fspan>\n        <\u002Fdiv>\n        <input class=\"codsm\" type=\"range\" min=\"10\" max=\"100\" step=\"5\" value=\"{{ opVal }}\" sc-camel-on-change=\"{{ setOp }}\" style=\"width: 100%;\">\n      <\u002Fdiv>\n      <div style=\"padding: 11px 11px 12px; background: var(--c16130f, #16130f); border: 1px solid var(--c241f19, #241f19); border-radius: 4px;\">\n        <label style=\"display: flex; align-items: center; gap: 9px; cursor: pointer; font-size: 11.5px; color: var(--ce6dcc8, #e6dcc8);\">\n          <input type=\"checkbox\" checked=\"{{ present }}\" sc-camel-on-change=\"{{ togglePresent }}\" style=\"accent-color: var(--cd8cdb8, #d8cdb8); width: 13px; height: 13px;\">\n          <span>Modern map overlay<\u002Fspan>\n        <\u002Flabel>\n        <div style=\"{{ advBlock }}\">\n        <div style=\"display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.1em; color: var(--c948a7c, #948a7c); text-transform: uppercase; margin: 10px 0 6px;\">\n          <span>Transparency<\u002Fspan><span>{{ modernPct }}<\u002Fspan>\n        <\u002Fdiv>\n        <input class=\"codsm\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"{{ modernVal }}\" sc-camel-on-change=\"{{ setModern }}\" sc-camel-on-input=\"{{ setModern }}\" style=\"width: 100%;\">\n        <p style=\"margin: 8px 0 0; font-size: 10px; line-height: 1.5; color: var(--c948a7c, #948a7c);\">Present-day village and archaeological park: outline in plan, ground surface in section, standing buildings in the elevation and 3D views.<\u002Fp>\n\n        <div style=\"{{ advSat }}\">\n          <p style=\"margin: 0 0 8px; font-size: 10px; letter-spacing: 0.1em; color: var(--c948a7c, #948a7c); text-transform: uppercase;\">Satellite photo (plan view)<\u002Fp>\n          <label style=\"{{ satDropStyle }}\">\n            <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ satLoad }}\" style=\"display: none;\">\n            <span>{{ satPrompt }}<\u002Fspan>\n          <\u002Flabel>\n          <div style=\"{{ satCtlStyle }}\">\n            <div style=\"display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.1em; color: var(--c948a7c, #948a7c); text-transform: uppercase; margin: 11px 0 6px;\">\n              <span>Photo opacity<\u002Fspan><span>{{ satOpPct }}<\u002Fspan>\n            <\u002Fdiv>\n            <input class=\"codsm\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"{{ satOpVal }}\" sc-camel-on-change=\"{{ setSatOp }}\" sc-camel-on-input=\"{{ setSatOp }}\" style=\"width: 100%;\">\n            <p style=\"margin: 10px 0 6px; font-size: 10px; letter-spacing: 0.1em; color: var(--c948a7c, #948a7c); text-transform: uppercase;\">Align to the ridge<\u002Fp>\n            <div style=\"display: grid; grid-template-columns: 52px 1fr; gap: 6px 9px; align-items: center; font-size: 10px; color: var(--c9c9082, #9c9082);\">\n              <span>Scale<\u002Fspan><input class=\"codsm\" type=\"range\" min=\"20\" max=\"300\" step=\"1\" value=\"{{ satScaleVal }}\" sc-camel-on-change=\"{{ setSatScale }}\" sc-camel-on-input=\"{{ setSatScale }}\">\n              <span>Rotate<\u002Fspan><input class=\"codsm\" type=\"range\" min=\"-180\" max=\"180\" step=\"1\" value=\"{{ satRotVal }}\" sc-camel-on-change=\"{{ setSatRot }}\" sc-camel-on-input=\"{{ setSatRot }}\">\n              <span>Left–right<\u002Fspan><input class=\"codsm\" type=\"range\" min=\"-400\" max=\"400\" step=\"1\" value=\"{{ satDxVal }}\" sc-camel-on-change=\"{{ setSatDx }}\" sc-camel-on-input=\"{{ setSatDx }}\">\n              <span>Up–down<\u002Fspan><input class=\"codsm\" type=\"range\" min=\"-500\" max=\"500\" step=\"1\" value=\"{{ satDyVal }}\" sc-camel-on-change=\"{{ setSatDy }}\" sc-camel-on-input=\"{{ setSatDy }}\">\n              <span>Stretch<\u002Fspan><input class=\"codsm\" type=\"range\" min=\"40\" max=\"220\" step=\"1\" value=\"{{ satAspVal }}\" sc-camel-on-change=\"{{ setSatAsp }}\" sc-camel-on-input=\"{{ setSatAsp }}\">\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 6px; margin-top: 10px;\">\n              <button sc-camel-on-click=\"{{ satReset }}\" style=\"{{ satMiniBtn }}\">Reset alignment<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ satClear }}\" style=\"{{ satMiniBtn }}\">Remove<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin: 9px 0 0; font-size: 10px; line-height: 1.5; color: var(--c948a7c, #948a7c);\">{{ satHelp }}<\u002Fp>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <label style=\"display: flex; align-items: center; gap: 9px; cursor: pointer; font-size: 11.5px; color: var(--cc3b9a6, #c3b9a6);\">\n        <input type=\"checkbox\" checked=\"{{ labelsOn }}\" sc-camel-on-change=\"{{ toggleLabels }}\" style=\"accent-color: var(--cd8cdb8, #d8cdb8); width: 13px; height: 13px;\">\n        <span>Labels on drawing<\u002Fspan>\n      <\u002Flabel>\n      <label style=\"{{ peelRow }}\">\n        <input type=\"checkbox\" checked=\"{{ peelOn }}\" sc-camel-on-change=\"{{ togglePeel }}\" style=\"accent-color: var(--cd8cdb8, #d8cdb8); width: 13px; height: 13px; margin-top: 2px; flex: none;\">\n        <span>Peel away today's ground<br><span style=\"color: var(--c9c9082, #9c9082); font-size: 10.5px;\">See the ancient surface with the modern village taken off it<\u002Fspan><\u002Fspan>\n      <\u002Flabel>\n      <label style=\"display: flex; align-items: center; gap: 9px; cursor: pointer; font-size: 11.5px; color: var(--cc3b9a6, #c3b9a6);\">\n        <input type=\"checkbox\" checked=\"{{ scrOn }}\" sc-camel-on-change=\"{{ toggleScr }}\" style=\"accent-color: var(--cd8cdb8, #d8cdb8); width: 13px; height: 13px;\">\n        <span>Scripture references<\u002Fspan>\n      <\u002Flabel>\n      <button sc-camel-on-click=\"{{ toggleAdv }}\" style=\"{{ advBtn }}\">{{ advLabel }}<\u002Fbutton>\n\n      <div style=\"{{ vexRow }}\">\n        <div style=\"display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.1em; color: var(--c948a7c, #948a7c); text-transform: uppercase; margin-bottom: 6px;\">\n          <span>Height exaggeration<\u002Fspan><span>{{ vexLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <input class=\"codsm\" type=\"range\" min=\"10\" max=\"30\" step=\"1\" value=\"{{ vexVal }}\" sc-camel-on-change=\"{{ setVex }}\" sc-camel-on-input=\"{{ setVex }}\" style=\"width: 100%;\">\n        <div style=\"display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.1em; color: var(--c948a7c, #948a7c); text-transform: uppercase; margin: 16px 0 6px;\">\n          <span>See through the hill<\u002Fspan><span>{{ xrayLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <input class=\"codsm\" type=\"range\" min=\"10\" max=\"100\" step=\"1\" value=\"{{ xrayVal }}\" sc-camel-on-change=\"{{ setXray }}\" sc-camel-on-input=\"{{ setXray }}\" style=\"width: 100%;\">\n        <p style=\"margin: 7px 0 12px; font-size: 10px; line-height: 1.5; color: var(--c948a7c, #948a7c);\">Fade the hillside to glass to follow the water system underneath it — the spring at the foot of the Kidron, the shaft and tunnel inside the rock, the pool at the southern tip, and the buildings standing above them all.<\u002Fp>\n        <p style=\"margin: 7px 0 0; font-size: 10px; line-height: 1.5; color: var(--c948a7c, #948a7c);\">The ridge is genuinely subtle — about 100 m of fall over 700 m. Stretching heights makes the landform readable; plan distances stay true. Set it to 1.0 for the real shape.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin: 26px 0 10px; font-size: 10px; letter-spacing: 0.16em; color: var(--c948a7c, #948a7c); text-transform: uppercase;\">Key — what is on screen now<\u002Fp>\n    <div style=\"display: flex; flex-direction: column; gap: 9px; padding: 12px; background: var(--c16130f, #16130f); border: 1px solid var(--c241f19, #241f19); border-radius: 4px;\">\n      <sc-for list=\"{{ catKey }}\" as=\"k\" hint-placeholder-count=\"8\">\n        <div style=\"display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--cb3a894, #b3a894);\">\n          <svg width=\"34\" height=\"16\" sc-camel-view-box=\"0 0 34 16\" style=\"flex: none;\">\n            <defs>\n              <pattern id=\"hatchkey\" width=\"6\" height=\"6\" sc-camel-pattern-units=\"userSpaceOnUse\" sc-camel-pattern-transform=\"rotate(45)\">\n                <path d=\"M0 0 L0 6\" stroke=\"{{ hatchColor }}\" sc-camel-stroke-width=\"2\" opacity=\"0.8\"><\u002Fpath>\n              <\u002Fpattern>\n            <\u002Fdefs>\n            <path d=\"{{ k.d }}\" fill=\"{{ k.fill }}\" stroke=\"{{ k.stroke }}\" sc-camel-stroke-width=\"{{ k.sw }}\"><\u002Fpath>\n          <\u002Fsvg>\n          <span>{{ k.n }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <p style=\"margin: 22px 0 10px; font-size: 10px; letter-spacing: 0.16em; color: var(--c948a7c, #948a7c); text-transform: uppercase;\">Key — confidence<\u002Fp>\n    <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--c16130f, #16130f); border: 1px solid var(--c241f19, #241f19); border-radius: 4px;\">\n      <sc-for list=\"{{ confKey }}\" as=\"k\" hint-placeholder-count=\"4\">\n        <div style=\"display: flex; gap: 10px; align-items: flex-start;\">\n          <svg width=\"34\" height=\"10\" sc-camel-view-box=\"0 0 34 10\" style=\"flex: none; margin-top: 3px;\">\n            <path d=\"M1 5 L33 5\" stroke=\"{{ activeColor }}\" sc-camel-stroke-width=\"2.4\" sc-camel-stroke-dasharray=\"{{ k.dash }}\"><\u002Fpath>\n          <\u002Fsvg>\n          <div style=\"min-width: 0;\">\n            <div style=\"font-size: 11px; color: var(--cd3c9b6, #d3c9b6); letter-spacing: 0.04em;\">{{ k.n }}<\u002Fdiv>\n            <div style=\"font-size: 10.5px; color: var(--c9c9082, #9c9082); line-height: 1.45; margin-top: 2px;\">{{ k.d }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <p style=\"margin: 22px 0 8px; font-size: 10px; letter-spacing: 0.16em; color: var(--c948a7c, #948a7c); text-transform: uppercase;\">Base map<\u002Fp>\n    <p style=\"margin: 0; font-size: 10.5px; line-height: 1.6; color: var(--c9c9082, #9c9082);\">Schematic, north at top. The plan is a simplified rendering of the ridge, not a survey drawing. The cut views run north on the left, south on the right, and are drawn from published elevations: the crest falls from about 725 m to 624 m, the Gihon Spring sits at 636 m, and the pool at the southern tip is 30 cm lower — the whole fall of Hezekiah's Tunnel.<\u002Fp>\n  <\u002Faside>\n\n  <main data-pane=\"1\" style=\"{{ mainStyle }}\">\n    <div style=\"{{ paneTopStyle }}\">\n      <div style=\"min-width: 0; display: flex; align-items: baseline; gap: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">\n        <span style=\"font-family: 'EB Garamond', serif; font-size: 20px; color: var(--cf0e7d5, #f0e7d5); letter-spacing: 0.01em; overflow: hidden; text-overflow: ellipsis;\">{{ activeName }}<\u002Fspan>\n        <span style=\"flex: none; font-size: 11px; letter-spacing: 0.08em; color: {{ activeInk }};\">{{ activeSpan }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex: none; display: flex; gap: 6px;\">\n        <button sc-camel-on-click=\"{{ zoomOut }}\" style=\"{{ zoomBtn }}\">−<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ zoomIn }}\" style=\"{{ zoomBtn }}\">+<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ resetView }}\" style=\"{{ resetBtn }}\">Reset<\u002Fbutton>\n      <\u002Fdiv>\n    <\u gists are. This list is the full, screen-reader-accessible record of everything drawn on the map for this phase.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 5px;\">\n          <sc-for list=\"{{ elements }}\" as=\"e\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-mouse-enter=\"{{ e.enter }}\" sc-camel-on-click=\"{{ e.click }}\" sc-camel-on-key-down=\"{{ e.onKeyDown }}\" role=\"button\" sc-camel-tab-index=\"0\" aria-pressed=\"{{ e.pinned }}\" style=\"{{ e.style }}\">\n              <span style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;\">\n                <span style=\"font-size: 12.5px; line-height: 1.3;\">{{ e.n }}<\u002Fspan>\n                <span style=\"font-size: 10px; line-height: 1.35; color: var(--c948a7c, #948a7c);\">{{ e.formal }}<\u002Fspan>\n                <span style=\"{{ e.sayStyle }}\">{{ e.say }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"{{ e.chip }}\">{{ e.conf }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"{{ panelThinStyle }}\">\n        <p style=\"margin: 0 0 5px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--c8a7f6d, #8a7f6d);\">Why the drawing looks empty<\u002Fp>\n        <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.5; color: var(--cb3a894, #b3a894); text-wrap: pretty;\">{{ thinText }}<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"{{ scrBlockStyle }}\">\n        <p style=\"margin: 0 0 4px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--c948a7c, #948a7c);\">In scripture<\u002Fp>\n        <p style=\"margin: 0 0 14px; font-size: 10.5px; line-height: 1.5; color: var(--c948a7c, #948a7c);\">Passages that name what is drawn here, or that happen on this ground. Turn them off in the controls at left.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n          <sc-for list=\"{{ scrGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n            <div sc-camel-on-mouse-enter=\"{{ g.enter }}\" sc-camel-on-click=\"{{ g.click }}\" style=\"padding: 12px 14px; border: 1px solid var(--c241f19, #241f19); border-left: 2px solid {{ g.color }}; border-radius: 3px; background: var(--c16130f, #16130f); cursor: pointer;\">\n              <div style=\"font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c8a7f6d, #8a7f6d);\">{{ g.head }}<\u002Fdiv>\n              <div style=\"font-family: 'EB Garamond', serif; font-size: 16px; line-height: 1.25; color: var(--cf0e7d5, #f0e7d5); margin-top: 3px;\">{{ g.n }}<\u002Fdiv>\n              <p style=\"{{ g.ctxStyle }}\">{{ g.ctx }}<\u002Fp>\n              <div style=\"display: flex; flex-direction: column; gap: 9px; margin-top: 10px;\">\n                <sc-for list=\"{{ g.refs }}\" as=\"r\" hint-placeholder-count=\"2\">\n                  <div>\n                    <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; color: {{ g.ink }};\">{{ r.r }}<\u002Fdiv>\n                    <div style=\"font-size: 12px; line-height: 1.55; color: var(--cb3a894, #b3a894); margin-top: 2px; text-wrap: pretty;\">{{ r.t }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"max-width: 62ch;\">\n        <sc-for list=\"{{ essay }}\" as=\"b\" hint-placeholder-count=\"12\">\n          <p style=\"{{ b.style }}\">{{ b.t }}<\u002Fp>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"{{ endStyle }}\">\n        <p style=\"margin: 0 0 6px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ activeInk }};\">You have reached today<\u002Fp>\n        <h3 style=\"margin: 0 0 14px; font-family: 'EB Garamond', serif; font-weight: 400; font-size: 24px; line-height: 1.2; color: var(--cf4ecdb, #f4ecdb);\">Four and a half thousand years, one hillside<\u002Fh3>\n\n        <p style=\"margin: 0 0 18px; font-family: 'EB Garamond', serif; font-size: 16px; line-height: 1.6; color: var(--cd5cab7, #d5cab7); text-wrap: pretty;\">Everything you have just scrolled through is buried under a working village and an archaeological park roughly six hundred metres long. People still live above it, water still runs through the tunnel, and the digging is not finished.<\u002Fp>\n\n        <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c8a7f6d, #8a7f6d);\">What is still argued about<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px;\">\n          <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.5; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">Whether the Large Stone Structure is a tenth-century palace, a later building, or several buildings of different dates read as one.<\u002Fp>\n          <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.5; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">How big tenth-century Jerusalem actually was — a capital, or a modest highland town.<\u002Fp>\n          <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.5; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">Who cut the Middle Bronze pool and shaft system, and how much of it was ever a secret passage at all.<\u002Fp>\n        <\u002Fdiv>\n\n        <p style=\"margin: 0 0 7px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c8a7f6d, #8a7f6d);\">If you want to go further<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px;\">\n          <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.5; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">Read the excavation reports rather than the summaries — Shiloh, Reich and Shukron, Mazar. They disagree with each other in print, which is the most useful thing about them.<\u002Fp>\n          <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.5; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">Walk the tunnel if you ever get the chance. Five hundred and thirty-three metres of rock, cut by two teams working towards each other, is a different fact once your shoulders have touched both walls.<\u002Fp>\n          <p style=\"margin: 0; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.5; color: var(--ccec4b1, #cec4b1); text-wrap: pretty;\">Then run the slider again from the beginning and watch only the water. The whole city is an argument about one spring.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n          <button sc-camel-on-click=\"{{ restart }}\" style=\"{{ endBtn }}\">Start again at 4500 BC<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ openAbout }}\" style=\"{{ endBtn }}\">About this model<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"margin: 34px 0 0; padding-top: 16px; border-top: 1px solid var(--c241f19, #241f19); font-size: 10.5px; line-height: 1.6; color: var(--c948a7c, #948a7c);\">{{ wordNote }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"{{ timelineStyle }}\">\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px;\">\n      <span style=\"font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--c948a7c, #948a7c);\">Drag the slider through time<\u002Fspan>\n      <span style=\"font-family: 'EB Garamond', serif; font-size: 19px; color: var(--cf0e7d5, #f0e7d5);\">{{ yearLabel }}<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 10px; font-family: 'EB Garamond', serif; font-size: 15px; line-height: 1.4; color: var(--cd5cab7, #d5cab7); max-width: 92ch; text-wrap: pretty;\">{{ changeText }}<\u002Fp>\n    <div style=\"{{ timeTrackStyle }}\">\n      <div style=\"{{ bandStripStyle }}\">\n        <sc-for list=\"{{ bands }}\" as=\"b\" hint-placeholder-count=\"13\">\n          <div sc-camel-on-click=\"{{ b.select }}\" title=\"{{ b.n }}\" style=\"{{ b.style }}\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <input class=\"cod\" type=\"range\" min=\"0\" max=\"1000\" step=\"1\" value=\"{{ pos }}\" sc-camel-on-change=\"{{ setPos }}\" sc-camel-on-input=\"{{ setPos }}\" style=\"{{ timeSliderStyle }}\">\n      <div style=\"{{ tickRowStyle }}\">\n        <sc-for list=\"{{ ticks }}\" as=\"t\" hint-placeholder-count=\"8\">\n          <div style=\"{{ t.style }}\">{{ t.t }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; margin-top: 12px; padding-top: 9px; border-top: 1px solid var(--c1e1a15, #1e1a15);\">\n      <span style=\"font-size: 10px; letter-spacing: 0.08em; color: var(--c948a7c, #948a7c);\">Project Created by Taylor Halverson, Ph.D. (Beta mode)<\u002Fspan>\n      <span style=\"font-size: 9.5px; letter-spacing: 0.06em; color: var(--c8a8072, #8a8072); text-align: right;\">Sources, attributions and terms under Credits<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <div sc-camel-on-click=\"{{ closeUI }}\" style=\"{{ scrimStyle }}\"><\u002Fdiv>\n\n  <nav style=\"{{ barStyle }}\">\n    <sc-for list=\"{{ barItems }}\" as=\"b\" hint-placeholder-count=\"4\">\n      <button sc-camel-on-click=\"{{ b.click }}\" style=\"{{ b.style }}\">\n        <span style=\"{{ b.iconStyle }}\">{{ b.icon }}<\u002Fspan>\n        <span style=\"{{ b.labelStyle }}\">{{ b.label }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fnav>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:980},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;tsType&quot;:&quot;'dark'|'light'&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#c88a3c&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#c88a3c&quot;,&quot;#8fb4c4&quot;,&quot;#b1402c&quot;,&quot;#a89a7c&quot;],&quot;section&quot;:&quot;Appearance&quot;},&quot;startView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;plan&quot;,&quot;options&quot;:[&quot;plan&quot;,&quot;section&quot;,&quot;elev&quot;,&quot;3d&quot;],&quot;tsType&quot;:&quot;'plan'|'section'|'elev'|'3d'&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;overlayOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.42,&quot;min&quot;:0.1,&quot;max&quot;:1,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;modernOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.55,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;showPresent&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Appearance&quot;}}\">\nconst LIGHT = {\n    '#0d0b09': '#f6f3ec',\n    '#0f0d0a': '#cfccc7',\n    '#100d09': '#f1ede4',\n    '#100e0b': '#f1ede4',\n    '#121211': '#eeeae0',\n    '#131009': '#efeade',\n    '#16130f': '#ebe6da',\n    '#171410': '#ebe6da',\n    '#1a1a17': '#e9e4d8',\n    '#1c1508': '#c9bfae',\n    '#1e1a15': '#e3ddd0',\n    '#221d17': '#ded7c8',\n    '#241f19': '#dbd4c4',\n    '#2a241d': '#d4ccba',\n    '#2d2c26': '#e4dfd2',\n    '#2e2820': '#cfc7b4',\n    '#322b22': '#cbc2ae',\n    '#332c22': '#e7e1d2',\n    '#332c24': '#cbc2ae',\n    '#3a3228': '#c3b9a3',\n    '#3a332a': '#c3b9a3',\n    '#3d3b34': '#95938b',\n    '#4a4034': '#b6ab93',\n    '#4a4740': '#88857d',\n    '#4fb0a3': '#007469',\n    '#4fb289': '#007651',\n    '#54503f': '#817d6b',\n    '#5a5548': '#7c7669',\n    '#5aa6d4': '#166b96',\n    '#5d5140': '#827768',\n    '#8a8072': '#5b5344',\n    '#948a7c': '#5f5748',\n    '#6f6a5c': '#676254',\n    '#736d5e': '#655f50',\n    '#9a9183': '#615948',\n    '#7a6a52': '#685e50',\n    '#9c9082': '#665d4d',\n    '#7f7a6c': '#585346',\n    '#8a7c66': '#584f40',\n    '#8a7f6d': '#554d3e',\n    '#8f897a': '#4b4638',\n    '#8f8b7d': '#484538',\n    '#8fb4c4': '#146d8a',\n    '#8fd0e8': '#0d6e88',\n    '#93b3cc': '#2d6992',\n    '#96bb62': '#4f700e',\n    '#9a9184': '#453d32',\n    '#9d8a6c': '#4b4234',\n    '#9d8f78': '#473e30',\n    '#9e9989': '#3d392b',\n    '#9fb0bd': '#1e2b35',\n    '#a1957f': '#423a2c',\n    '#a29177': '#453c2e',\n    '#a49a87': '#3e3628',\n    '#a596d4': '#675891',\n    '#a6d3e6': '#126d8a',\n    '#a89a7c': '#3d3628',\n    '#a89a80': '#3e3628',\n    '#b1402c': '#a83824',\n    '#b3a894': '#332b1d',\n    '#b3ad9a': '#2e291b',\n    '#b6a385': '#362e20',\n    '#b8946c': '#845922',\n    '#b9b3a4': '#292418',\n    '#bcb2a0': '#2b2416',\n    '#bd5641': '#a33e2a',\n    '#c3b9a6': '#261f11',\n    '#c3ccd4': '#316893',\n    '#c88a3c': '#8e5400',\n    '#c8b99c': '#251e11',\n    '#cbbda3': '#231c0e',\n    '#cec4b1': '#1e170a',\n    '#d3c9b6': '#1a1407',\n    '#d4553c': '#ad3018',\n    '#d5cab7': '#1a1306',\n    '#d5cbb8': '#191206',\n    '#d8cbb2': '#191206',\n    '#d8cdb8': '#181105',\n    '#d9a662': '#875805',\n    '#d9cfba': '#161004',\n    '#dcbd4c': '#7d5f00',\n    '#ded4c2': '#130c02',\n    '#e0a75c': '#8a5600',\n    '#e6dcc8': '#100a01',\n    '#e89a45': '#964e00',\n    '#efe2c6': '#100a01',\n    '#efe6d3': '#100a01',\n    '#f0c877': '#815c00',\n    '#f0e7d5': '#100a01',\n    '#f4ecdb': '#100a02',\n    '#f6efe0': '#0f0a03',\n    '#fdf6e6': '#0f0a02',\n    '#ffdfa4': '#110a01',\n    'rgba(13,11,9,0.9)': 'rgba(252,250,245,0.92)',\n    'rgba(13,11,9,0.88)': 'rgba(252,250,245,0.9)',\n    'rgba(16,14,11,0.85)': 'rgba(250,247,241,0.9)',\n    'rgba(9,8,6,0.94)': 'rgba(247,244,236,0.95)',\n    'rgba(255,255,255,0.055)': 'rgba(60,48,30,0.07)',\n    'rgba(255,255,255,0.06)': 'rgba(60,48,30,0.08)',\n    'rgba(255,255,255,0.03)': 'rgba(60,48,30,0.05)',\n    'rgba(154,145,132,0.10)': 'rgba(90,80,62,0.13)',\n    'rgba(239,230,211,0.10)': 'rgba(62,52,34,0.10)',\n    'rgba(0,0,0,0.6)': 'rgba(0,0,0,0.16)',\n    'rgba(0,0,0,0.7)': 'rgba(0,0,0,0.2)'\n  };\n\n  const ANCH = [[-4500,0],[-3000,80],[-1900,150],[-1550,210],[-1200,265],[-1000,315],[-800,380],[-587,450],[-538,470],[-63,570],[-37,585],[70,625],[324,680],[638,735],[1099,800],[1917,900],[2026,1000]];\nconst CAT = {\n  water:      { fill: 0.30, sw: 2.0,  n: 'Water system — spring, pool, channel, tunnel' },\n  fort:       { fill: 0.20, sw: 3.4,  n: 'Fortification — wall, tower, terrace mantle' },\n  monument:   { fill: 0.28, sw: 2.4,  n: 'Monumental or public building' },\n  domestic:   { fill: 0.16, sw: 1.2,  n: 'Houses and ordinary buildings' },\n  street:     { fill: 0.00, sw: 12,   n: 'Street or paved route' },\n  extent:     { fill: 0.07, sw: 1.4,  n: 'Reconstructed extent of settlement' },\n  destruction:{ fill: 0.24, sw: 1.2,  n: 'Destruction, burning or collapse' },\n  find:       { fill: 0.72, sw: 1.0,  n: 'Find spot of a specific object' },\n  burial:     { fill: 0.20, sw: 1.2,  n: 'Burial' },\n  excav:      { fill: 0.06, sw: 1.4,  n: 'Modern excavation area' },\n  modern:     { fill: 0.10, sw: 1.2,  n: 'Modern village / park' },\n  agri:       { fill: 0.00, sw: 2.0,  n: 'Agricultural terracing' }\n};\nconst CONF = {\n  secure:      { dash: '',        n: 'Secure',      d: 'Excavated, published, not seriously disputed.', say: 'Dug up and agreed on.' },\n  probable:    { dash: '7 4',
